      + '<span class="dmon">' + (showMon ? esc(mon) : '') + '</span>'
      + fmtDay(d) + '</th>';
  }).join('');
}

function dateCellsHtml(r) {
  if (!r.start || !r.end) {
    return DATE_COLS.map(function () { return '<td class="date-td"></td>'; }).join('');
  }
  var s = new Date(r.start), e = new Date(r.end);
  var color = colorFor(r.machine);
  var firstActive = true;
  return DATE_COLS.map(function (d) {
    var isToday = d.getTime() === TODAY.getTime();
    var active = d >= s && d < e;
    var cls = 'date-td' + (isToday ? ' is-today-col' : '');
    var fill = '';
    if (active) {
      // Machine number printed in the bar's first cell: colour alone cannot be read by the
      // ~8% of the floor with red-green deficiency, and the legend is off-screen once the
      // planner has scrolled. The hue stays for fast pattern-scanning; the digit is the fact.
      var label = firstActive ? '<span class="mnum">' + esc(r.machine) + '</span>' : '';
      firstActive = false;
      fill = '<span class="date-fill" style="background:' + color + '" title="'
        + esc('M' + r.machine + ' · ' + r.code + ': ' + fmtDate(s) + '–' + fmtDate(e))
        + '">' + label + '</span>';
    }
    return '<td class="' + cls + '">' + fill + '</td>';
  }).join('');
}

function proportionalBar(r) {
  if (!r.start || !r.end || !DATE_COLS.length) return '<span class="cbar-empty">not scheduled</span>';
  var rangeStart = DATE_COLS[0].getTime();
  var totalMs = DATE_COLS[DATE_COLS.length - 1].getTime() - rangeStart + 86400000;
  function pct(d) { return Math.max(0, Math.min(100, ((d - rangeStart) / totalMs) * 100)); }
  var s = new Date(r.start), e = new Date(r.end);
  var left = pct(s.getTime()), width = Math.max(1.5, pct(e.getTime()) - left);
  var todayPct = pct(TODAY.getTime());
  var todayMark = (todayPct >= 0 && todayPct <= 100) ? '<div class="today-mark" style="left:' + todayPct + '%"></div>' : '';
  return '<div class="prop-bar">' + todayMark +
    '<div class="fill" style="left:' + left + '%;width:' + width + '%;background:' + colorFor(r.machine) + '"></div></div>';
}

// Extra-compact mobile timeline: a slim bar positioned across the whole date range, with a start
// dot + end dot and their dates labelled inline. One line, no horizontal scroll.
function compactBar(r) {
  if (!r.start || !r.end || !DATE_COLS.length) {
    return '<div class="cbar-empty">not scheduled</div>';
  }
  var rangeStart = DATE_COLS[0].getTime();
  var totalMs = DATE_COLS[DATE_COLS.length - 1].getTime() - rangeStart + 86400000;
  function pct(t) { return Math.max(0, Math.min(100, ((t - rangeStart) / totalMs) * 100)); }
  var s = new Date(r.start), e = new Date(r.end);
  var left = pct(s.getTime()), right = pct(e.getTime());
  var width = Math.max(2, right - left);
  var color = colorFor(r.machine);
  var todayPct = pct(TODAY.getTime());
  var todayMark = (todayPct >= 0 && todayPct <= 100)
    ? '<i class="cbar-today" style="left:' + todayPct + '%"></i>' : '';
  return '<div class="cbar">' +
    '<span class="cbar-lbl start is-filled">' + fmtDate(s) + '</span>' +
    '<div class="cbar-track">' + todayMark +
      '<div class="cbar-fill" style="left:' + left + '%;width:' + width + '%;background:' + color + '"></div>' +
      '<i class="cbar-dot" style="left:' + left + '%;background:' + color + '"></i>' +
      '<i class="cbar-dot" style="left:' + right + '%;background:' + color + '"></i>' +
    '</div>' +
    '<span class="cbar-lbl end is-filled">' + fmtDate(e) + '</span>' +
  '</div>';
}

// The Open board's groups, in display order. Shared with the download so the file is grouped
// and ordered exactly like the screen.
// `unplanned` (not started, not planned) is always one group at the very bottom, whatever the
// tab or sort: it has no machine, no priority and no dates to sort or group it by.
var UNPLANNED_KEY = '~unplanned';
function openGroups(rows, unplanned) {
  var g = groupKeyFns()[VIEW];
  var groups = {};
  var order = [];
  rows.forEach(function (r) {
    var k = g.key(r);
    if (!groups[k]) { groups[k] = { label: g.label(r), rows: [] }; order.push(k); }
    groups[k].rows.push(r);
  });
  sortOpenOrder(order, groups);
  order.forEach(function (k) { groups[k].rows.sort(openRowCmp); });
  if (unplanned && unplanned.length) {
    groups[UNPLANNED_KEY] = { label: 'Not started · not planned', rows: unplanned.slice().sort(function (a, b) {
      return cmpNat(b.po, a.po) || cmpNat(a.code, b.code);
    }) };
    order.push(UNPLANNED_KEY);
  }
  return { groups: groups, order: order };
}

// Rows inside a group. By PO lists its products by code; By Product lists its POs newest
// first. Machine and Colour keep the planner's Priority order, which is the run sequence.
function openRowCmp(a, b) {
  if (VIEW === 'po') return cmpNat(a.code, b.code);
  if (VIEW === 'product') return cmpNat(b.po, a.po);
  return (a.priority || 999) - (b.priority || 999);
}

function earliestStart(rows) {
  return rows.reduce(function (m, r) { return r.start && (!m || r.start < m) ? r.start : m; }, '');
}

// numeric:true (cmpNat) so PO-10 sorts after PO-9 rather than before it.
function sortOpenOrder(order, groups) {
  if (VIEW === 'machine') { order.sort(function (a, b) { return Number(a) - Number(b); }); return; }
  if (VIEW === 'color') { order.sort(cmpNat); return; }
  var s = groupSort();
  var bal = function (k) { return sumRows(groups[k].rows).balance; };
  var start = function (k) { return earliestStart(groups[k].rows) || '9999'; };
  order.sort(function (a, b) {
    if (s === 'bal') return bal(b) - bal(a) || cmpNat(a, b);
    if (s === 'start') return start(a) < start(b) ? -1 : start(a) > start(b) ? 1 : cmpNat(a, b);
    if (s === 'old' || s === 'code') return cmpNat(a, b);
    return cmpNat(b, a);   // 'new'
  });
}

function render() {
  if (MODE === 'done') { renderCompleted(); return; }
  var g = groupKeyFns()[VIEW];
  var filteredRows = applyFilter(ROWS);
  var unplannedRows = applyFilter(UNPLANNED);
  var showRmMb = VIEW === 'color';

  computeDateCols(filteredRows);
  MACHINES_SEEN = Array.from(new Set(applyFilter(ROWS, true).map(function (r) { return r.machine; }))).sort(function (a, b) { return a - b; });

  var grouped = openGroups(filteredRows, unplannedRows);
  var groups = grouped.groups;
  var order = grouped.order;
  GROUP_KEYS = order.slice();
  // Header line for a group: count, and what is still to make, so a folded group still says
  // whether it matters.
  var groupSub = function (grp) {
    var n = grp.rows.length;
    return n + ' item' + (n === 1 ? '' : 's') + ' · ' + fmtNum(sumRows(grp.rows).balance) + ' left';
  };

  var grand = sumRows(filteredRows.concat(unplannedRows));

  if (!order.length) {
    // An empty schedule and a filter that matched nothing are different facts. Saying
    // "no rows match" when the sheet is simply empty sends the reader hunting for a filter
    // that isn't set.
    // Three different facts, three different messages. "No jobs scheduled" when the sheet is
    // actually full of completed rows would send the reader looking for missing data.
    var emptyMsg;
    if (PICKED.length) {
      emptyMsg = '<div class="empty">No open lines for ' + esc(PICKED.join(', ')) + (hasMachineSel() ? ' on machine ' + esc(machineSelText()) : '') + '.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear products</button></div>';
    } else if (FILTER) {
      emptyMsg = '<div class="empty">No jobs match “' + esc(FILTER) + '”.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear filter</button></div>';
    } else if (hasMachineSel()) {
      emptyMsg = '<div class="empty">No open jobs on machine ' + esc(machineSelText()) + '.'
        + ' <button type="button" class="linkish" id="emptyMachines">Show all machines</button></div>';
    } else if (ROWS.length) {
      emptyMsg = '<div class="empty">Nothing outstanding — every job on the sheet is fully supplied.</div>';
    } else {
      emptyMsg = '<div class="empty">No jobs scheduled.</div>';
    }
    var mainEl = document.getElementById('main');
    mainEl.innerHTML = emptyMsg;
    mainEl.setAttribute('aria-busy', 'false');
    var ec = document.getElementById('emptyClear');
    if (ec) ec.addEventListener('click', clearFilter);
    var em = document.getElementById('emptyMachines');
    if (em) em.addEventListener('click', function () { MACHINE_SEL = {}; render(); });
    return;
  }

  var html = groupBarHtml();

  // ---- legend ----
  html += '<div class="legend">';
  MACHINES_SEEN.forEach(function (m) {
    var on = !!MACHINE_SEL[String(m)];
    html += '<button type="button" class="chip mchip' + (on ? ' on' : '') + '" data-machine="' + esc(m) +
      '" aria-pressed="' + on + '" aria-label="Machine ' + esc(m) + '"><i style="background:' + colorFor(m) + '"></i><span class="mword">Machine </span>' + esc(m) + '</button>';
  });
  if (hasMachineSel()) {
    html += '<button type="button" class="chip chip-clear" id="machineClear"><span aria-hidden="true">✕</span> All machines</button>';
  }
  html += '<span class="today-chip"><i></i>Today</span>';
  html += '<button type="button" class="jump-today" id="jumpToday">Jump to today</button>';
  html += '</div>';

  // Full words, not "Sup"/"D" — the abbreviations were unglossable and inconsistent with the
  // other two renderings, which spelled the same metrics differently again.
  var extraTh = showRmMb ? '<th scope="col">RM Req</th><th scope="col">MB</th>' : '';
  var dateHeader = dateHeaderHtml();
  var totalCols = 7 + (showRmMb ? 2 : 0) + DATE_COLS.length;

  // ---- desktop: single unified table ----
  html += '<div class="table-scroll"><table><thead><tr>' +
    '<th scope="col">Code</th><th scope="col">Item</th><th scope="col">Qty</th>'
    + '<th scope="col">Supplied</th><th scope="col">Ready</th><th scope="col">Balance</th>'
    + extraTh + '<th scope="col">Days</th>' + dateHeader +
    '</tr></thead><tbody>';
  order.forEach(function (k, gi) {
    var grp = groups[k];
    var sub = sumRows(grp.rows);
    var gm = ' data-gm="' + gi + '"', fc = foldCls(k);
    // .gh-pin holds the header to the left edge: the board opens scrolled sideways to today,
    // which otherwise leaves the PO name and its fold button off-screen.
    html += '<tr class="group-row" data-gh="' + gi + '"><td colspan="' + totalCols + '"><div class="gh-pin"><span>' + groupToggle(gi, grp.label) + '</span>' +
      '<span class="sub">' + groupSub(grp) + '</span></div></td></tr>';
    grp.rows.forEach(function (r) {
      var extraTd = showRmMb ? '<td class="num">' + fmtNum(r.rmReq) + '</td><td class="num">' + fmtNum(r.mb) + '</td>' : '';
      html += '<tr' + gm + (fc ? ' class="' + fc.trim() + '"' : '') + '><td class="data-col">' + codeChipHtml(r.code, r.color, 'code-chip') + '</td>' +
        '<td class="data-col">' + esc(r.name) + '</td>' +
        '<td class="num">' + fmtNum(r.orderQty) + '</td><td class="num">' + fmtNum(r.supplied) + '</td>' +
        '<td class="num">' + fmtNum(r.readyStock) + '</td>' +
        '<td class="num' + (Number(r.balance) < 0 ? ' is-neg' : '') + '">' + fmtNum(r.balance) + '</td>' + extraTd +
        '<td class="num">' + esc(r.days || '—') + '</td>' + dateCellsHtml(r) + '</tr>';
    });
    var extraTf = showRmMb ? '<td class="num">' + fmtNum(sub.rmReq) + '</td><td class="num">' + fmtNum(sub.mb) + '</td>' : '';
    var dateFootCells = DATE_COLS.map(function () { return '<td class="date-td"></td>'; }).join('');
    html += '<tr class="subtotal-row"><td colspan="2">Subtotal</td>' +
      '<td class="num">' + fmtNum(sub.orderQty) + '</td><td class="num">' + fmtNum(sub.supplied) + '</td>' +
      '<td class="num">' + fmtNum(sub.readyStock) + '</td>' +
      '<td class="num">' + fmtNum(sub.balance) + '</td>' + extraTf + '<td></td>' + dateFootCells + '</tr>';
  });
  html += '</tbody></table></div>';

  // ---- tablet: proportional single-bar rows, still dense/tabular ----
  html += '<div class="tablet-cards">';
  // One label row for the whole list — a sibling of the groups, for the same reason as the
  // mobile row above: sticky cannot escape its parent, so a per-group row would pin only
  // within its own group and stack with every other group's copy.
  html += '<div class="tcard-head">' +
    '<div>Item</div><div>Qty</div><div>Supplied</div><div>Ready</div>' +
    '<div>Balance</div><div>Days</div><div>Timeline</div></div>';
  order.forEach(function (k, gi) {
    var grp = groups[k];
    var sub = sumRows(grp.rows);
    html += '<div class="tcard-group" data-gh="' + gi + '"><span>' + groupToggle(gi, grp.label) + '</span><span class="sub">' + groupSub(grp) + '</span></div>';
    grp.rows.forEach(function (r) {
      var tHex = productHex(r.color);
      html += '<div class="tcard' + foldCls(k) + '" data-gm="' + gi + '"' + (tHex ? ' style="--pc:' + tHex + '"' : '') + '>' +
        '<span class="code">' + codeChipHtml(r.code, r.color, 'code-chip') +
        '<small>' + esc(r.name) + '</small></span>' +
        '<span class="val"><span class="lbl">Qty</span>' + fmtNum(r.orderQty) + '</span>' +
        '<span class="val"><span class="lbl">Supplied</span>' + fmtNum(r.supplied) + '</span>' +
        '<span class="val"><span class="lbl">Ready</span>' + fmtNum(r.readyStock) + '</span>' +
        '<span class="val' + (Number(r.balance) < 0 ? ' is-neg' : '') + '"><span class="lbl">Balance</span>' + fmtNum(r.balance) + '</span>' +
        '<span class="val"><span class="lbl">Days</span>' + esc(r.days || '—') + '</span>' +
        proportionalBar(r) +
        '</div>';
    });
    // Eight cells to match .tcard's eight tracks: label, the five metrics, then the bar
    // column left empty. Days has no meaningful total.
    html += '<div class="tcard-sub">' +
      '<span class="lead">Subtotal</span>' +
      '<span class="val">' + fmtNum(sub.orderQty) + '</span>' +
      '<span class="val">' + fmtNum(sub.supplied) + '</span>' +
      '<span class="val">' + fmtNum(sub.readyStock) + '</span>' +
      '<span class="val">' + fmtNum(sub.balance) + '</span>' +
      '<span></span>' +
      '<span></span>' +
      '</div>';
  });
  html += '</div>';

  // ---- mobile: stacked cards, minimal, one bar with start/end labels ----
  //
  // ONE definition of the columns, used by the sticky header, every card, and the subtotal.
  // Previously each of the three emitted its own cells and they had to be kept in step by
  // hand — which they were not: Color view carried seven cells per card against a five-cell
  // subtotal, so every total sat under the wrong figure.
  //
  // Repeating "Qty / Supplied / Ready / …" inside all ~40 cards is what forced the grid to
  // 58px minimum tracks and made 7 columns wrap to 5+2 on a 360px phone. The labels move to
  // ONE sticky row per group, so the cells only have to fit a number and the whole row lands
  // on one line — which is also what makes the card and its subtotal line up.
  var cols = [
    { label: 'Qty', cell: function (r) { return '<b>' + fmtNum(r.orderQty) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.orderQty) + '</b>'; } },
    { label: 'Supplied', cell: function (r) { return '<b>' + fmtNum(r.supplied) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.supplied) + '</b>'; } },
    { label: 'Ready', cell: function (r) { return '<b>' + fmtNum(r.readyStock) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.readyStock) + '</b>'; } },
    { label: 'Balance',
      cell: function (r) { return '<b' + (Number(r.balance) < 0 ? ' class="is-neg"' : '') + '>' + fmtNum(r.balance) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.balance) + '</b>'; } },
    { label: 'Days', cell: function (r) { return '<b>' + esc(r.days || '—') + '</b>'; } },
  ];
  if (showRmMb) {
    cols.push({ label: 'RM Req', cell: function (r) { return '<b>' + fmtNum(r.rmReq) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.rmReq) + '</b>'; } });
    cols.push({ label: 'MB', cell: function (r) { return '<b>' + fmtNum(r.mb) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.mb) + '</b>'; } });
  } else {
    // Colour as text, since the card's left edge bar is unlabelled hue on its own. Dropped in
    // Color view, where the group header already names it and the two extra metrics need room.
    cols.push({ label: 'Color',
      cell: function (r) { return '<b>' + (String(r.color || '').trim() ? esc(r.color) : '—') + '</b>'; } });
  }
  // Fixed track count, not auto-fit: auto-fit re-flows to whatever fits, so the card and the
  // subtotal could resolve to different columns-per-row and stop lining up.
  // --cols also drives the column separators, which are painted as one repeating gradient at
  // the track pitch rather than as a border on every cell — same value, so the rules cannot
  // land anywhere but on the track edges.
  var colStyle = ' style="grid-template-columns:repeat(' + cols.length + ',1fr);--cols:' + cols.length + '"';
  var headCells = cols.map(function (c) { return '<div>' + esc(c.label) + '</div>'; }).join('');

  // The column labels pin for the WHOLE list (a sibling of the groups, emitted once), and each
  // group's name pins BELOW them for the length of that group, handing off to the next group as
  // it scrolls up. So the reader always has both: what the columns mean, and which group the
  // rows on screen belong to.
  // The two must occupy different offsets — when both sat at top:0 the group name covered the
  // labels, and a per-group copy of the labels stacked one pinned row per group.
  html += '<div class="cards">';
  html += '<div class="metric-head"' + colStyle + '>' + headCells + '</div>';
  order.forEach(function (k, gi) {
    var grp = groups[k];
    var sub = sumRows(grp.rows);
    html += '<div class="card-group-head" data-gh="' + gi + '"><span>' + groupToggle(gi, grp.label) + '</span><span class="sub">' + groupSub(grp) + '</span></div>';
    grp.rows.forEach(function (r) {
      // Machine chip: the mobile card's bar is a thin colour strip, far too small to identify
      // a machine by hue on a phone. The number states it. An unplanned line has no machine.
      var mch = String(r.machine || '').trim()
        ? '<span class="mch" style="background:' + colorFor(r.machine) + '">M' + esc(r.machine) + '</span>' : '';
      // In Product view the group header already names the product, so the per-item line shows the
      // PO number instead of repeating the product name.
      // Product view shows the PO in the chip instead of the code, but the chip is still tinted:
      // in this view the group is one product, so every card under the header IS that colour —
      // the tint describes the row, not the PO number itself.
      var topLine = (VIEW === 'product')
        ? codeChipHtml(r.po, r.color, 'code') + mch
        : codeChipHtml(r.code, r.color, 'code') + mch
          + '<span class="name">' + esc(r.name) + '</span>';
      var mHex = productHex(r.color);
      html += '<div class="card' + foldCls(k) + '" data-gm="' + gi + '"' + (mHex ? ' style="--pc:' + mHex + '"' : '') + '>' +
        '<div class="card-top">' + topLine + '</div>' +
        '<div class="metric-row"' + colStyle + '>' +
        cols.map(function (c) { return '<div>' + c.cell(r) + '</div>'; }).join('') +
        '</div>' + compactBar(r) + '</div>';
    });
    // Mobile was the only rendering without a group subtotal — `sub` was computed and then
    // discarded — leaving the manager in transit, the person least able to add figures in
    // their head, as the only one asked to.
    // Driven by the SAME column list as the cards and the sticky header, so the three grids
    // cannot disagree about how many cells they hold. Columns with no meaningful total
    // (Days, Color) render empty rather than an invented number.
    html += '<div class="card-sub-label">Subtotal</div>' +
      '<div class="card-sub"' + colStyle + '>' +
      cols.map(function (c) { return '<div>' + (c.total ? c.total(sub) : '') + '</div>'; }).join('') +
      '</div>';
  });
  html += '</div>';

  var grandExtra = showRmMb
    ? '<div><span>RM Req</span><b>' + fmtNum(grand.rmReq) + '</b></div><div><span>MB</span><b>' + fmtNum(grand.mb) + '</b></div>'
    : '';
  html += '<div class="grand">' +
    '<div><span>Order Qty</span><b>' + fmtNum(grand.orderQty) + '</b></div>' +
    '<div><span>Supplied</span><b>' + fmtNum(grand.supplied) + '</b></div>' +
    '<div><span>Ready Stock</span><b>' + fmtNum(grand.readyStock) + '</b></div>' +
    '<div><span>Balance</span><b>' + fmtNum(grand.balance) + '</b></div>' +
    grandExtra +
    '</div>';

  var mainEl = document.getElementById('main');
  mainEl.innerHTML = html;
  mainEl.setAttribute('aria-busy', 'false');

  measureFrozenOffset();
  bindGroupControls(mainEl);
  var jt = document.getElementById('jumpToday');
  if (jt) jt.addEventListener('click', scrollToToday);
  mainEl.querySelectorAll('[data-machine]').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.dataset.machine;
      if (MACHINE_SEL[m]) delete MACHINE_SEL[m]; else MACHINE_SEL[m] = true;
      render();
    });
  });
  var mc = document.getElementById('machineClear');
  if (mc) mc.addEventListener('click', function () { MACHINE_SEL = {}; render(); });
  scrollToToday();
}

/* ---------------------------------------------------------------------------
   Completed view — lines taken off the plan, with OTD / OTIF.

   The sheet sends facts only (PO date, order qty, supplied, invoices with dates) plus the two
   Settings values; every rule lives here, once, so the three tabs and the KPI strip cannot
   disagree:
     due       = PO Date + lead time
     delivered = date of the LAST invoice on the line (a split delivery is late if its last
                 part is late)
     OTD       = delivered <= due
     in full   = supplied >= order qty x (1 - tolerance)
     OTIF      = OTD and in full
   A line with no invoice, an invoice whose date is not on the Invoices tab, or no Order Qty
   cannot be judged; it is counted separately rather than silently scored as a pass or a fail.
   Dates travel as 'yyyy-MM-dd' IST day strings and are compared as whole days.
   --------------------------------------------------------------------------- */
function dayNum(iso) {
  var p = String(iso).split('-');
  return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) / 86400000;
}
function isoFromDayNum(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function fmtIso(iso) {
  if (!iso) return '—';
  return new Date(dayNum(iso) * 86400000)
    .toLocaleDateString('en-IN', { day: '2-digit', month: 'short', timeZone: 'UTC' });
}
// Days against due, in words rather than signed numbers: "15d early", "31d late".
function fmtLate(n) {
  if (n === null) return '<span class="is-na">—</span>';
  if (n === 0) return '<span class="late-good">on due date</span>';
  return n > 0
    ? '<span class="late-bad">' + n + 'd late</span>'
    : '<span class="late-good">' + (-n) + 'd early</span>';
}
function pct(n, d) { return d ? Math.round((n / d) * 100) + '%' : '—'; }

// One badge per line instead of three Yes/No columns.
function statusBadge(l) {
  if (l.onPlan) return '<span class="st st-na">○ On plan</span>';
  if (l.status !== 'ok') return '<span class="st st-na">– ' + esc(l.status) + '</span>';
  if (l.otd && l.inFull) return '<span class="st st-good">✓ OTIF</span>';
  if (!l.otd && !l.inFull) return '<span class="st st-bad">✗ Late + Short</span>';
  return l.otd
    ? '<span class="st st-warn">◐ Short</span>'
    : '<span class="st st-warn">◷ Late</span>';
}

// Percentage tone: green at 95%+, amber 80–94%, red below 80%.
function pctTone(n, d) {
  if (!d) return 'st-na';
  var p = (n / d) * 100;
  return p >= 95 ? 'st-good' : p >= 80 ? 'st-warn' : 'st-bad';
}
function pctChip(label, n, d) {
  return '<span class="st ' + pctTone(n, d) + '">' + esc(label) + ' ' + pct(n, d) + '</span>';
}

function judgeLine(line, leadDays, tolerancePct) {
  var due = line.poDate ? isoFromDayNum(dayNum(line.poDate) + leadDays) : null;
  var inFull = line.orderQty > 0 ? line.supplied >= line.orderQty * (1 - tolerancePct / 100) : null;
  var status = 'ok';
  if (!line.invoices.length) status = 'no invoice';
  else if (line.invoices.some(function (i) { return !i.date; })) status = 'invoice date missing';
  else if (!due) status = 'no PO date';
  else if (!(line.orderQty > 0)) status = 'no order qty';
  var delivered = null, late = null, otd = null, otif = null;
  if (status === 'ok') {
    delivered = line.invoices.reduce(function (a, i) { return i.date > a ? i.date : a; }, '');
    late = dayNum(delivered) - dayNum(due);
    otd = late <= 0;
    otif = otd && inFull === true;
  }
  return { due: due, delivered: delivered, late: late, otd: otd, inFull: inFull, otif: otif, status: status };
}

function judgedLines() {
  var lead = COMPLETED.leadDays, tol = COMPLETED.tolerancePct;
  return COMPLETED.lines.map(function (l) {
    var j = judgeLine(l, lead, tol);
    Object.keys(l).forEach(function (k) { j[k] = l[k]; });
    // Still on the plan: not finished, so not judged. Any status but 'ok' keeps it out of every
    // OTD/OTIF count. Delivered still shows its latest invoice, for sorting and date filters.
    if (j.onPlan) {
      j.status = 'On plan';
      j.late = j.otd = j.otif = null;
      j.delivered = l.invoices.reduce(function (a, i) { return i.date && i.date > a ? i.date : a; }, '') || null;
    }
    return j;
  });
}

/* Filters for By Invoice / By PO / By Product. The date range applies to the delivered date
   (in By Invoice, each invoice's own date) or to the PO date. Dates are 'yyyy-MM-dd', so
   plain string comparison orders them correctly. */
var LIST_DEFAULT = { status: '', brand: '', type: '', color: '', machine: '', dateBy: 'delivered', from: '', to: '', preset: '', _panel: '' };
var LIST = Object.assign({}, LIST_DEFAULT);

function inRange(day) {
  if (!LIST.from && !LIST.to) return true;
  if (!day) return false;
  return (!LIST.from || day >= LIST.from) && (!LIST.to || day <= LIST.to);
}

function passesList(l) {
  if (LIST.status && statusWord(l) !== LIST.status) return false;
  if (LIST.brand && l.brand !== LIST.brand) return false;
  if (LIST.type && productType(l.code) !== LIST.type) return false;
  if (LIST.color && l.color !== LIST.color) return false;
  if (LIST.machine && String(l.usualMachine) !== LIST.machine) return false;
  if (LIST.dateBy === 'po') return inRange(l.poDate);
  // By Invoice judges the range per invoice (see completedGroups); a line stays if any of
  // its invoices falls in it.
  if (VIEW === 'dinvoice') return !(LIST.from || LIST.to) || l.invoices.some(function (i) { return inRange(i.date); });
  return inRange(l.delivered);
}

/* ---------------------------------------------------------------------------
   Chip filters: one row of tap targets instead of a wall of dropdowns. Status and date
   presets are chips; the rarer filters (brand, type, colour, PO, sort, a custom date range)
   sit in a panel opened by a chip, with a count badge so nothing is filtered invisibly.
   --------------------------------------------------------------------------- */
var STATUS_ICONS = { 'OTIF': '✓', 'Late': '◷', 'Short': '◐', 'Late + Short': '✗', 'On plan': '○', 'Open line': '○' };

function chip(attrs, label, on, extraCls) {
  return '<button type="button" class="chip' + (on ? ' on' : '') + (extraCls ? ' ' + extraCls : '') + '" ' + attrs +
    ' aria-pressed="' + !!on + '">' + label + '</button>';
}

var STATUS_ORDER = ['OTIF', 'Late', 'Short', 'Late + Short', 'On plan', 'Open line'];
function statusChips(state, statuses) {
  var rank = function (st) { var i = STATUS_ORDER.indexOf(st); return i === -1 ? 99 : i; };
  return statuses.slice().sort(function (a, b) { return rank(a) - rank(b); }).map(function (st) {
    return chip('data-chip-key="status" data-chip-val="' + esc(st) + '"',
      '<span aria-hidden="true">' + (STATUS_ICONS[st] || '–') + '</span> ' + esc(st), state.status === st);
  }).join('');
}

function panelChip(state, count) {
  return chip('data-panel="more"', '<span aria-hidden="true">⚲</span> Filters' +
    (count ? ' <b class="chip-badge">' + count + '</b>' : ''), state._panel === 'more' || count > 0);
}

function machineOptions(items) {
  return uniqueSorted(items.map(function (x) { return x.usualMachine; })).map(function (m) {
    return { value: String(m), text: 'Machine ' + m };
  });
}

function istToday() { return new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 10); }
function monthRange(y, m) {   // m 0-11, may be -1 (December of the year before)
  var start = new Date(Date.UTC(y, m, 1)), end = new Date(Date.UTC(y, m + 1, 0));
  return { from: start.toISOString().slice(0, 10), to: end.toISOString().slice(0, 10) };
}
function presetRange(p) {
  var t = istToday(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)) - 1;
  if (p === 'tm') return monthRange(y, m);
  if (p === 'lm') return monthRange(y, m - 1);
  if (p === 'ty') return { from: y + '-01-01', to: y + '-12-31' };
  return { from: '', to: '' };
}

function listControls() {
  var all = judgedLines();
  var more = ['brand', 'type', 'color', 'machine'].filter(function (k) { return LIST[k]; }).length;
  var custom = LIST.preset === 'custom' && (LIST.from || LIST.to);
  var any = LIST.status || more || LIST.from || LIST.to;
  // Filters and Clear lead the row: on a phone the row scrolls sideways, and what is active
  // must be visible without scrolling. An active date preset also shows on the Filters chip.
  var html = '<div class="chipbar">' +
    panelChip(LIST, more + (LIST.from || LIST.to ? 1 : 0)) +
    (any ? chip('id="listReset"', '<span aria-hidden="true">✕</span> Clear', false, 'chip-clear') : '') +
    statusChips(LIST, uniqueSorted(all.map(statusWord))) +
    '<span class="chip-sep" aria-hidden="true"></span>' +
    chip('data-preset="tm"', 'This month', LIST.preset === 'tm') +
    chip('data-preset="lm"', 'Last month', LIST.preset === 'lm') +
    chip('data-preset="ty"', 'This year', LIST.preset === 'ty') +
    chip('data-panel="dates"', '<span aria-hidden="true">📅</span> ' + (custom ? esc((LIST.from || '…') + ' → ' + (LIST.to || '…')) : 'Dates'),
      LIST._panel === 'dates' || custom) +
    '</div>';
  if (LIST._panel === 'more') {
    html += '<div class="chip-panel">' +
      sumSelect('brand', 'Brand', uniqueSorted(all.map(function (l) { return l.brand; })), 'All brands', LIST, 'data-list') +
      sumSelect('type', 'Type', uniqueSorted(all.map(function (l) { return productType(l.code); })), 'All types', LIST, 'data-list') +
      sumSelect('color', 'Colour', uniqueSorted(all.map(function (l) { return l.color; })), 'All colours', LIST, 'data-list') +
      sumSelect('machine', 'Usual machine', machineOptions(all), 'All machines', LIST, 'data-list') +
      '</div>';
  } else if (LIST._panel === 'dates') {
    html += '<div class="chip-panel">' +
      sumSelect('dateBy', 'Date by', [{ value: 'delivered', text: VIEW === 'dinvoice' ? 'Invoice date' : 'Delivered date' },
        { value: 'po', text: 'PO date' }], '', LIST, 'data-list') +
      '<label class="sum-field"><span>From</span><input type="date" data-list="from" value="' + esc(LIST.from) + '"></label>' +
      '<label class="sum-field"><span>To</span><input type="date" data-list="to" value="' + esc(LIST.to) + '"></label>' +
      '</div>';
  }
  return html;
}

// Wires a chip bar to its state object. Shared by the line tabs (LIST) and Summary (SUM).
function bindChips(mainEl, state, attr) {
  mainEl.querySelectorAll('[data-chip-key]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.dataset.chipKey, v = b.dataset.chipVal;
      state[k] = state[k] === v ? '' : v;
      render();
    });
  });
  mainEl.querySelectorAll('[data-panel]').forEach(function (b) {
    b.addEventListener('click', function () {
      state._panel = state._panel === b.dataset.panel ? '' : b.dataset.panel;
      render();
    });
  });
  mainEl.querySelectorAll('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.dataset.preset === state.preset ? '' : b.dataset.preset;
      var r = presetRange(p);
      state.preset = p; state.from = r.from; state.to = r.to;
      render();
    });
  });
  mainEl.querySelectorAll('[' + attr + ']').forEach(function (el) {
    el.addEventListener('change', function () {
      var k = el.getAttribute(attr);
      state[k] = el.value;
      if (k === 'from' || k === 'to') state.preset = 'custom';
      render();
    });
  });
}


function bindListControls(mainEl) {
  bindChips(mainEl, LIST, 'data-list');
  var rs = document.getElementById('listReset');
  if (rs) rs.addEventListener('click', function () { LIST = Object.assign({}, LIST_DEFAULT); render(); });
}

function completedLines() {
  var lines = judgedLines().filter(function (l) { return passesPicked(l.code) && passesList(l); });
  if (!FILTER) return lines;
  var q = FILTER.toLowerCase();
  return lines.filter(function (l) {
    return [l.code, l.name, l.po].some(function (v) { return String(v).toLowerCase().indexOf(q) !== -1; })
      || l.invoices.some(function (i) { return String(i.no).toLowerCase().indexOf(q) !== -1; });
  });
}

function scoreLines(lines) {
  var judged = lines.filter(function (l) { return l.status === 'ok'; });
  var count = function (k) { return judged.filter(function (l) { return l[k]; }).length; };
  return { lines: lines.length, judged: judged.length, otd: count('otd'), otif: count('otif'),
    inFull: count('inFull') };
}

/* Rows of the active tab, grouped. By Invoice lists one row per shipment, so a line split over
   three invoices appears under each with that invoice's quantity, judged on THAT invoice's
   date. By PO / By Product list one row per line, judged on its last invoice. */
function completedGroups(lines) {
  var groups = {}, order = [];
  function add(key, label, sortKey, row) {
    if (!groups[key]) { groups[key] = { label: label, sortKey: sortKey, rows: [] }; order.push(key); }
    groups[key].rows.push(row);
    if (sortKey > groups[key].sortKey) groups[key].sortKey = sortKey;
  }
  lines.forEach(function (l) {
    if (VIEW === 'dinvoice') {
      if (!l.invoices.length) { add('~none', 'No invoice recorded', '', { line: l, inv: null }); return; }
      l.invoices.forEach(function (i) {
        if (LIST.dateBy !== 'po' && !inRange(i.date)) return;
        add(i.no, i.no + ' · ' + fmtIso(i.date), i.date || '', { line: l, inv: i });
      });
    } else if (VIEW === 'dpo') {
      add(l.po, l.po, l.delivered || l.poDate || '', { line: l });
    } else {
      add(l.code, l.code + ' — ' + l.name, l.code, { line: l });
    }
  });
  sortCompletedOrder(order, groups);
  order.forEach(function (k) { groups[k].rows.sort(completedRowCmp); });
  return { groups: groups, order: order };
}

function leftToSupply(rows) {
  return rows.reduce(function (a, r) { return a + Math.max(0, r.line.orderQty - r.line.supplied); }, 0);
}
function suppliedOf(rows) { return rows.reduce(function (a, r) { return a + r.line.supplied; }, 0); }

// sortKey is the group's latest date (invoice date, or last delivery for By PO).
function sortCompletedOrder(order, groups) {
  var s = groupSort();
  var byDateDesc = function (a, b) { return groups[a].sortKey < groups[b].sortKey ? 1 : groups[a].sortKey > groups[b].sortKey ? -1 : 0; };
  order.sort(function (a, b) {
    if (a === '~none' || b === '~none') return a === '~none' ? 1 : -1;   // "No invoice" stays last
    // Several invoices share a day; the invoice number breaks the tie so they run in sequence.
    if (VIEW === 'dinvoice') return s === 'old' ? (byDateDesc(b, a) || cmpNat(a, b)) : (byDateDesc(a, b) || cmpNat(b, a));
    if (s === 'last') return byDateDesc(a, b) || cmpNat(b, a);
    if (s === 'left') return leftToSupply(groups[b].rows) - leftToSupply(groups[a].rows) || cmpNat(a, b);
    if (s === 'supplied') return suppliedOf(groups[b].rows) - suppliedOf(groups[a].rows) || cmpNat(a, b);
    if (s === 'old' || s === 'code') return cmpNat(a, b);
    return cmpNat(b, a);   // 'new'
  });
}

// By PO lists its products by code; By Invoice its lines by PO (newest) then code; By Product
// its POs newest first.
function completedRowCmp(a, b) {
  if (VIEW === 'dpo') return cmpNat(a.line.code, b.line.code);
  if (VIEW === 'dinvoice') return cmpNat(b.line.po, a.line.po) || cmpNat(a.line.code, b.line.code);
  return String(b.line.poDate || '').localeCompare(String(a.line.poDate || '')) || cmpNat(b.line.po, a.line.po);
}

function completedColumns() {
  var base = [
    { th: 'Code', td: function (r) { return codeChipHtml(r.line.code, r.line.color, 'code-chip'); }, cls: 'data-col' },
    { th: 'Item', td: function (r) { return esc(r.line.name); }, cls: 'data-col' },
    { th: 'PO Date', td: function (r) { return fmtIso(r.line.poDate); } },
    { th: 'Due', td: function (r) { return fmtIso(r.line.due); } },
  ];
  // By PO already names the PO in its group header.
  if (VIEW !== 'dpo') base.splice(2, 0, { th: 'PO', td: function (r) { return esc(r.line.po); }, cls: 'txt' });
  if (VIEW === 'dinvoice') {
    return base.concat([
      { th: 'Shipped', td: function (r) { return r.inv ? fmtNum(r.inv.qty) : '—'; } },
      { th: 'vs Due', td: function (r) { return fmtLate(shipmentLate(r)); } },
      { th: 'Line status', td: function (r) { return statusBadge(r.line); }, cls: 'txt' },
    ]);
  }
  return base.concat([
    { th: 'Order Qty', td: function (r) { return fmtNum(r.line.orderQty); } },
    { th: 'Supplied', td: function (r) { return fmtNum(r.line.supplied); } },
    { th: 'Fill', td: function (r) { return r.line.orderQty ? pct(r.line.supplied, r.line.orderQty) : '—'; } },
    { th: 'Invoices', td: function (r) {
      return r.line.invoices.length ? esc(r.line.invoices.map(function (i) { return i.no; }).join(', ')) : '—';
    }, cls: 'invs' },
    { th: 'Delivered', td: function (r) { return fmtIso(r.line.delivered); } },
    { th: 'vs Due', td: function (r) { return fmtLate(r.line.late); } },
    { th: 'Status', td: function (r) { return statusBadge(r.line); }, cls: 'txt' },
  ]);
}

function shipmentLate(r) {
  if (!r.inv || !r.inv.date || !r.line.due) return null;
  return dayNum(r.inv.date) - dayNum(r.line.due);
}

function groupSummary(rows) {
  if (VIEW === 'dinvoice') {
    var judged = rows.filter(function (r) { return shipmentLate(r) !== null; });
    var onTime = judged.filter(function (r) { return shipmentLate(r) <= 0; }).length;
    var qty = rows.reduce(function (a, r) { return a + (r.inv ? r.inv.qty : 0); }, 0);
    return pctChip('On time', onTime, judged.length) + '<span class="sub">' +
      rows.length + ' line' + (rows.length === 1 ? '' : 's') + ' · ' + fmtNum(qty) + ' pcs</span>';
  }
  var ls = rows.map(function (r) { return r.line; });
  var s = scoreLines(ls);
  var onPlan = ls.filter(function (l) { return l.onPlan; }).length;
  var ordered = ls.reduce(function (a, l) { return a + l.orderQty; }, 0);
  var chipHtml = (!s.judged && onPlan) ? '<span class="st st-na">○ On plan</span>' : pctChip('OTIF', s.otif, s.judged);
  return chipHtml + '<span class="sub">' +
    s.lines + ' line' + (s.lines === 1 ? '' : 's') + (onPlan ? ' · ' + onPlan + ' on plan' : '') +
    ' · ' + fmtNum(suppliedOf(rows)) + ' / ' + fmtNum(ordered) + ' supplied · OTD ' + pct(s.otd, s.judged) + '</span>';
}

function renderCompleted() {
  var mainEl = document.getElementById('main');
  mainEl.setAttribute('aria-busy', 'false');
  if (!COMPLETED) {
    mainEl.innerHTML = '<div class="empty">Completed lines are not available from the sheet yet.</div>';
    return;
  }
  if (VIEW === 'dsummary') { renderSummary(mainEl); return; }
  var lines = completedLines();
  if (!lines.length) {
    mainEl.innerHTML = listControls() + (PICKED.length
      ? '<div class="empty">No supplied lines for ' + esc(PICKED.join(', ')) + ' match these filters.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear products</button></div>'
      : FILTER
      ? '<div class="empty">No supplied lines match “' + esc(FILTER) + '”.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear filter</button></div>'
      : '<div class="empty">No supplied lines match these filters.</div>');
    var ec = document.getElementById('emptyClear');
    if (ec) ec.addEventListener('click', clearFilter);
    bindListControls(mainEl);
    return;
  }

  var s = scoreLines(lines);
  var onPlanN = lines.filter(function (l) { return l.onPlan; }).length;
  var unjudged = s.lines - s.judged - onPlanN;
  var html = listControls() + '<div class="grand kpi">' +
    '<div><span>Supplied lines</span><b>' + fmtNum(s.lines) + '</b></div>' +
    '<div><span>OTD</span><b class="' + pctTone(s.otd, s.judged) + '">' + pct(s.otd, s.judged) + '</b></div>' +
    '<div><span>OTIF</span><b class="' + pctTone(s.otif, s.judged) + '">' + pct(s.otif, s.judged) + '</b></div>' +
    '<div><span>In full</span><b class="' + pctTone(s.inFull, s.judged) + '">' + pct(s.inFull, s.judged) + '</b></div>' +
    '</div>';
  html += '<p class="kpi-note">Due = PO date + <b>' + esc(COMPLETED.leadDays) + ' days</b> · ' +
    'Delivered = last invoice date · In full = supplied ≥ <b>' + esc(100 - COMPLETED.tolerancePct) + '%</b> of order qty · ' +
    'OTD/OTIF judged on <b>' + s.judged + '</b> of ' + s.lines + ' lines' +
    (onPlanN ? ' · <b>' + onPlanN + '</b> still on plan, judged once taken off it' : '') +
    (unjudged > 0 ? ' (' + unjudged + ' have no invoice, invoice date or order qty)' : '') +
    ' · change these on the sheet’s Settings tab.</p>';

  var cols = completedColumns();
  var g = completedGroups(lines);
  GROUP_KEYS = g.order.slice();
  html += groupBarHtml();
  html += '<div class="done-scroll"><table><thead><tr>' +
    cols.map(function (c) { return '<th scope="col"' + (c.cls === 'txt' || c.cls === 'invs' ? ' class="' + c.cls + '"' : '') + '>' + esc(c.th) + '</th>'; }).join('') +
    '</tr></thead><tbody>';
  g.order.forEach(function (k, gi) {
    var grp = g.groups[k];
    var fc = foldCls(k);
    html += '<tr class="group-row" data-gh="' + gi + '"><td colspan="' + cols.length + '"><span>' + groupToggle(gi, grp.label) + '</span>' +
      groupSummary(grp.rows) + '</td></tr>';
    grp.rows.forEach(function (r) {
      html += '<tr data-gm="' + gi + '"' + (fc ? ' class="' + fc.trim() + '"' : '') + '>' + cols.map(function (c) {
        return '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.td(r) + '</td>';
      }).join('') + '</tr>';
    });
  });
  html += '</tbody></table></div>';

  mainEl.innerHTML = html;
  bindListControls(mainEl);
  bindGroupControls(mainEl);
  var firstTh = mainEl.querySelector('.done-scroll thead th:first-child');
  if (firstTh) document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
}

/* ---------------------------------------------------------------------------
   Summary tab — what was dispatched in a month or a year, per product.

   Quantities and value come from SHIPMENTS (every invoice on every line, open lines
   included), so a month's figure is what actually left the plant that month and agrees with
   the invoices. OTIF/OTD come from completed LINES whose last invoice fell in the period.
   Value = qty x PO rate, ex-GST. Every filter applies to the KPIs, the trend and the table
   alike, so the figures on screen always describe the same slice.
   --------------------------------------------------------------------------- */
var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SUM_DEFAULT = { year: 0, month: -1, po: '', brand: '', type: '', color: '', machine: '', status: '', sort: 'qty', _panel: '' };
var SUM = Object.assign({}, SUM_DEFAULT);
var SUM_SORTS = { qty: 'Quantity', value: 'Value', invoices: 'Invoices', otif: 'OTIF %', code: 'Code' };
var SUM_STATUSES = ['OTIF', 'Late', 'Short', 'Late + Short', 'Open line'];

function productType(code) {
  if (/^PMCAP/i.test(code)) return 'Cap';
  if (/^PMCON/i.test(code)) return 'Bottle';
  return 'Other';
}
function statusWord(l) {
  if (l.status !== 'ok') return l.status;
  if (l.otd && l.inFull) return 'OTIF';
  if (!l.otd && !l.inFull) return 'Late + Short';
  return l.otd ? 'Short' : 'Late';
}
function fmtLakh(v) {
  return Math.abs(v) >= 100000 ? (v / 100000).toFixed(1) + ' L' : fmtNum(v);
}

// A shipment or a line passes the tab's filters. Both carry po/brand/code/color/name.
function passesSum(x, status, invNos) {
  if (SUM.po && x.po !== SUM.po) return false;
  if (SUM.brand && x.brand !== SUM.brand) return false;
  if (SUM.type && productType(x.code) !== SUM.type) return false;
  if (SUM.color && x.color !== SUM.color) return false;
  if (SUM.machine && String(x.usualMachine) !== SUM.machine) return false;
  if (SUM.status && status !== SUM.status) return false;
  if (!passesPicked(x.code)) return false;
  if (!FILTER) return true;
  var q = FILTER.toLowerCase();
  return [x.code, x.name, x.po].concat(invNos).some(function (v) { return String(v).toLowerCase().indexOf(q) !== -1; });
}

// Period test on a 'yyyy-MM-dd' day. month -1 = whole year.
// maxDay caps the day of month, so a month still in progress can be compared with the same
// days of the month before rather than with the whole of it.
function inPeriod(day, year, month, maxDay) {
  if (!day) return false;
  if (Number(day.slice(0, 4)) !== year) return false;
  if (maxDay && Number(day.slice(8, 10)) > maxDay) return false;
  return month === -1 || Number(day.slice(5, 7)) - 1 === month;
}
function prevPeriod(year, month) {
  if (month === -1) return { year: year - 1, month: -1 };
  return month === 0 ? { year: year - 1, month: 11 } : { year: year, month: month - 1 };
}

function summaryData() {
  var lines = judgedLines();
  var lineById = {};
  lines.forEach(function (l) { lineById[l.id] = l; });
  var ships = COMPLETED.shipments.filter(function (s) {
    var status = s.done ? (lineById[s.line] ? statusWord(lineById[s.line]) : '') : 'Open line';
    return passesSum(s, status, [s.inv]);
  });
  var doneLines = lines.filter(function (l) {
    return passesSum(l, statusWord(l), l.invoices.map(function (i) { return i.no; }));
  });
  return { ships: ships, lines: doneLines };
}

function periodTotals(d, year, month, maxDay) {
  var ships = d.ships.filter(function (s) { return inPeriod(s.date, year, month, maxDay); });
  var lines = d.lines.filter(function (l) { return l.status === 'ok' && inPeriod(l.delivered, year, month, maxDay); });
  var t = { qty: 0, value: 0, invoices: {}, products: {}, pos: {}, ships: ships, lines: lines };
  ships.forEach(function (s) {
    t.qty += s.qty; t.value += s.qty * s.rate;
    t.invoices[s.inv] = 1; t.products[s.code] = 1; t.pos[s.po] = 1;
  });
  t.otd = lines.filter(function (l) { return l.otd; }).length;
  t.otif = lines.filter(function (l) { return l.otif; }).length;
  t.avgLate = lines.length ? lines.reduce(function (a, l) { return a + l.late; }, 0) / lines.length : null;
  return t;
}

// Against the previous period, stated as a positive figure: "112% of previous month",
// "57% of same days last month". Green when it matches or beats it, plain otherwise.
function deltaHtml(now, before, against) {
  if (!before) return '<small class="is-na">first period on record</small>';
  var p = Math.round((now / before) * 100);
  return '<small class="' + (p >= 100 ? 'late-good' : 'is-na') + '">' + (p > 100 ? '▲ ' : '') + p + '% of ' + against + '</small>';
}

// One dropdown in a filter bar. `state` is the object it edits (SUM for Summary, LIST for the
// line views) and `attr` the data attribute its change handler looks for.
function sumSelect(key, label, options, allLabel, state, attr) {
  state = state || SUM;
  var html = '<label class="sum-field"><span>' + esc(label) + '</span><select ' + (attr || 'data-sum') + '="' + key + '">';
  if (allLabel) html += '<option value="">' + esc(allLabel) + '</option>';
  options.forEach(function (o) {
    var v = typeof o === 'object' ? o.value : o, t = typeof o === 'object' ? o.text : o;
    html += '<option value="' + esc(v) + '"' + (String(state[key]) === String(v) ? ' selected' : '') +
      (o.disabled ? ' disabled' : '') + '>' + esc(t) + '</option>';
  });
  return html + '</select></label>';
}

function uniqueSorted(list) {
  return Array.from(new Set(list.filter(function (v) { return v !== '' && v != null; })))
    .sort(function (a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); });
}

// Month | Year switch and a ‹ period › stepper, then the same chips as the line tabs.
function summaryControls(all) {
  var isYear = SUM.month === -1;
  var label = isYear ? String(SUM.year) : MONTH_NAMES[SUM.month] + ' ' + SUM.year;
  var more = ['po', 'brand', 'type', 'color', 'machine'].filter(function (k) { return SUM[k]; }).length + (SUM.sort !== 'qty' ? 1 : 0);
  var any = SUM.status || more;
  var html = '<div class="chipbar">' +
    '<div class="modes sum-scope" role="group" aria-label="Summary period">' +
      '<button type="button" class="mode' + (isYear ? '' : ' active') + '" data-scope="month" aria-pressed="' + !isYear + '">Month</button>' +
      '<button type="button" class="mode' + (isYear ? ' active' : '') + '" data-scope="year" aria-pressed="' + isYear + '">Year</button>' +
    '</div>' +
    '<div class="stepper" role="group" aria-label="Period">' +
      '<button type="button" class="chip" data-step="-1" aria-label="Previous ' + (isYear ? 'year' : 'month') + '">‹</button>' +
      '<b>' + esc(label) + '</b>' +
      '<button type="button" class="chip" data-step="1" aria-label="Next ' + (isYear ? 'year' : 'month') + '">›</button>' +
    '</div>' +
    '<span class="chip-sep" aria-hidden="true"></span>' +
    panelChip(SUM, more + (SUM.status ? 1 : 0)) +
    (any ? chip('id="sumReset"', '<span aria-hidden="true">✕</span> Clear', false, 'chip-clear') : '') +
    statusChips(SUM, SUM_STATUSES) +
    '</div>';
  if (SUM._panel === 'more') {
    html += '<div class="chip-panel">' +
      sumSelect('po', 'PO', uniqueSorted(all.map(function (s) { return s.po; })), 'All POs') +
      sumSelect('brand', 'Brand', uniqueSorted(all.map(function (s) { return s.brand; })), 'All brands') +
      sumSelect('type', 'Type', uniqueSorted(all.map(function (s) { return productType(s.code); })), 'All types') +
      sumSelect('color', 'Colour', uniqueSorted(all.map(function (s) { return s.color; })), 'All colours') +
      sumSelect('machine', 'Usual machine', machineOptions(all), 'All machines') +
      sumSelect('sort', 'Sort by', Object.keys(SUM_SORTS).map(function (k) { return { value: k, text: SUM_SORTS[k] }; })) +
      '</div>';
  }
  return html;
}

function summaryKpis(t, prev, against) {
  var avg = t.avgLate === null ? '—'
    : Math.abs(Math.round(t.avgLate)) + (Math.round(t.avgLate) > 0 ? ' d late' : ' d early');
  return '<div class="grand kpi">' +
    '<div><span>Dispatched</span><b>' + fmtNum(t.qty) + '</b>' + deltaHtml(t.qty, prev.qty, against) + '</div>' +
    '<div><span>Value (ex-GST)</span><b>₹' + fmtLakh(t.value) + '</b>' + deltaHtml(t.value, prev.value, against) + '</div>' +
    '<div><span>Invoices</span><b>' + Object.keys(t.invoices).length + '</b><small class="is-na">' +
      Object.keys(t.pos).length + ' POs</small></div>' +
    '<div><span>Products</span><b>' + Object.keys(t.products).length + '</b></div>' +
    '<div><span>OTIF</span><b class="' + pctTone(t.otif, t.lines.length) + '">' + pct(t.otif, t.lines.length) + '</b>' +
      '<small class="is-na">OTD ' + pct(t.otd, t.lines.length) + ' · ' + t.otif + ' of ' + t.lines.length + ' lines</small></div>' +
    '<div><span>Avg vs due</span><b class="' + (t.avgLate > 0 ? 'st-bad' : 'st-good') + '">' + avg + '</b></div>' +
    '</div>';
}

// One bar per month of the year; the tallest month fills the track. Click to open that month.
function summaryTrend(d, year) {
  var months = MONTH_NAMES.map(function (m, i) { return periodTotals(d, year, i); });
  var max = Math.max.apply(null, months.map(function (t) { return t.qty; }).concat([1]));
  var html = '<div class="trend" role="group" aria-label="Months of ' + year + '">';
  months.forEach(function (t, i) {
    var on = SUM.month === i;
    html += '<button type="button" class="trend-m' + (on ? ' is-on' : '') + '" data-month="' + i + '"' +
      (t.qty ? '' : ' disabled') + '>' +
      '<span class="trend-bar"><i style="height:' + Math.round((t.qty / max) * 100) + '%"></i></span>' +
      '<b>' + MONTH_NAMES[i] + '</b><span>' + (t.qty ? fmtLakh(t.qty) : '—') + '</span>' +
      (t.lines.length ? '<span class="st ' + pctTone(t.otif, t.lines.length) + '">' + pct(t.otif, t.lines.length) + '</span>' : '<span></span>') +
      '</button>';
  });
  return html + '</div>';
}

function summaryRows(t) {
  var byCode = {};
  t.ships.forEach(function (s) {
    var p = byCode[s.code] || (byCode[s.code] = { code: s.code, name: s.name, color: s.color, brand: s.brand,
      qty: 0, value: 0, invoices: {}, months: {}, lines: 0, otif: 0 });
    p.qty += s.qty; p.value += s.qty * s.rate; p.invoices[s.inv] = 1;
    var m = Number(s.date.slice(5, 7)) - 1;
    p.months[m] = (p.months[m] || 0) + s.qty;
  });
  t.lines.forEach(function (l) {
    var p = byCode[l.code];
    if (!p) return;
    p.lines++; if (l.otif) p.otif++;
  });
  var rows = Object.keys(byCode).map(function (k) { return byCode[k]; });
  var key = SUM.sort;
  rows.sort(function (a, b) {
    if (key === 'code') return String(a.code).localeCompare(String(b.code), 'en', { numeric: true });
    if (key === 'invoices') return Object.keys(b.invoices).length - Object.keys(a.invoices).length;
    if (key === 'otif') return (b.lines ? b.otif / b.lines : -1) - (a.lines ? a.otif / a.lines : -1);
    return b[key] - a[key];
  });
  return rows;
}

function summaryTable(t, isYear) {
  var rows = summaryRows(t);
  if (!rows.length) return '<div class="empty">Nothing dispatched in this period with these filters.</div>';
  var monthCols = isYear
    ? MONTH_NAMES.map(function (m, i) { return i; }).filter(function (i) { return rows.some(function (r) { return r.months[i]; }); })
    : [];
  var html = '<div class="done-scroll"><table><thead><tr>' +
    '<th scope="col">Code</th><th scope="col">Item</th><th scope="col" class="txt">Brand</th>' +
    monthCols.map(function (i) { return '<th scope="col">' + MONTH_NAMES[i] + '</th>'; }).join('') +
    '<th scope="col">Dispatched</th><th scope="col">Value</th><th scope="col" class="txt">Share</th>' +
    '<th scope="col">Invoices</th><th scope="col">OTIF</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var share = t.qty ? (r.qty / t.qty) * 100 : 0;
    html += '<tr><td class="data-col">' + codeChipHtml(r.code, r.color, 'code-chip') + '</td>' +
      '<td class="data-col">' + esc(r.name) + '</td><td class="txt">' + esc(r.brand || '—') + '</td>' +
      monthCols.map(function (i) { return '<td>' + (r.months[i] ? fmtNum(r.months[i]) : '<span class="is-na">—</span>') + '</td>'; }).join('') +
      '<td><b>' + fmtNum(r.qty) + '</b></td><td>₹' + fmtLakh(r.value) + '</td>' +
      '<td class="txt"><span class="share"><i style="width:' + Math.max(1, Math.round(share)) + '%"></i></span>' +
        Math.round(share) + '%</td>' +
      '<td>' + Object.keys(r.invoices).length + '</td>' +
      '<td>' + (r.lines ? '<span class="st ' + pctTone(r.otif, r.lines) + '">' + pct(r.otif, r.lines) + '</span>' : '<span class="is-na">—</span>') + '</td></tr>';
  });
  var monthTotals = monthCols.map(function (i) {
    return '<td>' + fmtNum(rows.reduce(function (a, r) { return a + (r.months[i] || 0); }, 0)) + '</td>';
  }).join('');
  html += '<tr class="subtotal-row"><td colspan="3">Total · ' + rows.length + ' products</td>' + monthTotals +
    '<td>' + fmtNum(t.qty) + '</td><td>₹' + fmtLakh(t.value) + '</td><td class="txt">100%</td>' +
    '<td>' + Object.keys(t.invoices).length + '</td><td>' + pct(t.otif, t.lines.length) + '</td></tr>';
  return html + '</tbody></table></div>';
}

// First visit: the current month if anything shipped in it, else the latest month that did.
function defaultPeriod(all) {
  var days = all.map(function (s) { return s.date; }).filter(Boolean).sort();
  if (!days.length) return;
  var nowIst = new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 7);
  var pick = days.some(function (d) { return d.slice(0, 7) === nowIst; }) ? nowIst : days[days.length - 1].slice(0, 7);
  SUM.year = Number(pick.slice(0, 4));
  SUM.month = Number(pick.slice(5, 7)) - 1;
}

function renderSummary(mainEl) {
  var all = COMPLETED.shipments || [];
  if (!all.length) {
    mainEl.innerHTML = '<div class="empty">No dispatches recorded yet.</div>';
    return;
  }
  if (!SUM.year) defaultPeriod(all);
  var d = summaryData();
  var isYear = SUM.month === -1;
  var monthsWithData = {};
  all.forEach(function (s) { if (s.date && Number(s.date.slice(0, 4)) === SUM.year) monthsWithData[Number(s.date.slice(5, 7)) - 1] = 1; });
  var t = periodTotals(d, SUM.year, SUM.month);
  var p = prevPeriod(SUM.year, SUM.month);
  // The current month is still running: compare it with the same days of last month.
  var nowIst = new Date(Date.now() + 5.5 * 3600 * 1000);
  var running = !isYear && SUM.year === nowIst.getUTCFullYear() && SUM.month === nowIst.getUTCMonth();
  var prev = periodTotals(d, p.year, p.month, running ? nowIst.getUTCDate() : 0);
  var against = running ? 'same days last month' : (isYear ? 'previous year' : 'previous month');
  var title = (isYear ? 'Year ' : MONTH_NAMES[SUM.month] + ' ') + SUM.year +
    (running ? ' · month to date (1–' + nowIst.getUTCDate() + ')' : '');

  mainEl.innerHTML = summaryControls(all) +
    '<h2 class="sum-title">' + esc(title) + '</h2>' +
    summaryKpis(t, prev, against) +
    summaryTrend(d, SUM.year) +
    summaryTable(t, isYear);

  bindChips(mainEl, SUM, 'data-sum');
  mainEl.querySelectorAll('[data-step]').forEach(function (b) {
    b.addEventListener('click', function () {
      var step = Number(b.dataset.step);
      if (SUM.month === -1) { SUM.year += step; render(); return; }
      var m = SUM.month + step;
      SUM.year += Math.floor(m / 12);
      SUM.month = ((m % 12) + 12) % 12;
      render();
    });
  });
  mainEl.querySelectorAll('[data-scope]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.scope === 'year') { SUM.month = -1; render(); return; }
      if (SUM.month !== -1) return;
      // Month view opens on the latest month of the chosen year that has dispatches.
      var months = Object.keys(monthsWithData).map(Number);
      SUM.month = months.length ? Math.max.apply(null, months) : 0;
      render();
    });
  });
  mainEl.querySelectorAll('.trend-m').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = Number(b.dataset.month);
      SUM.month = SUM.month === m ? -1 : m;   // clicking the open month goes back to the year
      render();
    });
  });
  var sr = document.getElementById('sumReset');
  if (sr) sr.addEventListener('click', function () {
    // Clear the filters, keep the period the reader is looking at.
    SUM = Object.assign({}, SUM_DEFAULT, { year: SUM.year, month: SUM.month });
    render();
  });
  var firstTh = mainEl.querySelector('.done-scroll thead th:first-child');
  if (firstTh) document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
}

/* ---------------------------------------------------------------------------
   Download the current Completed tab as Excel or PDF.

   Read from the rendered table rather than rebuilt from data, so the file always matches the
   screen: same filters, same rows, same totals. Libraries load on first use only.
   --------------------------------------------------------------------------- */
var EXPORT_LIBS = {
  xlsx: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'],
  pdf: ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'],
};
var loadedScripts = {};
function loadScript(url) {
  if (!loadedScripts[url]) {
    loadedScripts[url] = new Promise(function (resolve, reject) {
      var el = document.createElement('script');
      el.src = url; el.onload = resolve;
      el.onerror = function () { delete loadedScripts[url]; reject(new Error('could not load ' + url)); };
      document.head.appendChild(el);
    });
  }
  return loadedScripts[url];
}

var VIEW_NAMES = { dinvoice: 'By Invoice', dpo: 'By PO', dproduct: 'By Product', dsummary: 'Summary',
  po: 'Open By PO', product: 'Open By Product', machine: 'Open By Machine', color: 'Open By Colour' };
var OPEN_GROUP_NAMES = { po: 'PO', product: 'Product', machine: 'Machine', color: 'Colour' };
var GROUP_NAMES = { dinvoice: 'Invoice', dpo: 'PO', dproduct: 'Product' };

function activeFilterText() {
  var parts = [];
  if (PICKED.length) parts.push('Products: ' + PICKED.join(', '));
  if (FILTER) parts.push('Search: ' + FILTER);
  if (MODE === 'open') {
    if (hasMachineSel()) parts.push('Machine: ' + machineSelText());
    return parts.length ? 'Filters: ' + parts.join(' · ') : 'Filters: none';
  }
  var state = VIEW === 'dsummary' ? SUM : LIST;
  Object.keys(state).forEach(function (k) {
    if (k === 'year' || k === 'month' || k === 'sort' || k === 'dateBy' || k === 'preset' || k.charAt(0) === '_' || !state[k]) return;
    parts.push((k === 'machine' ? 'Usual machine' : k.charAt(0).toUpperCase() + k.slice(1)) + ': ' + state[k]);
  });
  if (VIEW !== 'dsummary' && (LIST.from || LIST.to)) parts.push('(dates by ' + (LIST.dateBy === 'po' ? 'PO date' : 'delivery') + ')');
  return parts.length ? 'Filters: ' + parts.join(' · ') : 'Filters: none';
}

// The Open board's table is a day-by-day Gantt; the file gets the schedule as Start / End
// dates instead of 45 day columns.
function openViewForExport() {
  var rows = applyFilter(ROWS);
  var unplanned = applyFilter(UNPLANNED);
  if (!rows.length && !unplanned.length) return null;
  var showRmMb = VIEW === 'color';
  var g = openGroups(rows, unplanned);
  rows = rows.concat(unplanned);   // the grand total below counts both
  var byPo = VIEW === 'po';   // the group column already is the PO
  var d = function (iso) { return iso ? fmtDate(new Date(iso)) : ''; };
  var nums = function (t) {
    return [Math.round(t.orderQty), Math.round(t.supplied), Math.round(t.readyStock), Math.round(t.balance)]
      .concat(showRmMb ? [Math.round(t.rmReq * 100) / 100, Math.round(t.mb * 100) / 100] : []);
  };
  var out = [];
  g.order.forEach(function (k) {
    var grp = g.groups[k];
    grp.rows.forEach(function (r) {
      out.push([grp.label, r.code, r.name, r.color].concat(byPo ? [] : [r.po]).concat([r.machine, r.priority]).concat(nums(r))
        .concat([d(r.start), d(r.end), r.days || '']));
    });
    out.push(['', 'Subtotal', '', ''].concat(byPo ? [] : ['']).concat(['', '']).concat(nums(sumRows(grp.rows))).concat(['', '', '']));
  });
  var grand = sumRows(rows);
  out.push(['', 'Total', '', ''].concat(byPo ? [] : ['']).concat(['', '']).concat(nums(grand)).concat(['', '', '']));
  return {
    title: 'YPP Dispatch · Open · ' + VIEW_NAMES[VIEW].replace('Open ', ''),
    filters: activeFilterText(),
    kpis: 'Order Qty: ' + fmtNum(grand.orderQty) + '   Supplied: ' + fmtNum(grand.supplied) +
      '   Ready: ' + fmtNum(grand.readyStock) + '   Balance: ' + fmtNum(grand.balance),
    columns: [OPEN_GROUP_NAMES[VIEW], 'Code', 'Item', 'Colour'].concat(byPo ? [] : ['PO']).concat(['Machine', 'Priority',
      'Order Qty', 'Supplied', 'Ready', 'Balance']).concat(showRmMb ? ['RM Req', 'MB'] : [])
      .concat(['Start', 'End', 'Days']),
    rows: out,
  };
}

function viewForExport() {
  if (MODE === 'open') return openViewForExport();
  var tbl = document.querySelector('#main .done-scroll table');
  if (!tbl) return null;
  var grouped = VIEW !== 'dsummary';
  // textContent, not innerText: headers are upper-cased by CSS, and the file should carry the words.
  var heads = Array.from(tbl.querySelectorAll('thead th')).map(function (th) { return th.textContent.trim(); });
  var rows = [], group = '';
  Array.from(tbl.querySelectorAll('tbody tr')).forEach(function (tr) {
    if (tr.classList.contains('group-row')) { group = tr.querySelector('td > span').innerText.trim(); return; }
    var cells = [];
    Array.from(tr.children).forEach(function (td) {
      cells.push(td.innerText.trim());
      for (var i = 1; i < (td.colSpan || 1); i++) cells.push('');
    });
    rows.push(grouped ? [group].concat(cells) : cells);
  });
  var title = document.querySelector('#main .sum-title');
  return {
    title: 'YPP Dispatch · Completed · ' + VIEW_NAMES[VIEW] + (title ? ' · ' + title.innerText.trim() : ''),
    filters: activeFilterText(),
    kpis: Array.from(document.querySelectorAll('#main .kpi > div')).map(function (d) {
      return d.querySelector('span').textContent.trim() + ': ' + d.querySelector('b').textContent.trim();
    }).join('   '),
    columns: grouped ? [GROUP_NAMES[VIEW]].concat(heads) : heads,
    rows: rows,
  };
}

function exportFileName(ext) {
  var day = new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 10);
  return 'ypp-dispatch-' + VIEW_NAMES[VIEW].toLowerCase().replace(/\s+/g, '-') + '-' + day + '.' + ext;
}

// Excel keeps plain numbers as numbers so they can be summed; everything else stays text.
function xlsxCell(v) {
  var t = String(v).replace(/,/g, '');
  return /^\d+(\.\d+)?$/.test(t) ? Number(t) : v;
}

function exportXlsx(v) {
  var aoa = [[v.title], [v.filters], [v.kpis], []].concat([v.columns])
    .concat(v.rows.map(function (r) { return r.map(xlsxCell); }));
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = v.columns.map(function (c, i) {
    var w = Math.max(c.length, ...v.rows.map(function (r) { return String(r[i] || '').length; }));
    return { wch: Math.min(48, w + 2) };
  });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, VIEW_NAMES[VIEW]);
  XLSX.writeFile(wb, exportFileName('xlsx'));
}

// The PDF's built-in font covers Latin-1 only, so symbols are spelled out or dropped.
function pdfText(t) {
  return String(t).replace(/₹/g, 'Rs ').replace(/≥/g, '>=').replace(/[–—]/g, '-')
    .replace(/[✓✗◷◐▲▼⤓]/g, '').replace(/[^\x00-\xFF]/g, '').replace(/\s+/g, ' ').trim();
}

function exportPdf(v) {
  var doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  doc.setFontSize(13); doc.text(pdfText(v.title), 32, 34);
  doc.setFontSize(8.5); doc.setTextColor(90);
  doc.text(pdfText(v.filters), 32, 50);
  if (v.kpis) doc.text(pdfText(v.kpis), 32, 63);
  doc.autoTable({
    head: [v.columns.map(pdfText)],
    body: v.rows.map(function (r) { return r.map(pdfText); }),
    startY: 74, margin: { left: 32, right: 32 },
    styles: { fontSize: 7, cellPadding: 3, overflow: 'linebreak' },
    headStyles: { fillColor: [30, 64, 175] },
    didParseCell: function (data) {
      if (data.section === 'body' && /^(sub)?total/i.test(String(data.row.raw[VIEW === 'dsummary' ? 0 : 1] || ''))) {
        data.cell.styles.fontStyle = 'bold';
      }
    },
  });
  doc.save(exportFileName('pdf'));
}

function runExport(kind) {
  var v = viewForExport();
  if (!v) { alert('Nothing to download in this view.'); return; }
  // In order, not in parallel: the table plugin attaches itself to jsPDF as it loads, so
  // jsPDF must already be there.
  EXPORT_LIBS[kind].reduce(function (p, url) { return p.then(function () { return loadScript(url); }); }, Promise.resolve())
    .then(function () { kind === 'xlsx' ? exportXlsx(v) : exportPdf(v); })
    .catch(function (err) { alert('Download failed: ' + (err && err.message ? err.message : err)); });
}

(function bindExportMenu() {
  var btn = document.getElementById('exportBtn'), menu = document.getElementById('exportMenu');
  function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', menu.hidden ? 'false' : 'true');
    if (!menu.hidden) menu.querySelector('button').focus();
  });
  menu.querySelectorAll('[data-export]').forEach(function (b) {
    b.addEventListener('click', function () { close(); runExport(b.dataset.export); });
  });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) { close(); btn.focus(); } });
})();

/* The second frozen column has to start exactly where the first one ends, and the Code
   column's width depends on its content. Measure rather than guess. */
function measureFrozenOffset() {
  var firstTh = document.querySelector('.table-scroll thead th:first-child');
  if (firstTh) {
    document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
  }
}

/* Today can sit far off the right edge of a 120-column grid; without this the marker is
   only findable by hunting for it. */
function scrollToToday() {
  var box = document.querySelector('.table-scroll');
  var cell = document.querySelector('.date-th.is-today');
  if (!box || !cell) return;
  var frozen = (document.querySelector('.table-scroll thead th:first-child') || { offsetWidth: 0 }).offsetWidth
    + (document.querySelector('.table-scroll thead th:nth-child(2)') || { offsetWidth: 0 }).offsetWidth;
  box.scrollLeft = Math.max(0, cell.offsetLeft - frozen - 80);
}


document.querySelectorAll('.tab').forEach(function (btn) {
  btn.addEventListener('click', function () {
