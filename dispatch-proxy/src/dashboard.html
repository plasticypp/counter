<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------
     DESIGN: data-dense operations console (ui-ux-pro-max "Data-Dense
     Dashboard" pattern — BI/operational dashboard style). Cool slate
     background so the eye reads chrome vs. data instantly, a blue
     primary for structure, amber reserved as the single "signal" accent
     (today marker, active tab, live dot). Inter for UI text, tabular
     monospace numerals for dense number/date columns only. Machine
     palette: 8 hues held at matched OKLCH-equivalent chroma/lightness
     (vivid, ~55% lightness) so every machine reads with equal visual
     weight — no hue louder than another — while staying calm enough to
     stare at for a full shift. Three genuinely different timeline
     renderings per breakpoint, not one table that shrinks until it
     breaks.
     --------------------------------------------------------------------- */
  :root {
    --bg: #eef1f6;            /* cool slate-blue background */
    --panel: #ffffff;         /* card/table ground */
    --panel-alt: #f2f4f8;     /* group-header band */
    --line: #dde2ea;          /* hairlines on light */
    --ink: #16181d;           /* primary text, near-black */
    --dim: #5b6270;           /* secondary text */
    --faint: #666d7c;         /* tertiary — was #9298a6 (2.89:1, failed AA); now 4.59:1 worst ground */
    --primary: #1e40af;       /* structural blue — brand/active state */
    --amber: #b5650f;         /* signal accent — data aging */
    --ok: #157a4a;            /* data fresh */
    --today: #d1374a;         /* today marker / data stale — distinct from amber */

    /* Machine palette: 8 hues spaced 30°+ apart. Every one clears WCAG 3:1 against the
       white panel, because these bars are the sole colour-carried signal on the board and
       a bar that fails contrast is a machine a supervisor cannot identify. --m3 (#e07c1a,
       2.97:1) and --m7 (#b89a1c, 2.74:1) were below that line and are darkened here.
       Colour is never the ONLY channel: every bar also prints its machine number. */
    --m1: #2f7de0; --m2: #16a367; --m3: #b35f0a; --m4: #9457e0;
    --m5: #e0417a; --m6: #0ea5a0; --m7: #8f7810; --mx: #6f7686;

    --mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
    --sans: "Geist", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;

    /* Type scale — 1.125 minor-third-ish steps off a 14px base, not ad-hoc
       px picks. Every font-size in this file references one of these. */
    --fs-2xs: 11px;   /* tertiary labels, legend chips — floor for this UI */
    --fs-xs: 12px;    /* table headers, meta text */
    --fs-sm: 13px;    /* secondary body, item names */
    --fs-base: 14px;  /* primary body / default */
    --fs-md: 15px;    /* table data cells — the numbers people scan all day */
    --fs-lg: 17px;    /* group labels, card titles */
    --fs-2xl: 26px;   /* grand-total hero figures */

    /* Spacing scale — 4px base grid. */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;

    /* Rendered height of .card-group-head on mobile: its 13px/1.5 line box, 7px padding top and
       bottom, and 1px border top and bottom. The column-label row pins directly beneath it, so
       this is declared once and used by BOTH rather than measured by hand at each site. */
    --group-head-pad: 7px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light; }
  /* Full-height column so <main> always reaches the bottom of the window. `position: sticky`
     pins an element to its CONTAINING BLOCK, not the viewport — with an auto-height <main>,
     a short table left main ending partway down the page and the grand-total strip stuck to
     that edge, floating mid-screen. Tall content hid the bug, which is why it appeared only
     "at times". Making main fill the viewport makes its bottom the window's bottom. */
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    font-size: var(--fs-base); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex; flex-direction: column; min-height: 100%;
  }

  /* ---------------- header / controls ---------------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, #ffffff 0%, #f7f8fb 100%);
    border-bottom: 1px solid var(--line);
    padding: var(--sp-3) var(--sp-4); display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: var(--sp-2); margin-right: var(--sp-1); }
  /* The one ratified brand commitment is the YPP name; it was absent from the surface
     entirely while decorative chrome was elaborated. */
  .brand .wordmark {
    font-family: var(--mono); font-size: var(--fs-md); font-weight: 800; letter-spacing: .04em;
    color: var(--primary); white-space: nowrap;
  }
  header h1 {
    font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap;
  }
  /* Screen-reader-only: visually gone, still announced. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  /* Keyboard focus must be visible on every control — there was no focus style at all. */
  .tab:focus-visible, .mode:focus-visible, .clear-x:focus-visible, .jump-today:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  .tabs { display: flex; gap: 2px; background: var(--panel-alt); padding: 3px; border-radius: 6px; border: 1px solid var(--line); }
  .tab {
    font-family: var(--sans); font-size: var(--fs-sm); font-weight: 600; letter-spacing: .01em;
    padding: 8px 14px; border: none; border-radius: 4px;
    background: transparent; color: var(--dim); cursor: pointer;
    transition: color .12s, background .12s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--primary); color: #fff; }
  .tab[hidden] { display: none; }

  /* Open / Completed. Outlined rather than filled so it reads as a level ABOVE the tabs,
     not as two more tabs. */
  .modes { display: flex; border: 1px solid var(--primary); border-radius: 6px; overflow: hidden; }
  .mode {
    font-family: var(--sans); font-size: var(--fs-sm); font-weight: 700;
    padding: 8px 14px; min-height: 36px; border: none; background: var(--panel);
    color: var(--primary); cursor: pointer;
  }
  .mode + .mode { border-left: 1px solid var(--primary); }
  .mode.active { background: var(--primary); color: #fff; }

  /* Test Reports and Products have no sub-tabs and nothing to download. */
  body[data-mode="reports"] .tabs, body[data-mode="products"] .tabs,
  body[data-mode="reports"] .export-wrap, body[data-mode="products"] .export-wrap { display: none; }

  .lang-toggle {
    display: inline-flex; padding: 0; min-height: 36px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); cursor: pointer; overflow: hidden; font-family: var(--sans);
    font-size: var(--fs-sm); font-weight: 700;
  }
  .lang-toggle span { padding: 8px 10px; color: var(--dim); }
  html[lang="en"] .lang-toggle [data-lang="en"],
  html[lang="hi"] .lang-toggle [data-lang="hi"] { background: var(--primary); color: #fff; }
  .lang-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ---------------- Test Reports / Products lists ---------------- */
  .list-head { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); align-items: baseline; padding: var(--sp-2) var(--sp-1); }
  .list-head b { font-family: var(--mono); color: var(--ink); }
  .list-head span { font-family: var(--sans); font-size: var(--fs-xs); color: var(--dim); }
  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th, .list-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .list-table th { position: sticky; top: 0; z-index: 1; background: var(--panel-alt); font-family: var(--sans); font-size: var(--fs-xs); color: var(--dim); }
  .list-table .txt { text-align: left; font-family: var(--sans); }
  /* No frozen columns here: the shared --froz-1 offset belongs to whichever schedule table
     last measured it, and would slide this table's second column over its first. */
  .done-scroll .list-table td:first-child, .done-scroll .list-table td:nth-child(2) { position: static; box-shadow: none; }
  .done-scroll .list-table th:nth-child(n) { left: auto; box-shadow: none; }
  .list-table td.name { white-space: normal; min-width: 180px; font-weight: 600; }
  /* Products: the whole row opens By Product. Hover tints the row and draws the name's
     underline; keyboard focus outlines the row. */
  .pm-table tr[data-goto] { cursor: pointer; transition: background .12s; }
  .pm-table tr[data-goto]:hover { background: #eef2fd; }
  .pm-table tr[data-goto]:hover td.name span { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
  .pm-table tr[data-goto]:active { background: #e3eafc; }
  .pm-table tr[data-goto]:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .pm-table tr:not([data-goto]) td.name { color: var(--dim); }
  .pm-filters { display: flex; flex-direction: column; gap: 6px; padding: var(--sp-2) var(--sp-1) 0; }
  .pm-row { display: flex; align-items: center; gap: var(--sp-2); }
  .pm-label {
    flex: 0 0 84px; font-family: var(--sans); font-size: var(--fs-xs); font-weight: 700; color: var(--dim);
  }
  .pm-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .pm-sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .list-head .chip { margin-left: auto; }
  /* Details folded: keep Code (1), Product (2) and Open qty (11); hide Shape … Output / day. */
  .pm-table.is-compact th:nth-child(n+3):nth-child(-n+10),
  .pm-table.is-compact td:nth-child(n+3):nth-child(-n+10) { display: none; }
  /* With three columns a full-width table parks Open qty at the far edge, a long way from the
     name it belongs to. Shrink to the content so the figure sits beside the product. */
  .pm-table.is-compact { width: auto; min-width: 0; }
  .pm-table.is-compact td.name { max-width: 460px; }
  .pm-table .qty-cell { font-family: var(--mono); }
  .pm-table .qty-cell b { font-size: var(--fs-base); }
  @media (max-width: 620px) {
    /* Phone card: Open qty goes top-right beside the code, large, where the eye lands first. */
    .pm-table td.qty-cell {
      order: -2; margin-left: auto; text-align: right; font-size: var(--fs-2xs); line-height: 1.2;
    }
    .pm-table td.qty-cell::before { display: block; }
    .pm-table td.qty-cell b { font-size: var(--fs-lg); color: var(--primary); }
  }
  @media (max-width: 620px) {
    /* Phone: one swipeable line per field, so the filters stay a few rows tall. */
    .pm-row { align-items: center; }
    .pm-label { flex-basis: 70px; }
    .pm-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .pm-chips::-webkit-scrollbar { display: none; }
    .pm-chips .chip { min-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { .pm-table tr[data-goto] { transition: none; } }
  .list-table .mono { font-family: var(--mono); }
  .list-table .faint { color: var(--faint); }
  .pdf-link {
    display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 4px 10px;
    border: 1px solid var(--primary); border-radius: 6px; color: var(--primary);
    font-family: var(--sans); font-size: var(--fs-xs); font-weight: 700; text-decoration: none;
  }
  .pdf-link:hover, .pdf-link:focus-visible { background: var(--primary); color: #fff; outline: none; }
  .pdf-missing { color: var(--today); font-family: var(--sans); font-size: var(--fs-xs); font-weight: 700; }
  /* Phone: each row becomes a card. Code and name lead, the PDF button sits beside the code,
     and the other fields follow as small labelled values, so nothing needs a sideways scroll. */
  @media (max-width: 620px) {
    .list-table thead { display: none; }
    .list-table, .list-table tbody { display: block; }
    .list-table tr {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
    }
    .list-table td { display: block; padding: 0; border: 0; text-align: left; white-space: normal; }
    .list-table td.code-cell { order: -3; }
    .list-table td.pdf-cell { order: -2; margin-left: auto; }
    .list-table td.name { order: -1; flex: 1 1 100%; min-width: 0; }
    .list-table td[data-l] { font-size: var(--fs-xs); }
    .list-table td[data-l]::before {
      content: attr(data-l) ' '; color: var(--dim); font-family: var(--sans); font-weight: 600;
    }
    .pdf-link { min-height: 40px; padding: 6px 14px; }
  }

  .filter-wrap { margin-left: auto; position: relative; min-width: 170px; flex: 1 1 240px; max-width: 340px; }
  /* The box, not the input, carries the border: picked-product tags sit inside it ahead of the
     text and wrap onto further lines. Icon and clear button are pinned to the FIRST line. */
  .search-box {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding: 3px 40px 3px 32px; min-height: 38px; cursor: text;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  }
  .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,.14); }
  .pick-tags { display: contents; }
  /* With tags the box widens rather than stacking one tag per line in the header. */
  .filter-wrap.has-tags { flex-basis: 460px; max-width: 600px; }
  .ptag {
    display: inline-flex; align-items: center; gap: 2px; padding: 2px 2px 2px 8px; border-radius: 999px;
    background: #e6ebfa; color: var(--primary); font-family: var(--mono); font-size: var(--fs-xs); font-weight: 700;
    white-space: nowrap;
  }
  .ptag-x {
    border: 0; background: none; color: inherit; cursor: pointer; font-size: var(--fs-xs);
    width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .ptag-x:hover { background: rgba(30,64,175,.14); }
  .ptag-x:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .filter-wrap input {
    flex: 1 1 90px; min-width: 90px; padding: 6px 4px; border: 0; outline: none;
    background: transparent; color: var(--ink); font-family: var(--sans); font-size: var(--fs-sm);
  }
  .filter-wrap input::placeholder { color: var(--dim); }
  .filter-wrap::before {
    content: '⌕'; position: absolute; left: 11px; top: 19px; transform: translateY(-50%);
    color: var(--dim); font-size: var(--fs-md); pointer-events: none; z-index: 1;
  }
  /* Was a 14x14px <span> with a click handler: unreachable by keyboard and far under the
     44px touch minimum. Now a real button with a 44px hit area. */
  .filter-wrap .clear-x {
    position: absolute; right: 2px; top: 19px; transform: translateY(-50%);
    color: var(--dim); cursor: pointer; font-size: var(--fs-base); display: none;
    width: 44px; height: 44px; align-items: center; justify-content: center;
    background: none; border: none; border-radius: 6px; padding: 0;
  }
  .filter-wrap .clear-x:hover { color: var(--ink); }
  .filter-wrap.has-value .clear-x { display: flex; }
  .filter-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 60;
    margin: 0; padding: 4px 0; list-style: none; max-height: 340px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(22,24,29,.16); min-width: min(460px, calc(100vw - 32px));
  }
  .filter-list li {
    display: flex; align-items: center; gap: var(--sp-2); padding: 8px 12px; cursor: pointer;
    font-family: var(--sans); font-size: var(--fs-sm); color: var(--ink); min-height: 40px;
  }
  .filter-list li.is-active, .filter-list li[data-i]:hover { background: var(--panel-alt); }
  .filter-list .fl-name { flex: 1 1 auto; min-width: 0; line-height: 1.3; }
  .filter-list .fl-name mark { background: none; color: var(--primary); font-weight: 700; }
  .filter-list .fl-n { flex: 0 0 auto; color: var(--dim); font-size: var(--fs-xs); }
  .filter-list .fl-empty { color: var(--dim); cursor: default; font-size: var(--fs-xs); }
  /* A drawn checkbox (the row itself is the control): empty square when not picked, filled with
     a white tick when picked. The tick is always in the markup and only coloured in when on. */
  .filter-list .fl-tick {
    flex: 0 0 18px; width: 18px; height: 18px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid #8a94ad; border-radius: 4px; background: var(--panel);
    color: transparent; font-size: 12px; font-weight: 900; line-height: 1;
  }
  .filter-list li.is-picked .fl-tick { background: var(--primary); border-color: var(--primary); color: #fff; }
  .filter-list li[data-i]:hover .fl-tick { border-color: var(--primary); }
  .filter-list li.fl-hint {
    min-height: 0; padding: 4px 12px 6px; cursor: default; color: var(--dim);
    font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  }
  .filter-list li.is-picked .fl-name { font-weight: 600; }

  /* Freshness stamp. This slot used to hold a wall clock ticking seconds on a schedule whose
     granularity is days — precision about the wrong thing. It now reports the age of the data,
     which is the only time value that can mislead someone into running the wrong job. */
  .clock {
    font-family: var(--mono); font-size: var(--fs-xs); color: var(--dim);
    white-space: nowrap; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 6px;
    /* A button, because polling pauses when idle and this is how you resume it. */
    background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 6px 8px; min-height: 36px; cursor: pointer;
  }
  .clock:hover { border-color: var(--line); color: var(--ink); }
  .clock:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .clock b { color: var(--ink); font-weight: 700; }
  .clock .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: var(--dim); }
  /* Three states, each also carried by the adjacent text — never colour alone. */
  .clock.is-fresh .dot { background: var(--ok); }
  .clock.is-aging .dot { background: var(--amber); }
  .clock.is-stale .dot { background: var(--today); }
  .clock.is-stale { color: var(--today); font-weight: 700; }

  /* flex:1 makes main absorb the leftover height so its bottom edge IS the viewport bottom.
     The view containers (.table-scroll, .cards, .tablet-cards) are the scroll boxes inside it;
     the grand-total strip is NOT parked at that bottom edge — see below. */
  /* Desktop: main bounds the table's scroll box, and does not scroll itself.
     Card breakpoints override this — see the 1000px block. */
  main {
    padding: var(--sp-4); max-width: 100%; margin: 0 auto; width: 100%;
    flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0;
  }
  /* No `margin-top: auto`. That parked the strip on the viewport's bottom edge permanently, so
     the grand totals hovered over the board at every scroll position and there was no visual
     end to the page. It sits after the scrolling view instead: reaching it means reaching the
     end of the data. `flex: 0 0 auto` keeps it at its natural height rather than being
     stretched or squeezed by the column.
     The original reason for margin-top:auto — a SHORT board leaving the strip floating
     mid-page — is handled by the scroll box above it taking the leftover height (flex: 1 1
     auto), which pushes the strip to the bottom without pinning it there. */
  main > .grand { flex: 0 0 auto; }

  /* ---------------- legend ---------------- */
  /* Sticky: it maps colour to machine, and scrolling it away left hue as an unresolvable
     signal exactly when the user had scrolled far enough to need it. */
  .legend {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: center;
    padding: var(--sp-2) var(--sp-1) var(--sp-3); font-family: var(--sans); font-size: var(--fs-xs); font-weight: 500; color: var(--dim);
  }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend .chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend .chip.on i { outline: 1.5px solid #fff; }
  @media (max-width: 620px) {
    /* A phone only needs the dot and the number; the word spent a whole row on the key. */
    .legend .mword { display: none; }
    .legend .mchip { min-width: 52px; justify-content: center; }
  }
  /* "Today" is a key, not a control, so it is deliberately not styled as a chip. */
  .legend .today-chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend .today-chip i { width: 10px; height: 10px; display: inline-block; background: var(--today); border-radius: 50%; }

  /* ---------------- desktop: unified table ---------------- */
  /* DESKTOP KEEPS ITS OWN BOUNDED SCROLL BOX. The wide date grid needs horizontal scrolling
     and the frozen Code/Item columns depend on it, and the sticky date header needs this box
     to have a bounded height to move within — `flex: 1 1 auto; min-height: 0` supplies that
     from the flex column.
     The grand-total strip being glued to the window is a MOBILE complaint, and on desktop the
     strip sitting under a full-height table is the intended footer behaviour. So this is left
     as it was, and only the card views (which have no horizontal overflow and no frozen
     columns) hand their scrolling to `main` — see the breakpoint override below. */
  .table-scroll {
    flex: 1 1 auto; min-height: 0;
    overflow: auto; overscroll-behavior: contain;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    margin-bottom: var(--sp-4);
  }
  /* Freeze Code + Item. Scrolling right to next week used to slide the row's identity off
     the left edge, leaving a field of coloured rectangles the planner had to count rows to
     identify — which destroys one axis of the only thing a Gantt is for. */
  th:first-child, th:nth-child(2) { position: sticky; z-index: 6; background: var(--panel-alt); }
  td:first-child, td:nth-child(2) { position: sticky; background: var(--panel); }
  th:first-child, td:first-child { left: 0; }
  th:nth-child(2), td:nth-child(2) { left: var(--froz-1, 96px); }
  td:first-child, td:nth-child(2) { z-index: 2; }
  /* The seam needs to read as an edge, or frozen cells look like they overlap the grid. */
  th:nth-child(2), td:nth-child(2) { box-shadow: 6px 0 6px -6px rgba(22,24,29,.18); }
  /* Frozen cells need an opaque background or the grid shows through as it scrolls beneath
     them — but it must be the row's OWN colour. Painting both row types --panel-alt put a
     grey patch over the subtotal's tint at exactly the two columns that carry its label. */
  .group-row td:first-child, .group-row td:nth-child(2) { background: var(--panel-alt); }
  .subtotal-row td:first-child, .subtotal-row td:nth-child(2) { background: #dbe0f2; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td {
    padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap;
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--fs-sm); font-weight: 600;
  }
  /* date-grid cells override the data-cell padding to stay tight */
  th.date-th, td.date-td { padding-left: 0; padding-right: 0; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th {
    font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
    font-weight: 700; background: var(--panel-alt); position: sticky; top: 0; z-index: 3;
    border-bottom: 1px solid var(--line); padding-top: 10px; padding-bottom: 10px;
  }
  td:nth-child(2) { font-family: var(--sans); color: var(--ink); font-weight: 500; font-size: var(--fs-sm); }
  /* name column: let it breathe — the table scrolls horizontally, so show the full name
     (wrap onto a second line if long) instead of cutting it with an ellipsis. */
  .data-col { max-width: 280px; white-space: normal; line-height: 1.3; }  td:first-child.data-col { font-weight: 700; white-space: nowrap; }
  tbody tr:not(.group-row):not(.subtotal-row):hover td:not(.date-td) { background: var(--panel-alt); }

  .group-row td {
    background: var(--panel-alt); font-family: var(--sans); font-weight: 700; font-size: var(--fs-lg);
    text-align: left; color: var(--primary);
    padding: var(--sp-3) var(--sp-3); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line);
  }
  .group-row .sub {
    font-family: var(--sans); font-weight: 500; color: var(--dim); font-size: var(--fs-xs); margin-left: var(--sp-3);
  }
  /* Same tinted band as the card views, so a subtotal looks like a subtotal at every width. */
  .subtotal-row td {
    font-weight: 800; background: #dbe0f2; color: var(--ink);
    border-top: 2px solid var(--primary); border-bottom: 1px solid var(--line);
    font-size: var(--fs-md);
  }
  .subtotal-row td:first-child { font-family: var(--sans); color: var(--primary); font-weight: 800; text-transform: uppercase; font-size: var(--fs-2xs); letter-spacing: .04em; }

  /* date grid: compact day columns so the whole ~30-day span fits with far less horizontal
     scroll. Narrow cells, tight labels — the colored bars still read clearly. */
  /* Day number horizontal, month printed once per change. Rotated 10px grey text was
     unreadable at the 600-900mm off-axis distance a shared plant tablet is actually viewed
     from; a 2-digit day number needs no rotation to fit 24px. */
  .date-th {
    width: 24px; min-width: 24px; padding: 5px 0; text-align: center; font-size: var(--fs-2xs);
    height: 44px; color: var(--ink); border-left: 1px solid var(--line); font-weight: 700;
    vertical-align: bottom; line-height: 1.15;
  }
  .date-th .dmon {
    display: block; font-size: var(--fs-2xs); font-weight: 800; color: var(--primary);
    text-transform: uppercase; letter-spacing: .02em;
  }
  .date-th .dmon:empty { visibility: hidden; }
  .date-th .dmon::after { content: '\00a0'; }
  /* Today is marked on THREE channels — tint, a full-height column wash, and a printed cap —
     because a 2px hairline is erased by a scratched screen protector, and colour alone fails
     the ~8% of the floor with red-green deficiency. */
  .date-th.is-today { background: rgba(209,55,74,.14); color: var(--today); font-weight: 800; }
  .date-th.is-today .dmon { color: var(--today); }
  .date-td { width: 24px; min-width: 24px; padding: 4px 0; border-left: 1px solid var(--line); }
  .date-td.is-today-col {
    background: rgba(209,55,74,.09);
    box-shadow: inset 2px 0 0 var(--today), inset -2px 0 0 var(--today);
  }
  tr:not(.group-row):not(.subtotal-row) .date-td { padding-top: 5px; padding-bottom: 5px; }
  .date-fill { display: block; height: 100%; min-height: 30px; position: relative; }
  /* Machine number inside the bar's first cell — the redundant channel that makes the
     palette decorative rather than load-bearing. */
  .date-fill .mnum {
    position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 800; color: #fff;
    line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.35); pointer-events: none;
  }

  /* ---------------- grand total strip ---------------- */
  /* A footer, not an overlay: it follows the scrolling view rather than being pinned to the
     window, so it comes into sight only when the board has been scrolled to its end. On a
     short board the scroll box above still absorbs the spare height, so the strip lands at the
     bottom of the window anyway — without hovering over the data on a long one. */
  .grand {
    flex: 0 0 auto;
    display: flex; gap: 0; flex-wrap: wrap; margin-top: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .grand div { padding: var(--sp-3) var(--sp-4); flex: 1 1 140px; border-right: 1px solid var(--line); }
  .grand div:last-child { border-right: none; }
  .grand b { font-family: var(--mono); font-size: var(--fs-2xl); font-weight: 700; display: block; color: var(--primary); letter-spacing: -.01em; }
  .grand span { color: var(--dim); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .06em; font-family: var(--sans); font-weight: 600; }

  /* ---------------- product colour ----------------
     Identity, not status. The code chip IS the swatch — the colour fills the object the reader
     is already looking at. Desktop + tablet share .code-chip; mobile reuses its own
     .card-top .code so the existing flex sizing keeps holding the long product names.
     Colour never replaces the colour name: it stays in the chip's title and, on mobile, as its
     own metric cell. Ink is computed per fill by measured contrast — see inkOn(). */
  .code-chip {
    display: inline-block; font-family: var(--mono); font-weight: 700; font-size: var(--fs-xs);
    letter-spacing: .02em; color: var(--ink); background: var(--panel-alt);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; white-space: nowrap;
  }
  /* A tinted chip supplies its own background/border/ink inline. The dark ring keeps SILVER
     and other pale fills from dissolving into the white panel. */
  .code-chip.is-tinted, .card-top .code.is-tinted { box-shadow: inset 0 0 0 1px rgba(0,0,0,.22); }
  /* Product code/name that opens By Product. Hovering EITHER one lights up both (the row's
     :has), so the pair reads as one link: the chip lifts with a blue ring, the name turns blue
     and an underline draws in. A press sinks it. */
  [data-goto] { cursor: pointer; }
  .code-chip[data-goto], .card-top .code[data-goto] {
    transition: transform .15s ease, box-shadow .15s ease;
  }
  span[data-goto]:not(.code-chip):not(.code) {
    background: linear-gradient(currentColor, currentColor) 0 100% / 0 1.5px no-repeat;
    transition: color .15s ease, background-size .2s ease;
  }
  :is(tr, .tcard, .card):has([data-goto]:hover) :is(.code-chip, .code)[data-goto] {
    transform: translateY(-2px);
    box-shadow: 0 3px 8px rgba(30, 64, 175, .28), 0 0 0 2px var(--primary);
  }
  :is(tr, .tcard, .card):has([data-goto]:hover) span[data-goto]:not(.code-chip):not(.code) {
    color: var(--primary); background-size: 100% 1.5px;
  }
  [data-goto]:active { transform: scale(.96) !important; }
  [data-goto]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  /* Where the click landed: a blue flash, then the group stays marked (left bar + tint) until
     the next re-render — a tab change, a filter, a sort. */
  .is-goto td:not(.date-td), .tcard.is-goto, .card.is-goto, .tcard-group.is-goto, .card-group-head.is-goto { background: #e3eafc !important; }
  .group-row.is-goto td:first-child, .tcard-group.is-goto, .card-group-head.is-goto { box-shadow: inset 4px 0 0 var(--primary); }
  .goto-flash td, .tcard-group.goto-flash, .card-group-head.goto-flash { animation: gotoFlash 1.4s ease-out; }
  @keyframes gotoFlash { 0%, 35% { background: #b9cbf7; } 100% { background: #e3eafc; } }
  @media (prefers-reduced-motion: reduce) {
    [data-goto], [data-goto] * { transition: none !important; }
    .goto-flash td, .tcard-group.goto-flash, .card-group-head.goto-flash { animation: none; }
  }
  /* Tablet/mobile: a full-height edge bar carries the colour at a glance, so the card can be
     identified without reading. 5px tablet / 6px mobile — the phone card is shorter, so the
     bar needs slightly more width to register. */
     An inset box-shadow, NOT a ::before with extra padding-left. .card-sub and .tcard-sub are
     SIBLINGS whose auto-fit tracks must resolve against the same box as the card's — widening
     the card's padding by the bar's width shifts every figure out from under its subtotal,
     which is the misalignment the previous pass already had to fix once. A shadow paints
     inside the existing padding and changes no geometry. */
  .tcard { box-shadow: inset 5px 0 0 0 var(--pc, transparent); }
  .card { box-shadow: inset 6px 0 0 0 var(--pc, transparent); }

  /* Mobile timeline ends as solid blocks rather than outlined text. Both ends take the same
     brand fill: start and end are schedule boundaries, and a green/red pair would read as
     good-vs-bad about dates that carry no such judgement. #1e40af on #fff is 8.72:1. */
  .cbar-lbl.is-filled {
    background: var(--primary); border-color: var(--primary); color: #fff;
  }

  /* ---------------- tablet: proportional single-bar timeline ---------------- */
  .tablet-cards { display: none; }
  /* Scrolls with its own rows — same reasoning as .card-group-head. */
  .tcard-group {
    background: var(--panel-alt); padding: var(--sp-3); font-family: var(--sans); font-weight: 700;
    font-size: var(--fs-lg); color: var(--primary); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between;
  }
  /* Column labels for the tablet cards — pinned for the whole list, above the group headers. */
  .tcard-head {
    position: sticky; top: 0; z-index: 6;
    display: grid; grid-template-columns: 1.1fr repeat(5, 0.55fr) 2fr; gap: var(--sp-2);
    align-items: center; padding: 5px var(--sp-3);
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .tcard-head > div {
    text-align: right; min-width: 0;
    color: var(--dim); font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;
    letter-spacing: .03em; font-family: var(--sans);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The first (code/name) and last (timeline) columns are not figures — their labels sit left. */
  .tcard-head > div:first-child, .tcard-head > div:last-child { text-align: left; }
  .tcard-group .sub { font-family: var(--sans); font-weight: 500; color: var(--dim); font-size: var(--fs-xs); }
  .tcard {
    display: grid; grid-template-columns: 1.1fr repeat(5, 0.55fr) 2fr; gap: var(--sp-2); align-items: center;
    padding: var(--sp-3); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: var(--fs-sm);
  }
  .tcard:last-child { border-bottom: none; }
  .tcard .code { min-width: 0; font-weight: 700; color: var(--ink); font-family: var(--mono); font-size: var(--fs-md); }
  .tcard .code small {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--dim); font-weight: 500; font-family: var(--sans); font-size: var(--fs-xs);
    margin-top: 3px; line-height: 1.3;
  }
  .tcard .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .tcard .val .lbl { display: block; color: var(--faint); font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
  .prop-bar { position: relative; height: 28px; background: var(--panel-alt); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .prop-bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 13px; }
  .prop-bar .today-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--today); z-index: 2; }
  /* Mirrors .tcard's own track definition so each subtotal sits under the column it totals.
     As a flex row it produced "12,000 / 6,075 / 3,900 / 25" jammed at one edge, aligned with
     nothing. */
  .tcard-sub {
    display: grid; grid-template-columns: 1.1fr repeat(5, 0.55fr) 2fr; gap: var(--sp-2);
    align-items: center; padding: var(--sp-2) var(--sp-3);
    background: #dbe0f2;
    font-family: var(--mono); font-weight: 800; font-size: var(--fs-md); color: var(--ink);
    border-top: 2px solid var(--primary); border-bottom: 1px solid var(--line);
  }
  .tcard-sub .lead {
    font-family: var(--sans); font-size: var(--fs-2xs); font-weight: 700; color: var(--primary);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .tcard-sub .val { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------------- mobile: stacked cards, single bar, minimal chrome ---------------- */
  .cards { display: none; }
  /* Scrolls with its own rows — deliberately NOT sticky. The column labels are the only thing
     pinned: they apply to every row, whereas the group's name is already stated at the head of
     its own block and pinning it spent a second line of a phone screen restating it. */
  .card-group-head {
    background: var(--panel-alt); padding: var(--group-head-pad) var(--sp-3); font-family: var(--sans); font-weight: 700; font-size: var(--fs-sm);
    color: var(--primary); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .card-group-head > span:first-child {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .01em;
  }
  .card-group-head .sub { flex: 0 0 auto; font-family: var(--sans); font-weight: 600; color: var(--dim); font-size: var(--fs-2xs); }
  .card { border-bottom: 1px solid var(--line); padding: var(--sp-3); }
  .card:last-child { border-bottom: none; }
  /* Code chip on its own line, product name beneath it on up to two full-width lines.
     The previous single-line version put the chip and the name in one flex row, which left
     a long name ~200px on a 360px phone and cropped it to "ARZOL 900 ML/1 LTR G…". The
     product name is how the manager identifies the job — it is the one string on the card
     that must never be guessed at, so it gets the full card width. */
  /* One line: code chip, machine chip, then the name taking whatever width is left.
     The name previously sat on its own two-line block below the chips, which spent a whole
     row of a phone card on it and left the chips floating in mostly empty space. */
  .card-top {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: var(--sp-2); min-width: 0;
  }
  .card-top .code {
    flex: 0 0 auto; font-weight: 700; font-size: var(--fs-xs); font-family: var(--mono);
    letter-spacing: .02em; color: var(--ink);
    background: var(--panel-alt); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px;
  }
  .card-top .name {
    /* min-width:0 is what lets a flex item shrink below its content width — without it the
       long ARZOL names force the row wider than the card and push the chips off. */
    flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--ink); font-weight: 600; font-size: var(--fs-xs);
    font-family: var(--sans); line-height: 1.3;
  }
  /* Machine identity as text, not hue alone — the bar colour below is decoration, this is
     the fact. Mirrors the desktop bar label. */
  .card-top .mch {
    flex: 0 0 auto; font-family: var(--mono); font-size: var(--fs-2xs);
    font-weight: 700; color: #fff; border-radius: 5px; padding: 3px 6px; letter-spacing: .02em;
  }
  /* Metrics grid. Column count is NOT hardcoded: the row carries 5 metrics normally and 7 in
     Color view (RM Req + MB), and a fixed `repeat(5, 1fr)` pushed those two extras onto a
     ragged second row whose columns did not line up with the first. auto-fit lets both counts
     resolve to even columns, and when 7 cannot fit the width they wrap into a TIDY second row
     of equal cells instead of a misaligned remainder. */
  /* Column labels once per group, stuck under the group header, instead of repeated inside
     every card. The track count is set inline from the same column list the cards use, so the
     header, the cards and the subtotal always resolve to identical columns. */
  /* Pinned at the top of the scrollport for the whole list. z-index above the group headers, so
     each one slides UNDER this row rather than over it as it hands off to the next. */
  .metric-head {
    position: sticky; top: 0; z-index: 6;
    display: grid; gap: 10px 4px; padding: 5px var(--sp-3);
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .metric-head > div {
    text-align: center; min-width: 0;
    color: var(--dim); font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;
    letter-spacing: .02em; font-family: var(--sans);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Vertical rules tying each figure to its column label. The grids all resolve to the same
     equal 1fr tracks, so one repeating background painted at the same track pitch lines up
     with every row without a separator element per cell.
     Semi-transparent and 1px: this has to sit behind ~40 rows of figures without competing
     with them — the job is to guide the eye down a column, not to draw a table. */
  /* No minmax floor: a 58px minimum could not fit 7 columns in a 360px phone's 336px of
     content box, so the row wrapped 5+2 and the subtotal wrapped with it — which is what made
     Color view look misaligned even after the cell counts matched. Now the cells hold only a
     number, so equal 1fr tracks fit. */
  .metric-row {
    display: grid; gap: 10px 4px;
    margin-bottom: var(--sp-2); padding: 9px 0; border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .metric-row > div {
    display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0;
  }
  /* was 9px --faint (2.89:1, fails AA at any size). These labels name the numbers; on a phone
     held at arm's length under plant light they have to be readable, not decorative. */
  .metric-row span {
    color: var(--dim); font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;
    letter-spacing: .02em; font-family: var(--sans); margin-bottom: 3px;
  }
  /* Regular weight. Per-item figures are the many; the subtotal is the one that closes a
     group, and it can only read as a total if the rows above it are quieter than it is. */
  .metric-row b {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-md); font-weight: 400; color: var(--ink); line-height: 1;
  }
  .card .prop-bar { height: 26px; margin-top: var(--sp-1); }

  /* extra-compact timeline: [startDate] ——●═════●—— [endDate] on one line */
  .cbar { display: flex; align-items: center; gap: 7px; }
  /* Filled chips rather than bare text. As 11px grey on white these were the faintest thing
     on the card, yet the start and end dates are the whole point of the bar beside them. */
  .cbar-lbl {
    flex: 0 0 auto; font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 700;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    color: var(--ink); background: var(--panel-alt);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px;
  }
  .cbar-track {
    position: relative; flex: 1 1 auto; height: 8px; border-radius: 4px;
    background: var(--panel-alt); border: 1px solid var(--line);
  }
  .cbar-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; opacity: .9; }
  .cbar-dot {
    position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%;
    transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--panel); z-index: 2;
  }
  .cbar-today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--today); z-index: 3; }
  .cbar-empty { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--dim); padding: 3px 0; }

  /* The per-card mobile day-grid (.mgrid / mobileGridHtml) was removed here: it was fully
     built but never called, and compactBar is the better answer for a phone anyway — the
     whole interval reads at a glance instead of requiring a scroll inside every card. */

  /* .table-scroll is deliberately NOT in this list: it needs `overflow: auto` for its sticky
     date header, and this rule comes later in the cascade, so including it here silently
     reverted that to hidden and un-stuck the header. */
  .cards, .tablet-cards { border-radius: 8px; background: var(--panel); border: 1px solid var(--line); margin-bottom: var(--sp-4); }
  /* These card lists are SCROLL BOXES, exactly like .table-scroll above — not auto-height
     blocks that let the page scroll.
     Sticky resolves against the nearest SCROLLING ancestor. `body` is height:100% and `main`
     is a flex column with no overflow, so nothing above a card ever scrolled: the headers had
     no scrollport to pin inside and just travelled with the content. Deleting the old
     `overflow: hidden` did not fix that — it left the box with no scrolling ancestor at all
     rather than the wrong one, which is why the headers still did not stick.
     `flex: 1 1 auto; min-height: 0` takes a bounded height from the flex column (the same
     mechanism .table-scroll uses, and for the same reason a measured `100vh - chrome` literal
     was rejected there — it drifts on every layout change). `overflow: auto` then makes THIS
     the scrollport the sticky rows resolve against. It also restores the corner clipping that
     the removed `overflow: hidden` used to provide, so no clip-path is needed. */
  /* Natural height, NOT a scroll box. `main` owns the vertical scrolling now; if these boxes
     also scrolled, the grand-total strip below them would be pinned to the bottom of the flex
     line and permanently on screen — the bug this replaced. Auto height also means no
     `overflow` here, which is what lets the sticky rows inside resolve against main. */
  .cards, .tablet-cards { flex: 0 0 auto; }

  /* --- breakpoints: three distinct renderings, not one shrinking table --- */
  @media (max-width: 1000px) {
    .table-scroll { display: none; }
    .tablet-cards { display: block; }
    /* Card views: MAIN does the vertical scrolling, not the card list.
       While the card list was the scroll box it was a `flex: 1 1 auto` item, which places the
       grand-total strip below it at the bottom of the flex line — so the totals stayed on
       screen at every scroll position. Deleting the strip's `margin-top: auto` did not help,
       because the flex line was placing it, not the margin.
       With main scrolling and the list at natural height, the strip is simply the last thing
       in the flow and is reached only at the end of the board. The sticky group and column
       headers keep working: they now resolve against main, which is what scrolls. */
    main { overflow-y: auto; overscroll-behavior: contain; }
  }
  @media (max-width: 620px) {
    .tablet-cards { display: none; }
    .cards { display: block; }
    /* compact, thumb-friendly header: the h1 drops away, tabs scroll horizontally,
       filter takes the full second row so search targets are large. The freshness stamp
       STAYS — the manager on a phone is the person least able to tell whether the plan
       they are reading is current, so it is the last thing to cut, not the first. */
    header { padding: var(--sp-2) var(--sp-3); gap: var(--sp-2); align-items: stretch; }
    header h1 { display: none; }
    .brand { order: 0; }
    .brand .wordmark { font-size: var(--fs-sm); }
    /* Header row is crowded on a phone: keep the tap target, drop the label to the icon.
       aria-label carries the name for anyone who cannot see the glyph. */
    .counter-link { order: 0; margin-left: auto; padding: 0 12px; gap: 0; font-size: var(--fs-base); }
    .counter-link .lbl { display: none; }
    .tabs {
      order: 2; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; flex-wrap: nowrap; justify-content: flex-start;
    }
    .tabs::-webkit-scrollbar { display: none; }
    /* 44px minimum touch target — was 39px. */
    .tab { flex: 0 0 auto; padding: 12px 16px; font-size: var(--fs-base); min-height: 44px; }
    .modes { order: 2; width: 100%; }
    /* Frozen Code + Item would fill a phone's whole width and leave no room for the
       figures that scroll beneath them. */
    .done-scroll th, .done-scroll td { position: static; box-shadow: none; }
    .done-scroll thead th { position: sticky; top: 0; left: auto; }
    .sum-field { flex: 1 1 45%; }

    .sum-field select { max-width: none; width: 100%; min-height: 44px; font-size: var(--fs-base); }
    .modes { flex-wrap: wrap; }
    .mode { flex: 1 1 45%; min-height: 44px; font-size: var(--fs-base); }
    .mode:nth-child(3) { border-left: none; }
    .mode:nth-child(n+3) { border-top: 1px solid var(--primary); }
    .lang-toggle { min-height: 44px; }
    .filter-wrap { order: 1; margin-left: 0; max-width: none; width: 100%; }
    .search-box { min-height: 44px; padding-left: 34px; }
    .filter-wrap::before, .filter-wrap .clear-x { top: 22px; }
    .filter-wrap input { padding: 8px 4px; font-size: var(--fs-base); }
    main { padding: var(--sp-2); }
    /* On a phone the totals are the figure no persona actually came for, so they get two
       compact columns at the end of the scroll rather than a share of the first screen. */
    .grand div { flex: 1 1 50%; padding: var(--sp-2) var(--sp-3); }
    .grand b { font-size: var(--fs-lg); }
  }

  /* ---------------- Completed view ----------------
     One table at every width: it has no date grid, so it fits a tablet and scrolls sideways
     on a phone rather than needing three renderings. Shown at all breakpoints on purpose —
     .table-scroll is hidden below 1000px, so this uses its own class. */
  .done-scroll {
    flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    margin-bottom: var(--sp-4);
  }
  .kpi { margin: 0 0 var(--sp-2); }
  .kpi-note { font-family: var(--sans); font-size: var(--fs-xs); color: var(--dim); margin: 0 var(--sp-1) var(--sp-3); }
  .kpi-note b { color: var(--ink); }
  .is-yes { color: var(--ok); font-weight: 800; }
  .is-no { color: var(--today); font-weight: 800; }
  .is-na { color: var(--faint); font-weight: 600; }
  /* One status per line, three tones. The symbol and the word carry the meaning; the tint
     only makes it findable at a glance. Tints are light so the ink keeps AA contrast. */
  .st {
    display: inline-block; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    font-family: var(--sans); font-size: var(--fs-xs); font-weight: 700; border: 1px solid transparent;
  }
  .st-good { color: var(--ok); background: #e3f4ea; border-color: #b9e2c8; }
  .st-warn { color: #8a4b06; background: #fdf0dc; border-color: #f2d3a3; }
  .st-bad { color: #b02a3c; background: #fbe4e7; border-color: #f2bcc4; }
  .st-na { color: var(--dim); background: var(--panel-alt); border-color: var(--line); }
  .late-good { color: var(--ok); }
  .late-bad { color: var(--today); }
  .invs { font-size: var(--fs-xs); color: var(--dim); text-align: left; white-space: normal; max-width: 200px; }
  .group-row .st { margin-left: var(--sp-3); vertical-align: middle; }

  /* ---------------- group sort + fold ---------------- */
  .group-bar {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-1);
  }
  .group-bar .chip { min-height: 36px; }
  /* A folded group keeps its header and subtotal; only its lines go. */
  .is-folded { display: none !important; }
  .po-tag {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; vertical-align: 1px;
    background: #e6ebfa; color: var(--primary); font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 700;
    white-space: nowrap;
  }
  .card-top .po-tag { flex: 0 0 auto; margin-left: 0; }
  .table-scroll .gh-pin { position: sticky; left: var(--sp-3); display: inline-block; }
  [data-gh] { cursor: pointer; }
  .gtoggle {
    font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
    cursor: pointer; text-align: left; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
  }
  .gtoggle::before { content: '▾'; display: inline-block; width: 1.1em; color: var(--dim); }
  .gtoggle[aria-expanded="false"]::before { content: '▸'; }
  .gtoggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 3px; }
  .kpi b.st-good, .kpi b.st-warn, .kpi b.st-bad { background: none; border: none; padding: 0; }
  .kpi b.st-good { color: var(--ok); }
  .kpi b.st-warn { color: #8a4b06; }
  .kpi b.st-bad { color: #b02a3c; }
  .done-scroll td.txt { text-align: left; font-family: var(--sans); font-weight: 500; }
  .done-scroll th.txt, .done-scroll th.invs { text-align: left; }

  /* ---------------- Summary tab ---------------- */
  .sum-bar {
    display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); align-items: flex-end;
    margin: 0 0 var(--sp-3); padding: var(--sp-3); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .sum-field { display: flex; flex-direction: column; gap: 2px; }
  .sum-field span {
    font-family: var(--sans); font-size: var(--fs-2xs); font-weight: 700; color: var(--dim);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .sum-field select {
    font-family: var(--sans); font-size: var(--fs-sm); color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-height: 36px; max-width: 220px;
  }
  .sum-field input[type=date] {
    font-family: var(--sans); font-size: var(--fs-sm); color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px;
  }
  .sum-field select:focus-visible, .sum-field input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .sum-title { font-family: var(--sans); font-size: var(--fs-lg); color: var(--primary); margin: 0 var(--sp-1) var(--sp-2); }
  .kpi small { display: block; font-family: var(--sans); font-size: var(--fs-2xs); font-weight: 600; margin-top: 2px; }
  .sum-bar, .sum-title, .trend { flex: 0 0 auto; }
  .sum-scope .mode { min-height: 36px; padding: 7px 14px; }
  .trend { display: grid; grid-template-columns: repeat(12, minmax(52px, 1fr)); gap: 4px; margin: var(--sp-3) 0; overflow-x: auto; }
  .trend-m {
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: var(--fs-2xs); color: var(--dim);
  }
  .trend-m b { font-family: var(--sans); font-size: var(--fs-xs); color: var(--ink); }
  .trend-m:disabled { cursor: default; opacity: .45; }
  .trend-m.is-on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .trend-m:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .trend-bar { display: flex; align-items: flex-end; width: 22px; height: 48px; background: var(--panel-alt); border-radius: 3px; }
  .trend-bar i { display: block; width: 100%; background: var(--primary); border-radius: 3px; }
  .share { display: inline-block; width: 64px; height: 8px; margin-right: 6px; background: var(--panel-alt); border-radius: 4px; vertical-align: middle; overflow: hidden; }
  .share i { display: block; height: 100%; background: var(--primary); }

  /* ---------------- chip filters ---------------- */
  .chipbar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin: 0 0 var(--sp-3);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 6px 12px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink);
    font-family: var(--sans); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; cursor: pointer;
  }
  .chip:hover { border-color: var(--primary); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .chip-clear { color: var(--dim); }
  .chip-badge {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: #fff; color: var(--primary); font-size: var(--fs-2xs);
  }
  .chip-sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
  .chip-panel {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); align-items: flex-end;
    margin: -4px 0 var(--sp-3); padding: var(--sp-3); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper b { font-family: var(--sans); font-size: var(--fs-base); color: var(--primary); min-width: 76px; text-align: center; }
  .stepper .chip { padding: 6px 12px; font-size: var(--fs-md); }
  /* Phone: one row that scrolls sideways, with 44px targets. Declared after the base chip
     rules so it wins on source order. */
  @media (max-width: 620px) {
    .chipbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .chipbar::-webkit-scrollbar { display: none; }
    .chip { min-height: 44px; font-size: var(--fs-base); flex: 0 0 auto; }
    .chipbar .sum-scope { flex: 0 0 auto; width: auto; order: 0; }
  }


  /* Completed / Summary figures: a compact strip, not a wall of tiles (2026-11-17). The
     method note folds behind a summary line. */
  .grand.kpi div { padding: var(--sp-2) var(--sp-3); flex-basis: 110px; }
  .grand.kpi b { font-size: var(--fs-xl); }
  details.kpi-note summary { cursor: pointer; color: var(--dim); font-weight: 600; width: max-content; max-width: 100%; }
  details.kpi-note[open] summary { margin-bottom: 4px; }
  @media (max-width: 620px) {
    .grand.kpi { display: grid; grid-template-columns: repeat(4, 1fr); }
    .grand.kpi:has(> div:nth-child(5)) { grid-template-columns: repeat(3, 1fr); }
    .grand.kpi div { padding: 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
    .grand.kpi span { font-size: 10px; letter-spacing: .02em; display: block; line-height: 1.2; }
    .grand.kpi b { font-size: var(--fs-base); }
    .grand.kpi small { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi-note { margin-bottom: var(--sp-2); }
    .group-bar { flex-wrap: nowrap; align-items: center; padding: 0 0 var(--sp-2); gap: var(--sp-2); }
    .group-bar .group-sort { flex: 1 1 auto; min-width: 0; }
    .group-bar .group-sort > span { display: none; }
    .group-bar .group-sort select { min-height: 40px; }
    .group-bar .chip { flex: 0 0 auto; min-height: 40px; }
  }

  /* ---------------- download menu ---------------- */
  .export-wrap { position: relative; }
  .export-wrap[hidden] { display: none; }
  .export-wrap .counter-link { cursor: pointer; padding: 0 14px; font-size: var(--fs-md); }
  .export-menu {
    position: absolute; left: 0; top: calc(100% + 4px); z-index: 40; min-width: 160px;
    display: flex; flex-direction: column; padding: 4px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(22,24,29,.14);
  }
  .export-menu[hidden] { display: none; }
  .export-menu button {
    text-align: left; padding: 10px 12px; min-height: 40px; border: none; border-radius: 6px;
    background: none; font-family: var(--sans); font-size: var(--fs-sm); font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .export-menu button:hover, .export-menu button:focus-visible { background: var(--panel-alt); outline: none; }

  .empty { padding: 48px 20px; text-align: center; color: var(--dim); font-family: var(--sans); font-weight: 500; font-size: var(--fs-base); }
  /* Recovery affordance inside empty/error states — previously the only way out of a failed
     load was a manual page reload. */
  .linkish {
    background: none; border: none; padding: 6px 8px; margin-left: 4px; cursor: pointer;
    color: var(--primary); font-family: var(--sans); font-size: var(--fs-base); font-weight: 700;
    text-decoration: underline; text-underline-offset: 2px; border-radius: 6px;
  }
  .linkish:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Secondary to the tabs — this leaves the board, so it should not compete with the
     controls that operate it. 44px tall for the same reason the tabs are. */
  .counter-link {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    min-height: 44px; padding: 0 14px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel);
    font-family: var(--sans); font-size: var(--fs-sm); font-weight: 600;
    color: var(--dim); text-decoration: none;
    transition: color .12s, border-color .12s;
  }
  /* Over-supplied. These rows used to be filtered out of the payload entirely, so the board
     disagreed with the sheet and gave no hint why. They belong on the board — flagged, since
     a negative balance is a state someone has to act on. */
  .is-neg { color: var(--today); font-weight: 800; }

  .counter-link:hover { color: var(--primary); border-color: var(--primary); }
  .counter-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .jump-today {
    margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; min-height: 32px; cursor: pointer;
    font-family: var(--sans); font-size: var(--fs-xs); font-weight: 700; color: var(--primary);
  }
  .jump-today:hover { border-color: var(--primary); }

  /* Mobile group subtotal — matches the tablet/desktop treatment. */
  /* The subtotal repeats the metric grid's geometry EXACTLY — same auto-fit tracks, same
     gap, same padding — so each total sits directly beneath the column it totals. It was
     previously a right-aligned run of text ("19,500 qty · 2,969 bal") that lined up with
     nothing above it and read as a footnote rather than a figure worth scanning. */
  /* .card-sub is a SIBLING of .card, not a child, so it does not inherit the card's 12px
     padding. Its own horizontal padding has to equal that inset — otherwise the auto-fit
     tracks resolve against a wider box and every total sits ~12px left of the figure it
     totals. The vertical padding stays a little larger to give the row weight as a footer. */
  .card-sub {
    display: grid; gap: 10px 4px;
    padding: 11px var(--sp-3);
    /* A tinted brand wash instead of --panel-alt. At #f2f4f8 the band was within a few
       percent of the white card behind it, so the row that closes a group looked like just
       another row. This reads as a boundary while staying quiet enough for a plant screen.
       background-COLOR, not the `background` shorthand: the shorthand resets background-image
       and would wipe out the column separators painted by the shared rule above. */
    background-color: #dbe0f2;
    border-top: 2px solid var(--primary); border-bottom: 1px solid var(--line);
  }
  .card-sub > div {
    display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0;
  }
  /* No column headers on the subtotal row: it sits directly beneath the item rows that are
     already labelled, so repeating QTY / SUPPLIED / READY / BALANCE only adds noise. Column
     position carries the meaning. */
  .card-sub span { display: none; }
  .card-sub b {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-md); font-weight: 800; color: var(--ink); line-height: 1;
  }
  /* "Subtotal" names the band from its own line above the figures, not from one of the grid
     tracks. Every track now carries a number that has to line up with the column above it, so
     spending one on a word would push all the figures off their columns. */
  .card-sub-label {
    background: #dbe0f2; border-top: 2px solid var(--primary);
    padding: 6px var(--sp-3) 0; color: var(--primary);
    font-family: var(--sans); font-size: var(--fs-2xs); font-weight: 800;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .card-sub-label + .card-sub { border-top: none; }

  /* Vertical rules tying each figure to the column label above it.
     Declared AFTER .metric-head, .metric-row and .card-sub — all three set a background, and
     an earlier `background`/`background-color` later in the cascade would knock the image out.
     One repeating gradient at the track pitch rather than a border per cell: the three grids
     resolve to the same equal 1fr tracks, so a single pitch lands on every track edge.
     content-box so the rules span exactly the columns' box, not the element's padding.
     Semi-transparent 1px — this sits behind ~40 rows of figures and has to guide the eye down
     a column without drawing a table over the data. */
  .metric-head, .metric-row, .card-sub {
    /* The line occupies the LAST 1px of each track, not the first. Drawn from 0 the gradient
       puts a rule at x=0 — the outer left edge, a border around the data rather than a
       separator between columns. (background-position cannot correct that: a percentage
       resolves against `positioning area - image size`, which for a full-width repeating
       gradient is zero, so the offset would be silently ignored.) Ending each repetition with
       the line instead puts every rule on a track boundary, and the final one lands on the
       right edge where content-box clips it. */
    background-image: repeating-linear-gradient(to right,
      transparent 0, transparent calc(100% / var(--cols) - 1px),
      rgba(31,35,48,.10) calc(100% / var(--cols) - 1px), rgba(31,35,48,.10) calc(100% / var(--cols)));
    background-clip: content-box; background-origin: content-box;
    background-repeat: repeat;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ---------------- one scroll on phones and tablets ----------------
     Measured 2026-10-15 at 390x844 and 360x640: the Completed table was its own scroll box
     inside the scrolling page, squeezed to whatever height was left — 50px on Summary at 844,
     2px at 640 — so it was effectively hidden, and scrolling inside the sliver fought the page.
     Below 1000px the table no longer scrolls vertically: the page is the one vertical scroller
     and the table only scrolls sideways. Declared last so it wins on source order. */
  /* overscroll-behavior must go back to auto here. The desktop `contain` stopped scroll
     chaining, so an up/down swipe that began on a table (Products, Test Reports, every
     Completed tab) scrolled nothing: the box cannot scroll vertically and would not hand the
     swipe to the page. Measured 2026-11-17 at 390px: 0px of page scroll over any table. */
  @media (max-width: 1000px) {
    .done-scroll { flex: none; min-height: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior: auto; }
  }
  /* Phones: the 269px top bar also scrolled nowhere, leaving 371px of a 640px screen for the
     data. Let the whole document scroll and the top bar scroll away with it; scrolling to the
     top brings the tabs back. The card views' pinned column labels then pin to the screen. */
  @media (max-width: 620px) {
    html, body { height: auto; }
    body { min-height: 100%; }
    header { position: static; }
    main { overflow: visible; flex: none; }
    /* The machine colour key was pinned too, and on a phone its wrapped chips covered the
       pinned column labels and the first cards. It scrolls away now; the machine number is
       printed on every card anyway. */
    .legend { position: static; }
    /* Swiping a Completed table sideways slid the product off-screen, leaving figures with no
       row identity. Pin just the narrow Code column; group rows (PO / invoice / product) pin
       their label the same way. */
    .done-scroll td:first-child, .done-scroll thead th:first-child {
      position: sticky; left: 0; z-index: 2; background: var(--panel);
      box-shadow: 6px 0 6px -6px rgba(22,24,29,.18);
    }
    .done-scroll thead th:first-child { z-index: 4; background: var(--panel-alt); }
    .done-scroll .group-row td:first-child { background: var(--panel-alt); box-shadow: none; position: static; }
    /* The heading cell spans the whole table, so pinning the cell does nothing; pin its label. */
    .done-scroll .group-row td > span:first-child { position: sticky; left: 0; z-index: 1; display: inline-block; padding: 0 10px 0 12px; margin-left: -12px; background: var(--panel-alt); }
    .done-scroll .subtotal-row td:first-child { background: #dbe0f2; }
  }
  /* ================= COMPACT PASS (2026-11-17) =================
     Measured before: the first data row started at 412px (desktop) and 614px (390px phone)
     on Open, 736px on a phone's Summary. Header, toolbars, totals and table chrome all get
     one row each at most, and every table sheds padding. */

  /* Header: one row on desktop — Counter Entry is an icon, the stamp is just the time. */
  header { padding: 8px var(--sp-4); gap: 10px; }
  header .counter-link { min-height: 36px; padding: 0 10px; }
  header .counter-link .lbl { display: none; }
  .clock { min-height: 32px; padding: 4px 6px; }
  .clock:not(.is-stale) .fresh-lbl { display: none; }
  .filter-wrap { flex: 1 1 150px; min-width: 140px; max-width: 280px; }
  .tab { padding: 6px 10px; }
  /* Below 1500px the header row is tight: the YPP mark stays, the "Dispatch" word goes. */
  @media (max-width: 1500px) { header h1 { display: none; } }
  .list-head .lh-hint { flex: 1 1 auto; }
  @media (max-width: 620px) {
    .list-head .lh-hint { display: none; } .list-head { align-items: center; }
    .filter-wrap { max-width: none; flex-basis: 100%; }
  }
  .tab { padding: 6px 12px; }
  .mode { padding: 6px 12px; min-height: 32px; }
  .lang-toggle { min-height: 32px; }
  .lang-toggle span { padding: 6px 9px; }
  main { padding: 10px var(--sp-4); }

  /* One toolbar row per tab: chips scroll sideways inside, collapse button pinned right. */
  .toolbar { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; flex: 0 0 auto; min-width: 0; }
  .tb-scroll {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px;
    overflow-x: auto; scrollbar-width: thin; padding: 2px 0;
  }
  .tb-scroll > * { flex: 0 0 auto; }
  .toolbar .chip, .toolbar .jump-today { min-height: 32px; padding: 4px 11px; font-size: var(--fs-xs); }
  .toolbar .chip-sep { height: 22px; }
  .tb-sort {
    display: inline-flex; align-items: center; gap: 4px; padding: 0 4px 0 10px; min-height: 32px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--dim);
    font-size: var(--fs-xs); font-weight: 700;
  }
  .tb-sort select {
    border: 0; background: transparent; font: inherit; color: var(--ink); padding: 4px 2px; max-width: 190px; cursor: pointer;
  }
  .toolbar .sum-scope .mode { min-height: 32px; padding: 4px 12px; font-size: var(--fs-xs); }
  .toolbar .stepper .chip { padding: 4px 10px; }
  .toolbar .stepper b { font-size: var(--fs-sm); min-width: 0; }
  .toolbar .stepper small { font-size: var(--fs-2xs); color: var(--dim); font-weight: 600; }
  /* Collapse / expand all: a glowing pill in the header beside the time — arrows plus the word
     (word hidden on phones, where the header row is full). */
  .fold-btn[hidden] { display: none !important; }
  .fold-btn {
    flex: 0 0 auto; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--primary); color: #fff; font-family: var(--sans); font-size: var(--fs-xs); font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    box-shadow: 0 0 0 3px rgba(30,64,175,.15), 0 0 14px rgba(30,64,175,.55);
    animation: foldGlow 2.4s ease-in-out infinite;
  }
  .fold-btn:hover { box-shadow: 0 0 0 4px rgba(30,64,175,.22), 0 0 18px rgba(30,64,175,.7); }
  .fold-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  @keyframes foldGlow {
    0%, 100% { box-shadow: 0 0 0 3px rgba(30,64,175,.15), 0 0 10px rgba(30,64,175,.4); }
    50% { box-shadow: 0 0 0 3px rgba(30,64,175,.22), 0 0 18px rgba(30,64,175,.7); }
  }
  @media (prefers-reduced-motion: reduce) { .fold-btn { animation: none; } }
  header .fold-btn { margin-left: auto; }
  header .fold-btn + .clock { margin-left: 0; }

  /* Filter lines: labelled chip groups side by side, one line, swipe/scroll sideways. */
  .fline {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: thin;
    padding: 2px 0 4px; margin: 0 0 6px; min-width: 0;
  }
  .fline > * { flex: 0 0 auto; }
  .fgroup { display: inline-flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 1px solid var(--line); }
  .fline > .fgroup:first-child, .fline > .chip-clear + .fgroup { border-left: 0; padding-left: 0; }
  .fg-label {
    font-family: var(--sans); font-size: 10px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim); margin-right: 2px;
  }
  .fline .chip { min-height: 30px; padding: 3px 10px; font-size: var(--fs-xs); }
  .fline .tb-sort { min-height: 30px; }
  .pm-filters { display: block; padding: 0; }
  .legend .fline { margin-bottom: 4px; }

  /* Open: the toolbar replaces the old legend block; machine pills are small "● M3" chips. */
  .legend { padding: 0; gap: 0; display: block; }
  .legend .mchip i { width: 9px; height: 9px; }
  .jump-today { margin-left: 0; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; }
  .today-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--today); display: inline-block; }
  .open-totals { margin: 0 0 8px; }
  main > .grand.open-totals { margin-top: 0; }

  /* Folded months in the timeline: one column per month. */
  .dmon-btn {
    background: none; border: 0; padding: 0; font: inherit; color: var(--primary); cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 2px; display: block; margin: 0 auto;
  }
  .date-th.is-month, .date-td.is-month { width: 64px; min-width: 64px; }
  .date-th.is-month { vertical-align: middle; }
  .month-fill { display: flex; align-items: center; gap: 3px; padding: 0 4px; color: #fff; font-size: 10px; font-weight: 700; white-space: nowrap; }
  .month-fill .mnum { position: static; }

  /* Tables: less padding everywhere. */
  th, td { padding: 4px 8px; }
  th { padding-top: 6px; padding-bottom: 6px; }
  .group-row td { padding: 6px 10px; font-size: var(--fs-md); }
  .date-th { height: 34px; padding: 3px 0; }
  .date-td { padding: 2px 0; }
  .date-fill { min-height: 22px; }
  .list-table th, .list-table td { padding: 5px 8px; }
  .done-scroll { margin-bottom: 8px; }

  /* Completed/Summary/Open figures strip, slimmer still. */
  .grand.kpi div { padding: 6px 12px; }
  .grand.kpi b { font-size: var(--fs-lg); }
  .grand.kpi span { font-size: 10px; }
  .kpi { margin: 0 0 6px; }
  .kpi-note { margin: 0 4px 8px; }
  /* Wider than a phone: label, figure and note on one line per cell. */
  @media (min-width: 621px) {
    .grand.kpi div { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; padding: 5px 12px; }
    .grand.kpi b { display: inline; }
    .grand.kpi small { display: inline; margin: 0; }
  }

  /* Summary month strip: twelve slim chips side by side. */
  .trend { grid-template-columns: repeat(12, minmax(100px, 1fr)); gap: 4px; margin: 0 0 8px; scrollbar-width: thin; }
  .trend-m { white-space: nowrap; flex-wrap: nowrap !important; }
  .trend-m {
    position: relative; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: baseline;
    gap: 2px 5px; padding: 5px 4px 7px; overflow: hidden;
  }
  .trend-m b { font-size: var(--fs-xs); }
  .trend-m em { font-style: normal; font-weight: 700; font-family: var(--sans); }
  .trend-m .trend-line { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--primary); opacity: .55; }
  .trend-m.is-on .trend-line { opacity: 1; }

  /* Tablet rows: the pinned column header already names every figure, so the per-row labels
     go, and rows and group headers lose padding. */
  .tcard { padding: 6px 12px; }
  .tcard .val .lbl { display: none; }
  .tcard .code { font-size: var(--fs-sm); }
  .tcard-group { padding: 6px 12px; font-size: var(--fs-md); }
  .tcard-sub { padding: 5px 12px; }
  .prop-bar { height: 16px; }
  .prop-bar .fill { border-radius: 8px; }
  /* Phone cards: tighter rows. */
  .card { padding: 8px 10px; }
  .card-top { margin-bottom: 4px; }
  .metric-row { padding: 5px 0; margin-bottom: 4px; }
  .card-sub { padding: 7px 10px; }

  /* Filter chip rows (Products look, every tab): small chips. */
  .pm-filters { gap: 4px; padding-top: 4px; }
  .pm-filters .chip { min-height: 28px; padding: 2px 10px; font-size: var(--fs-xs); }
  .pm-label { flex-basis: 72px; font-size: var(--fs-2xs); }
  .list-head { padding: 4px 4px; }

  @media (max-width: 620px) {
    /* Phone header: logo · language · time · download · counter on ONE row, then search,
       then the four modes on one row, then the tabs. */
    header { padding: 6px 8px; gap: 6px; }
    .clock { order: 0; padding: 2px 4px; min-height: 32px; }
    .lang-toggle, .counter-link, header .counter-link { min-height: 36px; }
    .search-box { min-height: 38px; }
    .filter-wrap::before, .filter-wrap .clear-x { top: 19px; }
    .modes { flex-wrap: nowrap; }
    .mode { flex: 1 1 0; min-height: 36px; padding: 4px 2px; font-size: var(--fs-xs); line-height: 1.15; }
    .mode:nth-child(n+3) { border-top: none; }
    .mode:nth-child(3) { border-left: 1px solid var(--primary); }
    .tab { min-height: 36px; padding: 6px 12px; font-size: var(--fs-sm); }
    main { padding: 6px; }
    .toolbar .chip, .toolbar .jump-today, .tb-sort, .toolbar .sum-scope .mode { min-height: 36px; }
    .tb-scroll, .fline { scrollbar-width: none; }
    .tb-scroll::-webkit-scrollbar, .fline::-webkit-scrollbar { display: none; }
    .fline .chip { min-height: 34px; }
    header .fold-btn { width: 36px; height: 36px; padding: 0; margin-left: 0; }
    header .fold-btn .fold-lbl { display: none; }
    .tb-sort select { max-width: 150px; }
    .pm-filters .chip { min-height: 34px; }
    .trend { grid-template-columns: repeat(12, 100px); scrollbar-width: none; }
    .grand.kpi.open-totals { grid-template-columns: repeat(4, 1fr); }
    .grand.kpi.open-totals:has(> div:nth-child(5)) { grid-template-columns: repeat(3, 1fr); }
  }
