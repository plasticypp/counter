  if (VIEW === 'dsummary') { renderSummary(mainEl); return; }
  var lines = completedLines();
  if (!lines.length) {
    mainEl.innerHTML = listControls() + (PICKED.length
      ? '<div class="empty">No supplied lines for ' + esc(PICKED.join(', ')) + ' match these filters.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear products</button></div>'
      : FILTER
      ? '<div class="empty">No supplied lines match “' + esc(FILTER) + '”.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear filter</button></div>'
      : '<div class="empty">No supplied lines match these filters.</div>');
    var ec = document.getElementById('emptyClear');
    if (ec) ec.addEventListener('click', clearFilter);
    bindListControls(mainEl);
    return;
  }

  var s = scoreLines(lines);
  var onPlanN = lines.filter(function (l) { return l.onPlan; }).length;
  var unjudged = s.lines - s.judged - onPlanN;
  var cols = completedColumns();
  var g = completedGroups(lines);
  GROUP_KEYS = g.order.slice();
  var html = listControls(true) + '<div class="grand kpi">' +
    '<div><span>Supplied lines</span><b>' + fmtNum(s.lines) + '</b></div>' +
    '<div><span>OTD</span><b class="' + pctTone(s.otd, s.judged) + '">' + pct(s.otd, s.judged) + '</b></div>' +
    '<div><span>OTIF</span><b class="' + pctTone(s.otif, s.judged) + '">' + pct(s.otif, s.judged) + '</b></div>' +
    '<div><span>In full</span><b class="' + pctTone(s.inFull, s.judged) + '">' + pct(s.inFull, s.judged) + '</b></div>' +
    '</div>';
  html += '<details class="kpi-note"><summary>ⓘ How lines are judged</summary>Due = PO date + <b>' + esc(COMPLETED.leadDays) + ' days</b> · ' +
    'Delivered = last invoice date · In full = supplied ≥ <b>' + esc(100 - COMPLETED.tolerancePct) + '%</b> of order qty · ' +
    'OTD/OTIF judged on <b>' + s.judged + '</b> of ' + s.lines + ' lines' +
    (onPlanN ? ' · <b>' + onPlanN + '</b> still on plan, judged once taken off it' : '') +
    (unjudged > 0 ? ' (' + unjudged + ' have no invoice, invoice date or order qty)' : '') +
    ' · change these on the sheet’s Settings tab.</details>';

  html += '<div class="done-scroll"><table><thead><tr>' +
    cols.map(function (c) { return '<th scope="col"' + (c.cls === 'txt' || c.cls === 'invs' ? ' class="' + c.cls + '"' : '') + '>' + esc(c.th) + '</th>'; }).join('') +
    '</tr></thead><tbody>';
  g.order.forEach(function (k, gi) {
    var grp = g.groups[k];
    var fc = foldCls(k);
    html += '<tr class="group-row" data-gh="' + gi + '"><td colspan="' + cols.length + '"><span>' + groupToggle(gi, grp.label) + '</span>' +
      groupSummary(grp.rows) + '</td></tr>';
    grp.rows.forEach(function (r) {
      html += '<tr data-gm="' + gi + '"' + (fc ? ' class="' + fc.trim() + '"' : '') + '>' + cols.map(function (c) {
        return '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.td(r) + '</td>';
      }).join('') + '</tr>';
    });
  });
  html += '</tbody></table></div>';

  mainEl.innerHTML = html;
  bindListControls(mainEl);
  bindGroupControls(mainEl);
  var firstTh = mainEl.querySelector('.done-scroll thead th:first-child');
  if (firstTh) document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
}

/* ---------------------------------------------------------------------------
   Test Reports and Products — read-only lists beside Open and Completed.

   Both obey the search box (typed words or picked products). A product that still has open
   lines links to By Product, like the Open tabs; one with nothing open is not a link, because
   By Product would have nothing to show for it.
   --------------------------------------------------------------------------- */
var PRODUCT_INDEX = { src: null, byCode: {} };
function productByCode(code) {
  if (PRODUCT_INDEX.src !== PRODUCTS) {
    PRODUCT_INDEX = { src: PRODUCTS, byCode: {} };
    PRODUCTS.forEach(function (p) { PRODUCT_INDEX.byCode[p.code] = p; });
  }
  return PRODUCT_INDEX.byCode[code] || null;
}
function openQtyByCode() {
  var q = {};
  ROWS.concat(UNPLANNED).forEach(function (r) {
    var b = Number(r.balance);
    if (b > 0) q[r.code] = (q[r.code] || 0) + b;
  });
  return q;
}
// Every typed word must appear in one of the fields; picked products narrow to those codes.
function listMatches(code, fields) {
  if (!passesPicked(code)) return false;
  if (!FILTER) return true;
  var hay = fields.join(' ').toLowerCase();
  return FILTER.toLowerCase().split(/\s+/).filter(Boolean).every(function (w) { return hay.indexOf(w) !== -1; });
}
function listEmpty(mainEl, what) {
  var html = '<div class="empty">' + (PICKED.length || FILTER
    ? 'No ' + what + ' match this search. <button type="button" class="linkish" id="emptyClear">Clear filter</button>'
    : 'No ' + what + ' yet.') + '</div>';
  mainEl.innerHTML = html;
  var ec = document.getElementById('emptyClear');
  if (ec) ec.addEventListener('click', clearFilter);
}
function fmtFullDate(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return esc(iso || '—');
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function listCodeCell(code, color, open) {
  return codeChipHtml(code, color, 'code-chip', open[code] > 0 && code);
}

function renderTestReports() {
  var mainEl = document.getElementById('main');
  mainEl.setAttribute('aria-busy', 'false');
  var open = openQtyByCode();
  var list = TEST_REPORTS.filter(function (t) {
    return listMatches(t.code, [t.no, t.invoice, t.po, t.code, t.item]);
  });
  if (!list.length) { listEmpty(mainEl, 'test reports'); return; }

  var invoices = {};
  list.forEach(function (t) { invoices[t.invoice] = 1; });
  var html = '<div class="list-head"><b>' + fmtNum(list.length) + '</b><span>reports</span>' +
    '<b>' + fmtNum(Object.keys(invoices).length) + '</b><span>invoices</span>' +
    '<span>Newest first · each PDF opens in a new tab</span></div>';
  html += '<div class="done-scroll"><table class="list-table"><thead><tr>' +
    '<th scope="col" class="txt">Report No</th><th scope="col" class="txt">Date</th>' +
    '<th scope="col" class="txt">Invoice</th><th scope="col" class="txt">PO</th>' +
    '<th scope="col" class="txt">Code</th><th scope="col" class="txt">Item</th>' +
    '<th scope="col">Qty</th><th scope="col">Report</th></tr></thead><tbody>';
  list.forEach(function (t) {
    var color = (productByCode(t.code) || {}).color;
    var link = open[t.code] > 0 ? gotoAttrs(t.code) : '';
    var pdf = t.url
      ? '<a class="pdf-link" href="' + esc(t.url) + '" target="_blank" rel="noopener">PDF ↗</a>'
      : t.failed ? '<span class="pdf-missing">Failed</span>' : '<span class="faint">—</span>';
    // data-l labels each cell when a phone shows the row as a card (see .list-table CSS).
    html += '<tr><td class="txt mono" data-l="Report No">' + esc(t.no) + '</td>' +
      '<td class="txt" data-l="Date">' + fmtFullDate(t.date) + '</td>' +
      '<td class="txt mono" data-l="Invoice">' + esc(t.invoice) + '</td>' +
      '<td class="txt mono" data-l="PO" title="' + esc(t.po) + '">' + esc(String(t.po).split('/').pop()) + '</td>' +
      '<td class="txt code-cell">' + listCodeCell(t.code, color, open) + '</td>' +
      '<td class="txt name"><span' + link + '>' + esc(t.item) + '</span></td>' +
      '<td data-l="Qty">' + fmtNum(t.qty) + '</td><td class="pdf-cell">' + pdf + '</td></tr>';
  });
  mainEl.innerHTML = html + '</tbody></table></div>';
}

/* Products tab filters. Kept for the session (not stored): the list is short and a stale
   filter left on a shared wall tablet would hide products from the next person. */
var PM_FILTER_DEFAULT = { shape: [], size: [], color: [], machine: [], orders: [] };
var PM_FILTER = Object.assign({}, PM_FILTER_DEFAULT);

function suppliedCodes() {
  var s = {};
  if (COMPLETED) COMPLETED.lines.forEach(function (l) { s[l.code] = 1; });
  return s;
}
// 'open' (has a balance on the plan), 'done' (only supplied lines) or 'none' (never ordered).
function orderState(code, open, supplied) {
  return open[code] > 0 ? 'open' : supplied[code] ? 'done' : 'none';
}
/* Filters: two always-open lines of labelled multi-select chip groups (see chipGroup) — tap
   to add a value, tap again to drop it. Each line swipes sideways when wider than the screen. */
function productFilterBar(all) {
  var any = selCount(PM_FILTER, Object.keys(PM_FILTER)) > 0;
  var opt = function (k) { return uniqueSorted(all.map(function (p) { return p[k]; }).map(String)); };
  var ORDERS = { open: 'Open orders', done: 'Supplied only', none: 'Never ordered' };
  return '<div class="pm-filters">' +
    filterLine((any ? chip('id="pmReset"', '<span aria-hidden="true">✕</span> Clear', false, 'chip-clear') : '') +
      chipGroup(PM_FILTER, 'orders', 'Orders', ['open', 'done', 'none'], function (v) { return esc(ORDERS[v]); }) +
      chipGroup(PM_FILTER, 'machine', 'Machine', opt('machine')) +
      chipGroup(PM_FILTER, 'size', 'Pack size (L)', opt('size'), sizeChipText)) +
    filterLine(chipGroup(PM_FILTER, 'shape', 'Shape', opt('shape')) +
      chipGroup(PM_FILTER, 'color', 'Colour', opt('color'), colourSwatch)) +
    '</div>';
}
// Shape → Output / day are folded away by default; only Code, Product and Open qty show.
var PM_DETAILS = false;
function passesProductFilter(p, open, supplied) {
  return ['shape', 'size', 'color', 'machine'].every(function (k) {
    return inSel(PM_FILTER[k], p[k]);
  }) && inSel(PM_FILTER.orders, orderState(p.code, open, supplied));
}
function bindProductFilters(mainEl) {
  bindChips(mainEl, PM_FILTER, 'data-pm');
  var rs = document.getElementById('pmReset');
  if (rs) rs.addEventListener('click', function () { PM_FILTER = Object.assign({}, PM_FILTER_DEFAULT); render(); });
  var dt = document.getElementById('pmDetails');
  if (dt) dt.addEventListener('click', function () { PM_DETAILS = !PM_DETAILS; render(); });
}

function renderProductMaster() {
  var mainEl = document.getElementById('main');
  mainEl.setAttribute('aria-busy', 'false');
  var open = openQtyByCode();
  var supplied = suppliedCodes();
  var searched = PRODUCTS.filter(function (p) {
    return listMatches(p.code, [p.code, p.name, p.shape, p.size, p.color]);
  });
  var list = searched.filter(function (p) { return passesProductFilter(p, open, supplied); })
    .sort(function (a, b) { return String(a.code).localeCompare(String(b.code)); });
  var bar = productFilterBar(PRODUCTS);
  if (!list.length) {
    listEmpty(mainEl, 'products');
    mainEl.insertAdjacentHTML('afterbegin', bar);
    bindProductFilters(mainEl);
    return;
  }

  var withOpen = list.filter(function (p) { return open[p.code] > 0; }).length;
  var html = bar + '<div class="list-head"><b>' + fmtNum(list.length) + '</b><span>products</span>' +
    '<b>' + fmtNum(withOpen) + '</b><span>with open orders</span>' +
    '<span class="lh-hint">From the Masters sheet · tap a product to see its POs</span>' +
    chip('id="pmDetails" aria-controls="pmTable"', PM_DETAILS ? '▾ Hide details' : '▸ Show details', PM_DETAILS) + '</div>';
  html += '<div class="done-scroll"><table id="pmTable" class="list-table pm-table' + (PM_DETAILS ? '' : ' is-compact') + '"><thead><tr>' +
    '<th scope="col" class="txt">Code</th><th scope="col" class="txt">Product</th>' +
    '<th scope="col" class="txt">Shape</th><th scope="col" class="txt">Pack size</th>' +
    '<th scope="col">Weight (g)</th><th scope="col" class="txt">Colour</th>' +
    '<th scope="col">Machine</th><th scope="col">Masterbatch</th>' +
    '<th scope="col">Output / hr</th><th scope="col">Output / day</th>' +
    '<th scope="col">Open qty</th></tr></thead><tbody>';
  list.forEach(function (p) {
    // The whole row is the link. Open orders → Open › By Product; only supplied lines →
    // Completed › By Product; never ordered → nothing to show, so not a link.
    var state = orderState(p.code, open, supplied);
    var link = state === 'none' ? '' : ' data-goto="' + esc(p.code) + '" role="link" tabindex="0" title="' +
      esc((state === 'open' ? 'Show all POs of ' : 'Show supplied POs of ') + p.code) + '"';
    var mb = Number(p.mb);
    var mbTxt = p.mb === '' || p.mb == null ? '—' : (isFinite(mb) && mb < 1 ? +(mb * 100).toFixed(2) + '%' : esc(p.mb));
    var openCell = state === 'open' ? '<b>' + fmtNum(open[p.code]) + '</b>'
      : state === 'done' ? '<span class="st st-na">Completed</span>' : '<span class="faint">—</span>';
    html += '<tr' + link + '><td class="txt code-cell">' + codeChipHtml(p.code, p.color, 'code-chip') + '</td>' +
      '<td class="txt name"><span>' + esc(p.name) + '</span></td>' +
      '<td class="txt" data-l="Shape">' + esc(p.shape) + '</td><td class="txt" data-l="Pack size">' + esc(p.size) + '</td>' +
      '<td data-l="Weight (g)">' + (p.weight === '' ? '—' : esc(p.weight)) + '</td>' +
      '<td class="txt" data-l="Colour">' + esc(p.color) + '</td>' +
      '<td data-l="Machine">' + (p.machine === '' ? '—' : esc(p.machine)) + '</td><td data-l="Masterbatch">' + mbTxt + '</td>' +
      '<td data-l="Output / hr">' + (p.perHour === '' ? '—' : fmtNum(p.perHour)) + '</td><td data-l="Output / day">' + (p.perDay === '' ? '—' : fmtNum(p.perDay)) + '</td>' +
      '<td class="qty-cell" data-l="Open qty">' + openCell + '</td></tr>';
  });
  mainEl.innerHTML = html + '</tbody></table></div>';
  bindProductFilters(mainEl);
}

/* ---------------------------------------------------------------------------
   Summary tab — what was dispatched in a month or a year, per product.

   Quantities and value come from SHIPMENTS (every invoice on every line, open lines
   included), so a month's figure is what actually left the plant that month and agrees with
   the invoices. OTIF/OTD come from completed LINES whose last invoice fell in the period.
   Value = qty x PO rate, ex-GST. Every filter applies to the KPIs, the trend and the table
   alike, so the figures on screen always describe the same slice.
   --------------------------------------------------------------------------- */
var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SUM_DEFAULT = { year: 0, month: -1, po: '', brand: [], type: [], color: [], machine: [], status: [], sort: 'qty', _panel: '' };
var SUM = Object.assign({}, SUM_DEFAULT);
var SUM_SORTS = { qty: 'Quantity', value: 'Value', invoices: 'Invoices', otif: 'OTIF %', code: 'Code' };
var SUM_STATUSES = ['OTIF', 'Late', 'Short', 'Late + Short', 'Open line'];

function productType(code) {
  if (/^PMCAP/i.test(code)) return 'Cap';
  if (/^PMCON/i.test(code)) return 'Bottle';
  return 'Other';
}
function statusWord(l) {
  if (l.status !== 'ok') return l.status;
  if (l.otd && l.inFull) return 'OTIF';
  if (!l.otd && !l.inFull) return 'Late + Short';
  return l.otd ? 'Short' : 'Late';
}
function fmtLakh(v) {
  return Math.abs(v) >= 100000 ? (v / 100000).toFixed(1) + ' L' : fmtNum(v);
}

// A shipment or a line passes the tab's filters. Both carry po/brand/code/color/name.
function passesSum(x, status, invNos) {
  if (SUM.po && x.po !== SUM.po) return false;
  if (!inSel(SUM.brand, x.brand)) return false;
  if (!inSel(SUM.type, productType(x.code))) return false;
  if (!inSel(SUM.color, x.color)) return false;
  if (!inSel(SUM.machine, x.usualMachine)) return false;
  if (!inSel(SUM.status, status)) return false;
  if (!passesPicked(x.code)) return false;
  if (!FILTER) return true;
  var q = FILTER.toLowerCase();
  return [x.code, x.name, x.po].concat(invNos).some(function (v) { return String(v).toLowerCase().indexOf(q) !== -1; });
}

// Period test on a 'yyyy-MM-dd' day. month -1 = whole year.
// maxDay caps the day of month, so a month still in progress can be compared with the same
// days of the month before rather than with the whole of it.
function inPeriod(day, year, month, maxDay) {
  if (!day) return false;
  if (Number(day.slice(0, 4)) !== year) return false;
  if (maxDay && Number(day.slice(8, 10)) > maxDay) return false;
  return month === -1 || Number(day.slice(5, 7)) - 1 === month;
}
function prevPeriod(year, month) {
  if (month === -1) return { year: year - 1, month: -1 };
  return month === 0 ? { year: year - 1, month: 11 } : { year: year, month: month - 1 };
}

function summaryData() {
  var lines = judgedLines();
  var lineById = {};
  lines.forEach(function (l) { lineById[l.id] = l; });
  var ships = COMPLETED.shipments.filter(function (s) {
    var status = s.done ? (lineById[s.line] ? statusWord(lineById[s.line]) : '') : 'Open line';
    return passesSum(s, status, [s.inv]);
  });
  var doneLines = lines.filter(function (l) {
    return passesSum(l, statusWord(l), l.invoices.map(function (i) { return i.no; }));
  });
  return { ships: ships, lines: doneLines };
}

function periodTotals(d, year, month, maxDay) {
  var ships = d.ships.filter(function (s) { return inPeriod(s.date, year, month, maxDay); });
  var lines = d.lines.filter(function (l) { return l.status === 'ok' && inPeriod(l.delivered, year, month, maxDay); });
  var t = { qty: 0, value: 0, invoices: {}, products: {}, pos: {}, ships: ships, lines: lines };
  ships.forEach(function (s) {
    t.qty += s.qty; t.value += s.qty * s.rate;
    t.invoices[s.inv] = 1; t.products[s.code] = 1; t.pos[s.po] = 1;
  });
  t.otd = lines.filter(function (l) { return l.otd; }).length;
  t.otif = lines.filter(function (l) { return l.otif; }).length;
  t.avgLate = lines.length ? lines.reduce(function (a, l) { return a + l.late; }, 0) / lines.length : null;
  return t;
}

// Against the previous period, stated as a positive figure: "112% of previous month",
// "57% of same days last month". Green when it matches or beats it, plain otherwise.
function deltaHtml(now, before, against) {
  if (!before) return '<small class="is-na">first period on record</small>';
  var p = Math.round((now / before) * 100);
  // On a phone only "▲ 117%" shows; the comparison is in the tooltip.
  return '<small class="' + (p >= 100 ? 'late-good' : 'is-na') + '" title="' + p + '% of ' + esc(against) + '">' +
    (p > 100 ? '▲ ' : '') + p + '%<span class="delta-of"> of ' + esc(against) + '</span></small>';
}

// One dropdown in a filter bar. `state` is the object it edits (SUM for Summary, LIST for the
// line views) and `attr` the data attribute its change handler looks for.
function sumSelect(key, label, options, allLabel, state, attr) {
  state = state || SUM;
  var html = '<label class="sum-field"><span>' + esc(label) + '</span><select ' + (attr || 'data-sum') + '="' + key + '">';
  if (allLabel) html += '<option value="">' + esc(allLabel) + '</option>';
  options.forEach(function (o) {
    var v = typeof o === 'object' ? o.value : o, t = typeof o === 'object' ? o.text : o;
    html += '<option value="' + esc(v) + '"' + (String(state[key]) === String(v) ? ' selected' : '') +
      (o.disabled ? ' disabled' : '') + '>' + esc(t) + '</option>';
  });
  return html + '</select></label>';
}

function uniqueSorted(list) {
  return Array.from(new Set(list.filter(function (v) { return v !== '' && v != null; })))
    .sort(function (a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); });
}

// Month | Year switch and a ‹ period › stepper, then the same chips as the line tabs.
function summaryControls(all, soFar) {
  var isYear = SUM.month === -1;
  var label = isYear ? String(SUM.year) : MONTH_NAMES[SUM.month] + ' ' + SUM.year;
  var more = selCount(SUM, LIST_MORE) + (SUM.po ? 1 : 0) + (SUM.sort !== 'qty' ? 1 : 0);
  var any = SUM.status.length || more;
  var html = toolbarHtml(
    '<div class="modes sum-scope" role="group" aria-label="Summary period">' +
      '<button type="button" class="mode' + (isYear ? '' : ' active') + '" data-scope="month" aria-pressed="' + !isYear + '">Month</button>' +
      '<button type="button" class="mode' + (isYear ? ' active' : '') + '" data-scope="year" aria-pressed="' + isYear + '">Year</button>' +
    '</div>' +
    '<div class="stepper" role="group" aria-label="Period">' +
      '<button type="button" class="chip" data-step="-1" aria-label="Previous ' + (isYear ? 'year' : 'month') + '">‹</button>' +
      '<b>' + esc(label) + (soFar ? ' <small title="month to date">· ' + esc(soFar) + '</small>' : '') + '</b>' +
      '<button type="button" class="chip" data-step="1" aria-label="Next ' + (isYear ? 'year' : 'month') + '">›</button>' +
    '</div>' +
    '<span class="chip-sep" aria-hidden="true"></span>' +
    (any ? chip('id="sumReset"', '<span aria-hidden="true">✕</span> Clear', false, 'chip-clear') : '') +
    miniSelect('sort', '⇅', Object.keys(SUM_SORTS).map(function (k) { return { value: k, text: SUM_SORTS[k] }; }), '', SUM, 'data-sum') +
    statusChips(SUM, SUM_STATUSES)) +
    // PO stays a dropdown: there are dozens, too many for chips.
    attrFilterLine(SUM, all,
      miniSelect('po', 'PO', uniqueSorted(all.map(function (s) { return s.po; })), 'All POs', SUM, 'data-sum'));
  return html;
}

function summaryKpis(t, prev, against) {
  var avg = t.avgLate === null ? '—'
    : Math.abs(Math.round(t.avgLate)) + (Math.round(t.avgLate) > 0 ? ' d late' : ' d early');
  return '<div class="grand kpi">' +
    '<div><span>Dispatched</span><b>' + fmtNum(t.qty) + '</b>' + deltaHtml(t.qty, prev.qty, against) + '</div>' +
    '<div><span>Value (ex-GST)</span><b>₹' + fmtLakh(t.value) + '</b>' + deltaHtml(t.value, prev.value, against) + '</div>' +
    '<div><span>Invoices</span><b>' + Object.keys(t.invoices).length + '</b><small class="is-na">' +
      Object.keys(t.pos).length + ' POs</small></div>' +
    '<div><span>Products</span><b>' + Object.keys(t.products).length + '</b></div>' +
    '<div><span>OTIF</span><b class="' + pctTone(t.otif, t.lines.length) + '">' + pct(t.otif, t.lines.length) + '</b>' +
      '<small class="is-na">OTD ' + pct(t.otd, t.lines.length) + ' · ' + t.otif + ' of ' + t.lines.length + ' lines</small></div>' +
    '<div><span>Avg vs due</span><b class="' + (t.avgLate > 0 ? 'st-bad' : 'st-good') + '">' + avg + '</b></div>' +
    '</div>';
}

// One bar per month of the year; the tallest month fills the track. Click to open that month.
function summaryTrend(d, year) {
  var months = MONTH_NAMES.map(function (m, i) { return periodTotals(d, year, i); });
  var max = Math.max.apply(null, months.map(function (t) { return t.qty; }).concat([1]));
  // A slim strip of month chips side by side: name, quantity, OTIF, and a hairline bar along
  // the bottom whose length is the month's share of the busiest month. Was 12 tall tiles.
  var html = '<div class="trend" role="group" aria-label="Months of ' + year + '">';
  months.forEach(function (t, i) {
    var on = SUM.month === i;
    html += '<button type="button" class="trend-m' + (on ? ' is-on' : '') + '" data-month="' + i + '"' +
      (t.qty ? '' : ' disabled') + ' aria-pressed="' + on + '">' +
      '<b>' + MONTH_NAMES[i] + '</b><span>' + (t.qty ? fmtLakh(t.qty) : '—') + '</span>' +
      (t.lines.length ? '<em class="' + pctTone(t.otif, t.lines.length) + '">' + pct(t.otif, t.lines.length) + '</em>' : '') +
      '<i class="trend-line" style="width:' + Math.round((t.qty / max) * 100) + '%"></i>' +
      '</button>';
  });
  return html + '</div>';
}

function summaryRows(t) {
  var byCode = {};
  t.ships.forEach(function (s) {
    var p = byCode[s.code] || (byCode[s.code] = { code: s.code, name: s.name, color: s.color, brand: s.brand,
      qty: 0, value: 0, invoices: {}, months: {}, lines: 0, otif: 0 });
    p.qty += s.qty; p.value += s.qty * s.rate; p.invoices[s.inv] = 1;
    var m = Number(s.date.slice(5, 7)) - 1;
    p.months[m] = (p.months[m] || 0) + s.qty;
  });
  t.lines.forEach(function (l) {
    var p = byCode[l.code];
    if (!p) return;
    p.lines++; if (l.otif) p.otif++;
  });
  var rows = Object.keys(byCode).map(function (k) { return byCode[k]; });
  var key = SUM.sort;
  rows.sort(function (a, b) {
    if (key === 'code') return String(a.code).localeCompare(String(b.code), 'en', { numeric: true });
    if (key === 'invoices') return Object.keys(b.invoices).length - Object.keys(a.invoices).length;
    if (key === 'otif') return (b.lines ? b.otif / b.lines : -1) - (a.lines ? a.otif / a.lines : -1);
    return b[key] - a[key];
  });
  return rows;
}

function summaryTable(t, isYear) {
  var rows = summaryRows(t);
  if (!rows.length) return '<div class="empty">Nothing dispatched in this period with these filters.</div>';
  var monthCols = isYear
    ? MONTH_NAMES.map(function (m, i) { return i; }).filter(function (i) { return rows.some(function (r) { return r.months[i]; }); })
    : [];
  var html = '<div class="done-scroll"><table><thead><tr>' +
    '<th scope="col">Code</th><th scope="col">Item</th><th scope="col" class="txt">Brand</th>' +
    monthCols.map(function (i) { return '<th scope="col">' + MONTH_NAMES[i] + '</th>'; }).join('') +
    '<th scope="col">Dispatched</th><th scope="col">Value</th><th scope="col" class="txt">Share</th>' +
    '<th scope="col">Invoices</th><th scope="col">OTIF</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var share = t.qty ? (r.qty / t.qty) * 100 : 0;
    html += '<tr><td class="data-col">' + codeChipHtml(r.code, r.color, 'code-chip') + '</td>' +
      '<td class="data-col">' + esc(r.name) + '</td><td class="txt">' + esc(r.brand || '—') + '</td>' +
      monthCols.map(function (i) { return '<td>' + (r.months[i] ? fmtNum(r.months[i]) : '<span class="is-na">—</span>') + '</td>'; }).join('') +
      '<td><b>' + fmtNum(r.qty) + '</b></td><td>₹' + fmtLakh(r.value) + '</td>' +
      '<td class="txt"><span class="share"><i style="width:' + Math.max(1, Math.round(share)) + '%"></i></span>' +
        Math.round(share) + '%</td>' +
      '<td>' + Object.keys(r.invoices).length + '</td>' +
      '<td>' + (r.lines ? '<span class="st ' + pctTone(r.otif, r.lines) + '">' + pct(r.otif, r.lines) + '</span>' : '<span class="is-na">—</span>') + '</td></tr>';
  });
  var monthTotals = monthCols.map(function (i) {
    return '<td>' + fmtNum(rows.reduce(function (a, r) { return a + (r.months[i] || 0); }, 0)) + '</td>';
  }).join('');
  html += '<tr class="subtotal-row"><td colspan="3">Total · ' + rows.length + ' products</td>' + monthTotals +
    '<td>' + fmtNum(t.qty) + '</td><td>₹' + fmtLakh(t.value) + '</td><td class="txt">100%</td>' +
    '<td>' + Object.keys(t.invoices).length + '</td><td>' + pct(t.otif, t.lines.length) + '</td></tr>';
  return html + '</tbody></table></div>';
}

// First visit: the current month if anything shipped in it, else the latest month that did.
function defaultPeriod(all) {
  var days = all.map(function (s) { return s.date; }).filter(Boolean).sort();
  if (!days.length) return;
  var nowIst = new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 7);
  var pick = days.some(function (d) { return d.slice(0, 7) === nowIst; }) ? nowIst : days[days.length - 1].slice(0, 7);
  SUM.year = Number(pick.slice(0, 4));
  SUM.month = Number(pick.slice(5, 7)) - 1;
}

function renderSummary(mainEl) {
  var all = COMPLETED.shipments || [];
  if (!all.length) {
    mainEl.innerHTML = '<div class="empty">No dispatches recorded yet.</div>';
    return;
  }
  if (!SUM.year) defaultPeriod(all);
  var d = summaryData();
  var isYear = SUM.month === -1;
  var monthsWithData = {};
  all.forEach(function (s) { if (s.date && Number(s.date.slice(0, 4)) === SUM.year) monthsWithData[Number(s.date.slice(5, 7)) - 1] = 1; });
  var t = periodTotals(d, SUM.year, SUM.month);
  var p = prevPeriod(SUM.year, SUM.month);
  // The current month is still running: compare it with the same days of last month.
  var nowIst = new Date(Date.now() + 5.5 * 3600 * 1000);
  var running = !isYear && SUM.year === nowIst.getUTCFullYear() && SUM.month === nowIst.getUTCMonth();
  var prev = periodTotals(d, p.year, p.month, running ? nowIst.getUTCDate() : 0);
  var against = running ? 'same days last month' : (isYear ? 'previous year' : 'previous month');
  var title = (isYear ? 'Year ' : MONTH_NAMES[SUM.month] + ' ') + SUM.year +
    (running ? ' · month to date (1–' + nowIst.getUTCDate() + ')' : '');

  // The period sits in the stepper ("Nov 2026 · 1–17"); the full title stays for screen
  // readers and the export file name. Month strip first: it is how a period is picked.
  mainEl.innerHTML = summaryControls(all, running ? '1–' + nowIst.getUTCDate() : '') +
    '<h2 class="sum-title sr-only">' + esc(title) + '</h2>' +
    summaryTrend(d, SUM.year) +
    summaryKpis(t, prev, against) +
    summaryTable(t, isYear);

  bindChips(mainEl, SUM, 'data-sum');
  // On a phone the month strip scrolls; bring the picked (or latest) month into view.
  var trendBox = mainEl.querySelector('.trend');
  var onM = mainEl.querySelector('.trend-m.is-on') || [].slice.call(mainEl.querySelectorAll('.trend-m:not([disabled])')).pop();
  if (trendBox && onM && trendBox.scrollWidth > trendBox.clientWidth) {
    var x = onM.getBoundingClientRect().left - trendBox.getBoundingClientRect().left + trendBox.scrollLeft;
    trendBox.scrollLeft = Math.max(0, x - trendBox.clientWidth + onM.offsetWidth + 8);
  }
  mainEl.querySelectorAll('[data-step]').forEach(function (b) {
    b.addEventListener('click', function () {
      var step = Number(b.dataset.step);
      if (SUM.month === -1) { SUM.year += step; render(); return; }
      var m = SUM.month + step;
      SUM.year += Math.floor(m / 12);
      SUM.month = ((m % 12) + 12) % 12;
      render();
    });
  });
  mainEl.querySelectorAll('[data-scope]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.scope === 'year') { SUM.month = -1; render(); return; }
      if (SUM.month !== -1) return;
      // Month view opens on the latest month of the chosen year that has dispatches.
      var months = Object.keys(monthsWithData).map(Number);
      SUM.month = months.length ? Math.max.apply(null, months) : 0;
      render();
    });
  });
  mainEl.querySelectorAll('.trend-m').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = Number(b.dataset.month);
      SUM.month = SUM.month === m ? -1 : m;   // clicking the open month goes back to the year
      render();
    });
  });
  var sr = document.getElementById('sumReset');
  if (sr) sr.addEventListener('click', function () {
    // Clear the filters, keep the period the reader is looking at.
    SUM = Object.assign({}, SUM_DEFAULT, { year: SUM.year, month: SUM.month });
    render();
  });
  var firstTh = mainEl.querySelector('.done-scroll thead th:first-child');
  if (firstTh) document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
}

/* ---------------------------------------------------------------------------
   Download the current Completed tab as Excel or PDF.

   Read from the rendered table rather than rebuilt from data, so the file always matches the
   screen: same filters, same rows, same totals. Libraries load on first use only.
   --------------------------------------------------------------------------- */
var EXPORT_LIBS = {
  xlsx: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'],
  pdf: ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'],
};
var loadedScripts = {};
function loadScript(url) {
  if (!loadedScripts[url]) {
    loadedScripts[url] = new Promise(function (resolve, reject) {
      var el = document.createElement('script');
      el.src = url; el.onload = resolve;
      el.onerror = function () { delete loadedScripts[url]; reject(new Error('could not load ' + url)); };
      document.head.appendChild(el);
    });
  }
  return loadedScripts[url];
}

var VIEW_NAMES = { dinvoice: 'By Invoice', dpo: 'By PO', dproduct: 'By Product', dsummary: 'Summary',
  po: 'Open By PO', product: 'Open By Product', machine: 'Open By Machine', color: 'Open By Colour' };
var OPEN_GROUP_NAMES = { po: 'PO', product: 'Product', machine: 'Machine', color: 'Colour' };
var GROUP_NAMES = { dinvoice: 'Invoice', dpo: 'PO', dproduct: 'Product' };

function activeFilterText() {
  var parts = [];
  if (PICKED.length) parts.push('Products: ' + PICKED.join(', '));
  if (FILTER) parts.push('Search: ' + FILTER);
  if (MODE === 'open') {
    if (hasMachineSel()) parts.push('Machine: ' + machineSelText());
    OPEN_F_KEYS.forEach(function (k) {
      if (OPEN_F[k].length) parts.push(k.charAt(0).toUpperCase() + k.slice(1) + ': ' + OPEN_F[k].join(', '));
    });
    return parts.length ? 'Filters: ' + parts.join(' · ') : 'Filters: none';
  }
  var state = VIEW === 'dsummary' ? SUM : LIST;
  Object.keys(state).forEach(function (k) {
    var v = state[k];
    if (k === 'year' || k === 'month' || k === 'sort' || k === 'dateBy' || k === 'preset' || k.charAt(0) === '_' || !v || !v.length) return;
    parts.push((k === 'machine' ? 'Usual machine' : k.charAt(0).toUpperCase() + k.slice(1)) + ': ' + (Array.isArray(v) ? v.join(', ') : v));
  });
  if (VIEW !== 'dsummary' && (LIST.from || LIST.to)) parts.push('(dates by ' + (LIST.dateBy === 'po' ? 'PO date' : 'delivery') + ')');
  return parts.length ? 'Filters: ' + parts.join(' · ') : 'Filters: none';
}

// The Open board's table is a day-by-day Gantt; the file gets the schedule as Start / End
// dates instead of 45 day columns.
function openViewForExport() {
  var rows = applyFilter(ROWS);
  var unplanned = applyFilter(UNPLANNED);
  if (!rows.length && !unplanned.length) return null;
  var showRmMb = VIEW === 'color';
  var g = openGroups(rows, unplanned);
  rows = rows.concat(unplanned);   // the grand total below counts both
  var byPo = VIEW === 'po';   // the group column already is the PO
  var d = function (iso) { return iso ? fmtDate(new Date(iso)) : ''; };
  var nums = function (t) {
    return [Math.round(t.orderQty), Math.round(t.supplied), Math.round(t.readyStock), Math.round(t.balance)]
      .concat(showRmMb ? [Math.round(t.rmReq * 100) / 100, Math.round(t.mb * 100) / 100] : []);
  };
  var out = [];
  g.order.forEach(function (k) {
    var grp = g.groups[k];
    grp.rows.forEach(function (r) {
      // The unplanned group is not one PO, so in By PO its rows carry their PO in the group cell.
      var gLabel = (byPo && k === UNPLANNED_KEY) ? grp.label + ' · ' + r.po : grp.label;
      out.push([gLabel, r.code, r.name, r.color].concat(byPo ? [] : [r.po]).concat([r.machine, r.priority]).concat(nums(r))
        .concat([d(r.start), d(r.end), r.days || '']));
    });
    out.push(['', 'Subtotal', '', ''].concat(byPo ? [] : ['']).concat(['', '']).concat(nums(sumRows(grp.rows))).concat(['', '', '']));
  });
  var grand = sumRows(rows);
  out.push(['', 'Total', '', ''].concat(byPo ? [] : ['']).concat(['', '']).concat(nums(grand)).concat(['', '', '']));
  return {
    title: 'YPP Dispatch · Open · ' + VIEW_NAMES[VIEW].replace('Open ', ''),
    filters: activeFilterText(),
    kpis: 'Order Qty: ' + fmtNum(grand.orderQty) + '   Supplied: ' + fmtNum(grand.supplied) +
      '   Ready: ' + fmtNum(grand.readyStock) + '   Balance: ' + fmtNum(grand.balance),
    columns: [OPEN_GROUP_NAMES[VIEW], 'Code', 'Item', 'Colour'].concat(byPo ? [] : ['PO']).concat(['Machine', 'Priority',
      'Order Qty', 'Supplied', 'Ready', 'Balance']).concat(showRmMb ? ['RM Req', 'MB'] : [])
      .concat(['Start', 'End', 'Days']),
    rows: out,
  };
}

function viewForExport() {
  if (MODE === 'open') return openViewForExport();
  var tbl = document.querySelector('#main .done-scroll table');
  if (!tbl) return null;
  var grouped = VIEW !== 'dsummary';
  // textContent, not innerText: headers are upper-cased by CSS, and the file should carry the words.
  var heads = Array.from(tbl.querySelectorAll('thead th')).map(function (th) { return th.textContent.trim(); });
  var rows = [], group = '';
  Array.from(tbl.querySelectorAll('tbody tr')).forEach(function (tr) {
    if (tr.classList.contains('group-row')) { group = tr.querySelector('td > span').innerText.trim(); return; }
    var cells = [];
    Array.from(tr.children).forEach(function (td) {
      cells.push(td.innerText.trim());
      for (var i = 1; i < (td.colSpan || 1); i++) cells.push('');
    });
    rows.push(grouped ? [group].concat(cells) : cells);
  });
  var title = document.querySelector('#main .sum-title');
  return {
    title: 'YPP Dispatch · Completed · ' + VIEW_NAMES[VIEW] + (title ? ' · ' + title.innerText.trim() : ''),
    filters: activeFilterText(),
    kpis: Array.from(document.querySelectorAll('#main .kpi > div')).map(function (d) {
      return d.querySelector('span').textContent.trim() + ': ' + d.querySelector('b').textContent.trim();
    }).join('   '),
    columns: grouped ? [GROUP_NAMES[VIEW]].concat(heads) : heads,
    rows: rows,
  };
}

function exportFileName(ext) {
  var day = new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 10);
  return 'ypp-dispatch-' + VIEW_NAMES[VIEW].toLowerCase().replace(/\s+/g, '-') + '-' + day + '.' + ext;
}

// Excel keeps plain numbers as numbers so they can be summed; everything else stays text.
function xlsxCell(v) {
  var t = String(v).replace(/,/g, '');
  return /^\d+(\.\d+)?$/.test(t) ? Number(t) : v;
}

function exportXlsx(v) {
  var aoa = [[v.title], [v.filters], [v.kpis], []].concat([v.columns])
    .concat(v.rows.map(function (r) { return r.map(xlsxCell); }));
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = v.columns.map(function (c, i) {
    var w = Math.max(c.length, ...v.rows.map(function (r) { return String(r[i] || '').length; }));
    return { wch: Math.min(48, w + 2) };
  });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, VIEW_NAMES[VIEW]);
  XLSX.writeFile(wb, exportFileName('xlsx'));
}

// The PDF's built-in font covers Latin-1 only, so symbols are spelled out or dropped.
function pdfText(t) {
  return String(t).replace(/₹/g, 'Rs ').replace(/≥/g, '>=').replace(/[–—]/g, '-')
    .replace(/[✓✗◷◐▲▼⤓]/g, '').replace(/[^\x00-\xFF]/g, '').replace(/\s+/g, ' ').trim();
}

function exportPdf(v) {
  var doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  doc.setFontSize(13); doc.text(pdfText(v.title), 32, 34);
  doc.setFontSize(8.5); doc.setTextColor(90);
  doc.text(pdfText(v.filters), 32, 50);
  if (v.kpis) doc.text(pdfText(v.kpis), 32, 63);
  doc.autoTable({
    head: [v.columns.map(pdfText)],
    body: v.rows.map(function (r) { return r.map(pdfText); }),
    startY: 74, margin: { left: 32, right: 32 },
    styles: { fontSize: 7, cellPadding: 3, overflow: 'linebreak' },
    headStyles: { fillColor: [30, 64, 175] },
    didParseCell: function (data) {
      if (data.section === 'body' && /^(sub)?total/i.test(String(data.row.raw[VIEW === 'dsummary' ? 0 : 1] || ''))) {
        data.cell.styles.fontStyle = 'bold';
      }
    },
  });
  doc.save(exportFileName('pdf'));
}

function runExport(kind) {
  var v = viewForExport();
  if (!v) { alert('Nothing to download in this view.'); return; }
  // In order, not in parallel: the table plugin attaches itself to jsPDF as it loads, so
  // jsPDF must already be there.
  EXPORT_LIBS[kind].reduce(function (p, url) { return p.then(function () { return loadScript(url); }); }, Promise.resolve())
    .then(function () { kind === 'xlsx' ? exportXlsx(v) : exportPdf(v); })
    .catch(function (err) { alert('Download failed: ' + (err && err.message ? err.message : err)); });
}

(function bindExportMenu() {
  var btn = document.getElementById('exportBtn'), menu = document.getElementById('exportMenu');
  function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    btn.setAttribute('aria-expanded', menu.hidden ? 'false' : 'true');
    if (!menu.hidden) menu.querySelector('button').focus();
  });
  menu.querySelectorAll('[data-export]').forEach(function (b) {
    b.addEventListener('click', function () { close(); runExport(b.dataset.export); });
  });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) { close(); btn.focus(); } });
})();

/* The second frozen column has to start exactly where the first one ends, and the Code
   column's width depends on its content. Measure rather than guess. */
// Re-measured whenever the Code column changes size: right after render the web fonts may not
// have loaded, and the code chips widen when they do (measured 91.5px vs 97px actual).
var frozObserver = typeof ResizeObserver === 'function'
  ? new ResizeObserver(function () { setFrozenOffset(); }) : null;
function setFrozenOffset() {
  var firstTh = document.querySelector('.table-scroll thead th:first-child');
  if (firstTh) {
    document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
  }
  return firstTh;
}
function measureFrozenOffset() {
  var firstTh = setFrozenOffset();
  if (!frozObserver) return;
  frozObserver.disconnect();
  if (firstTh) frozObserver.observe(firstTh);
}

/* Today can sit far off the right edge of a 120-column grid; without this the marker is
   only findable by hunting for it. */
function scrollToToday() {
  var box = document.querySelector('.table-scroll');
  var cell = document.querySelector('.date-th.is-today');
  if (!box || !cell) return;
  // Today already on screen with no scrolling: stay at the left edge. Scrolling anyway slid
  // Qty and Supplied under the frozen Code/Item columns, so they looked missing.
  if (cell.offsetLeft + cell.offsetWidth <= box.clientWidth) { box.scrollLeft = 0; return; }
  var frozen = (document.querySelector('.table-scroll thead th:first-child') || { offsetWidth: 0 }).offsetWidth
    + (document.querySelector('.table-scroll thead th:nth-child(2)') || { offsetWidth: 0 }).offsetWidth;
  box.scrollLeft = Math.max(0, cell.offsetLeft - frozen - 80);
}


function selectTab(view) {
  document.querySelectorAll('.tab').forEach(function (b) {
    var on = b.dataset.view === view;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  VIEW = view;
  VIEW_BY_MODE[MODE] = VIEW;
}
document.querySelectorAll('.tab').forEach(function (btn) {
  btn.addEventListener('click', function () { selectTab(btn.dataset.view); render(); });
});

/* Product clicked in By PO / Machine / Color → By Product, at that product's group: unfolded,
   scrolled into view and briefly highlighted. A line with no machine or priority sits in the
   "Not started · not planned" group there too, so that group is the fallback. */
function gotoProduct(code) {
  if (!(openQtyByCode()[code] > 0) && suppliedCodes()[code]) { gotoSuppliedProduct(code); return; }
  if (MODE !== 'open') setMode('open');
  selectTab('product');
  setFolded(code, false);
  setFolded(UNPLANNED_KEY, false);
  savePrefs();
  render();
  var i = GROUP_KEYS.indexOf(code);
  if (i < 0) i = GROUP_KEYS.indexOf(UNPLANNED_KEY);
  highlightGroup(i);
}
/* A product with nothing open: Completed › By Product at that product. The Completed filters
   (dates, status ...) can hide it, so they are cleared when it is not in the list. */
function gotoSuppliedProduct(code) {
  setMode('done');
  selectTab('dproduct');
  setFolded(code, false);
  savePrefs();
  render();
  if (GROUP_KEYS.indexOf(code) < 0) { LIST = Object.assign({}, LIST_DEFAULT); render(); }
  highlightGroup(GROUP_KEYS.indexOf(code));
}
function highlightGroup(i) {
  if (i < 0) return;
  var head = Array.prototype.find.call(document.querySelectorAll('#main [data-gh="' + i + '"]'),
    function (el) { return el.offsetParent !== null; });   // the layout showing at this width
  if (!head) return;
  document.querySelectorAll('#main [data-gh="' + i + '"], #main [data-gm="' + i + '"]')
    .forEach(function (el) { el.classList.add('is-goto'); });
  head.scrollIntoView({ block: 'center' });
  head.classList.add('goto-flash');
  setTimeout(function () { head.classList.remove('goto-flash'); }, 1400);
}
(function () {
  var mainEl = document.getElementById('main');
  var go = function (e) {
    var t = e.target.closest && e.target.closest('[data-goto]');
    if (!t || !canGoto()) return;
    e.preventDefault();
    gotoProduct(t.getAttribute('data-goto'));
  };
  mainEl.addEventListener('click', go);
  mainEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') go(e); });
})();

// Switches the board (Open / Completed / Test Reports / Products) without rendering.
function setMode(mode) {
  MODE = mode;
  VIEW = VIEW_BY_MODE[MODE];
  document.body.setAttribute('data-mode', MODE);
  document.querySelectorAll('.mode').forEach(function (b) {
    var on = b.dataset.mode === MODE;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.querySelectorAll('.tab').forEach(function (t) {
    var on = t.dataset.view === VIEW;
    t.hidden = t.dataset.mode !== MODE;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
}
document.body.setAttribute('data-mode', MODE);
document.querySelectorAll('.mode').forEach(function (btn) {
  btn.addEventListener('click', function () {
    setMode(btn.dataset.mode);
    render();
  });
});

var filterInput = document.getElementById('filterInput');
var filterWrap = document.querySelector('.filter-wrap');
var filterClear = document.getElementById('filterClear');
var filterList = document.getElementById('filterList');
var pickTags = document.getElementById('pickTags');

/* ---------------------------------------------------------------------------
   Search box: free text, or picked products.

   With no product picked, typing filters the view directly (code, name, PO, invoice).
   Picking products from the dropdown adds them as tags, and the view then shows lines for
   ANY of them; while tags are present the typed text only searches the dropdown, so typing
   a second product's name cannot narrow the view to nothing by accident. PICKED is shared by
   Open and Completed (it is one search box), and the other filters still apply on top.
   --------------------------------------------------------------------------- */
var PICKED = [];                       // product codes, in the order picked
var SUGGEST = { items: [], active: -1 };
var SUGGEST_MAX = 8;
var filterTimer = null;

function isPicked(code) { return PICKED.indexOf(code) !== -1; }
function passesPicked(code) { return !PICKED.length || isPicked(code); }

// The view filter follows the typed text only while nothing is picked.
function syncFilter() {
  FILTER = PICKED.length ? '' : filterInput.value.trim();
  filterWrap.classList.toggle('has-value', !!(PICKED.length || filterInput.value.trim()));
  filterWrap.classList.toggle('has-tags', PICKED.length > 0);
  filterInput.placeholder = PICKED.length ? 'add another product…' : 'filter code, name or PO…';
}

function clearFilter() {
  filterInput.value = '';
  PICKED = [];
  renderTags();
  syncFilter();
  hideSuggest();
  render();
  filterInput.focus();
}

// Debounced: render() rebuilds all three renderings, so an undebounced keystroke handler
// rebuilt the entire board on every character typed.
filterInput.addEventListener('input', function () {
  renderSuggest();
  filterWrap.classList.toggle('has-value', !!(PICKED.length || filterInput.value.trim()));
  if (PICKED.length) return;   // text is only searching the dropdown
  clearTimeout(filterTimer);
  filterTimer = setTimeout(function () { syncFilter(); render(); }, 140);
});
filterClear.addEventListener('click', clearFilter);

// Products the dropdown can offer: the ones the current mode has lines for, so every
// suggestion leads to rows. Names come with the lines (Masters, via the sheet).
function productsForMode() {
  var byCode = {};
  var add = function (code, name, color, qty) {
    var p = byCode[code] || (byCode[code] = { code: code, name: name || code, color: color, lines: 0, qty: 0 });
    p.lines++; p.qty += qty;
  };
  if (MODE === 'done') {
    if (COMPLETED) COMPLETED.lines.forEach(function (l) { add(l.code, l.name, l.color, l.supplied); });
  } else if (MODE === 'products') {
    PRODUCTS.forEach(function (p) { add(p.code, p.name, p.color, 0); });
  } else if (MODE === 'reports') {
    TEST_REPORTS.forEach(function (t) { add(t.code, t.item, (productByCode(t.code) || {}).color, t.qty); });
  } else {
    ROWS.concat(UNPLANNED).forEach(function (r) {
      if (!(Number(r.balance) > 0)) return;     // the Open board only shows lines with a balance
      add(r.code, r.name, r.color, Number(r.balance) || 0);
    });
  }
  return Object.keys(byCode).map(function (k) { return byCode[k]; });
}

// Every typed word must appear in the code or the name, so "grey arzol 3" finds
// "ARZOL 3 LTR GREY BOTTEL". Matches at the start of the code or name rank first.
function matchProducts(q) {
  var words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  var starts = function (p) {
    return (p.code.toLowerCase().indexOf(words[0]) === 0 || String(p.name).toLowerCase().indexOf(words[0]) === 0) ? 0 : 1;
  };
  return productsForMode().filter(function (p) {
    var hay = (p.code + ' ' + p.name).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  }).sort(function (a, b) { return starts(a) - starts(b) || b.qty - a.qty || cmpNat(a.code, b.code); });
}

// Bold the typed words inside a plain string, escaping every piece.
function markWords(text, q) {
  text = String(text);
  var words = q.toLowerCase().split(/\s+/).filter(Boolean);
  var lower = text.toLowerCase(), hit = new Array(lower.length).fill(false);
  words.forEach(function (w) {
    for (var i = lower.indexOf(w); i !== -1; i = lower.indexOf(w, i + 1)) {
      for (var j = i; j < i + w.length; j++) hit[j] = true;
    }
  });
  var out = '', run = '', on = false;
  for (var c = 0; c <= lower.length; c++) {
    if (c === lower.length || hit[c] !== on) {
      out += on ? '<mark>' + esc(run) + '</mark>' : esc(run);
      run = ''; on = hit[c];
    }
    if (c < lower.length) run += text.charAt(c);
  }
  return out;
}

function hideSuggest() {
  filterList.hidden = true;
  filterList.innerHTML = '';
  SUGGEST = { items: [], active: -1 };
  filterInput.setAttribute('aria-expanded', 'false');
  filterInput.removeAttribute('aria-activedescendant');
}

function renderSuggest() {
  var q = filterInput.value.trim();
  if (!q) { hideSuggest(); return; }
  var keepActive = SUGGEST.active;
  var all = matchProducts(q);
  SUGGEST = { items: all.slice(0, SUGGEST_MAX), active: -1 };
  if (!all.length) {
    filterList.innerHTML = '<li class="fl-empty" role="option" aria-disabled="true">No product matches “' + esc(q) + '”</li>';
  } else {
    var unit = MODE === 'done' ? 'line' : 'open line';
    var hint = PICKED.length
      ? PICKED.length + ' picked · tap to add or remove · Esc to close'
      : 'Select one or more products';
    filterList.innerHTML = '<li class="fl-hint" role="presentation">' + esc(hint) + '</li>' + SUGGEST.items.map(function (p, i) {
      var on = isPicked(p.code);
      return '<li role="option" id="fl-' + i + '" data-i="' + i + '" aria-selected="' + on + '"' + (on ? ' class="is-picked"' : '') + '>' +
        '<span class="fl-tick" aria-hidden="true">✓</span>' +
        codeChipHtml(p.code, p.color, 'code-chip') +
        '<span class="fl-name">' + markWords(p.name, q) + '</span>' +
        '<span class="fl-n">' + p.lines + ' ' + unit + (p.lines === 1 ? '' : 's') + '</span></li>';
    }).join('') + (all.length > SUGGEST_MAX
      ? '<li class="fl-empty" role="option" aria-disabled="true">+' + (all.length - SUGGEST_MAX) + ' more — keep typing</li>' : '');
  }
  filterList.hidden = false;
  filterInput.setAttribute('aria-expanded', 'true');
  if (keepActive >= 0 && keepActive < SUGGEST.items.length) setActive(keepActive);
}

function setActive(i) {
  var n = SUGGEST.items.length;
  if (!n) return;
  SUGGEST.active = (i + n) % n;
  filterList.querySelectorAll('li[data-i]').forEach(function (li) {
    var on = Number(li.dataset.i) === SUGGEST.active;
    li.classList.toggle('is-active', on);
    if (on) li.scrollIntoView({ block: 'nearest' });
  });
  filterInput.setAttribute('aria-activedescendant', 'fl-' + SUGGEST.active);
}

// Tags carry the product's own name as a tooltip; the code alone is what fits on a phone.
// A tag picked on one mode may have no lines on the other, so the name is looked up in both.
function productName(code) {
  var all = ROWS.concat(UNPLANNED).concat(COMPLETED ? COMPLETED.lines : []);
  for (var i = 0; i < all.length; i++) if (all[i].code === code) return all[i].name;
  return code;
}
function renderTags() {
  pickTags.innerHTML = PICKED.map(function (code) {
    return '<span class="ptag" title="' + esc(productName(code)) + '">' + esc(code) +
      '<button type="button" class="ptag-x" data-code="' + esc(code) + '" aria-label="Remove ' + esc(code) + '">✕</button></span>';
  }).join('');
}

// Toggle a product in or out of the picked set. The list stays open with its ticks
// updated, so several products can be picked from one search.
// The typed text and the open list are kept after EVERY pick, including the first: closing
// the list on the first pick made it read as a single-select box.
function togglePick(code) {
  if (isPicked(code)) PICKED = PICKED.filter(function (c) { return c !== code; });
  else PICKED = PICKED.concat([code]);
  clearTimeout(filterTimer);
  renderTags();
  syncFilter();
  render();
  renderSuggest();
  filterInput.focus();
}

filterInput.addEventListener('keydown', function (e) {
  if (e.key === 'Backspace' && !filterInput.value && PICKED.length) {
    togglePick(PICKED[PICKED.length - 1]);
    e.preventDefault();
    return;
  }
  if (filterList.hidden) {
    if (e.key === 'ArrowDown' && filterInput.value.trim()) { renderSuggest(); setActive(0); e.preventDefault(); }
    return;
  }
  if (e.key === 'ArrowDown') { setActive(SUGGEST.active + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { setActive(SUGGEST.active - 1); e.preventDefault(); }
  else if (e.key === 'Enter') {
    if (SUGGEST.active >= 0) { togglePick(SUGGEST.items[SUGGEST.active].code); e.preventDefault(); }
    else hideSuggest();
  } else if (e.key === 'Escape') { hideSuggest(); e.preventDefault(); }
});
// mousedown, not click: a click fires after the input's blur, which has already closed the list.
filterList.addEventListener('mousedown', function (e) {
  var li = e.target.closest('li[data-i]');
  e.preventDefault();
  if (!li) return;
  SUGGEST.active = Number(li.dataset.i);
  togglePick(SUGGEST.items[SUGGEST.active].code);
});
pickTags.addEventListener('click', function (e) {
  var x = e.target.closest('.ptag-x');
  if (x) togglePick(x.dataset.code);
});
// Clicking the empty part of the box puts the cursor in the input.
document.getElementById('searchBox').addEventListener('mousedown', function (e) {
  if (e.target === this) { e.preventDefault(); filterInput.focus(); }
});
filterInput.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== filterInput) hideSuggest(); }, 150); });
filterInput.addEventListener('focus', function () { if (filterInput.value.trim()) renderSuggest(); });

function showLoadError(err) {
  // The raw error is logged, never printed: it leaked internal strings such as
  // "GAS_URL secret not configured" onto a page with no authentication. If we already have
  // data on screen, keep it — a failed refresh should not blank a working board.
  console.error('dispatch load failed:', err);
  LAST_ERROR = err && err.message ? err.message : String(err);
  var box = document.getElementById('clock');
  var text = document.getElementById('freshText');
  box.classList.remove('is-fresh', 'is-aging');
  box.classList.add('is-stale');
  text.textContent = LAST_OK ? 'Update failed — showing older data' : 'Could not load';
  if (!ROWS.length) {
    // Name the actual failure. "Couldn't reach the schedule" was shown for every cause —
    // including a page left open long enough to be running stale code — which sent people
    // looking for a network problem that did not exist.
    var hint = /timed out/i.test(LAST_ERROR)
      ? 'The schedule server took too long to answer. It is usually slow rather than down.'
      : 'Could not load the schedule. If this persists, reload the page with Ctrl+Shift+R — '
        + 'the browser may be holding an old copy.';
    document.getElementById('main').innerHTML =
      '<div class="empty">' + hint
      + ' <button type="button" class="linkish" id="retryBtn">Try again</button></div>';
    var rb = document.getElementById('retryBtn');
    if (rb) rb.addEventListener('click', function () { load(true); });
  }
}

var loadInFlight = false;

/* `force` marks a person asking rather than a timer.
   Both paths now go through the edge cache. `cache: 'no-store'` used to be set here, which
   defeated it — every manual refresh, and every tab regaining focus, went straight to Apps
   Script. With several viewers that queued the script until it shed requests as 404s. The
   cache is only 45s old at worst, which is well inside what a schedule board needs. */
function load(force) {
  // A manual click landing on top of a scheduled tick would double the request cost for one
  // result; the second caller just rides along with the first.
  if (loadInFlight) return Promise.resolve();
  loadInFlight = true;

  // 60s, not 30. Apps Script has been measured at 23s for a single call, and the worker now
  // retries up to three times behind this request — so a bound tight enough to cut off a
  // slow-but-working response would manufacture the very failure it reports.
  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 60000);

  var opts = {};
  if (ctrl) opts.signal = ctrl.signal;

  return fetch('/api/data', opts)
    .then(function (r) {
      clearTimeout(timer);
      // Without an ok check, a 500 returning valid JSON fell through to an empty board that
      // read as "no jobs scheduled" rather than as a failure.
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      if (data && data.error) throw new Error(data.error);
      ROWS = (data && data.rows) || [];
      UNPLANNED = (data && data.unplanned) || [];
      GRID_START = (data && data.gridStart) ? new Date(data.gridStart) : null;
      COMPLETED = (data && data.completed) || null;
      TEST_REPORTS = (data && data.testReports) || [];
      PRODUCTS = (data && data.products) || [];
      MASTER_BY_CODE = null;
      // A served-from-fallback payload is real data, but it is NOT current: the upstream is
      // throttling. Don't advance the freshness stamp, or the board would claim to be up to
      // date while showing an older schedule.
      SERVING_STALE = !!(data && data.stale);
      if (!SERVING_STALE) LAST_OK = new Date();
      render();
      paintFreshness();
    })
    .catch(function (err) {
      clearTimeout(timer);
      // An aborted fetch reports as "AbortError", which tells the user nothing.
      showLoadError(err && err.name === 'AbortError'
        ? new Error('Request timed out after 60 seconds')
        : err);
    })
    .then(function () { loadInFlight = false; });
}

/* ---------------------------------------------------------------------------
   Polling policy.

   A fixed 60s timer meant a wall tablet left open all shift made ~480 Apps
   Script calls a day for a schedule that changes a handful of times — and it
   kept polling while the tab sat in the background, where nobody could see the
   result. Requests are the expensive thing here (Apps Script is slow and rate
   limited), so the page now only fetches when someone is actually looking:

     - hidden tab            -> no polling at all
     - visible but untouched -> polls until IDLE_AFTER, then stops
     - returning to the tab  -> one immediate fetch, timer restarts
     - interacting again     -> idle clock resets

   The freshness stamp keeps the whole thing honest: when polling has stopped,
   the header says so rather than implying the numbers are current.
   --------------------------------------------------------------------------- */
var POLL_EVERY = 120000;   // 2 min between fetches while watched — the sheet is edited
                           // a few times a day, so this is already generous.
var IDLE_AFTER = 300000;   // 5 min without interaction and we stop entirely. A wall
                           // display is "idle" by nature, so the visibility check is what
                           // protects it; this covers a forgotten desktop tab.
var pollTimer = null;
var lastInteraction = Date.now();

function pollingWanted() {
  return document.visibilityState === 'visible'
    && (Date.now() - lastInteraction) < IDLE_AFTER;
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(function () {
    if (!pollingWanted()) { stopPolling(); paintFreshness(); return; }
    load();
  }, POLL_EVERY);
}

/* Any sign of a human resets the idle clock. If polling had stopped and the data has
   gone stale meanwhile, fetch immediately rather than making them wait for the tick. */
function noteInteraction() {
  var wasIdle = !pollingWanted();
  lastInteraction = Date.now();
  if (wasIdle) {
    if (!LAST_OK || (Date.now() - LAST_OK.getTime()) > POLL_EVERY) load();
    startPolling();
    paintFreshness();
  }
}
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (evt) {
  document.addEventListener(evt, noteInteraction, { passive: true });
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    // Coming back to the tab is itself an interaction: refresh now, resume polling.
    lastInteraction = Date.now();
    load();
    startPolling();
  } else {
    stopPolling();
  }
});

// Clicking the stamp is both a manual refresh and an interaction, so it resumes polling.
document.getElementById('clock').addEventListener('click', function () {
  lastInteraction = Date.now();
  load(true);
  startPolling();
});

// Phrases inside longer sentences. Lower-case UI words only: sheet data is upper-case.
var I18N_HI_PHRASES = [
  ['click to refresh', 'रीफ़्रेश के लिए क्लिक करें'], ['may be out of date', 'शायद पुराना है'],
  ['Server busy — showing', 'सर्वर व्यस्त — दिखा रहे हैं'], ['Paused at', 'रुका:'], ['min ago', 'मिनट पहले'],
  ['Updated', 'अपडेट'], ['Collapse all', 'सब बंद करें'], ['Expand all', 'सब खोलें'],
  ['still on plan, judged once taken off it', 'अभी प्लान पर, हटने पर जाँचे जाएँगे'],
  ['change these on the sheet’s Settings tab.', 'इन्हें शीट के Settings टैब में बदलें।'],
  ['have no invoice, invoice date or order qty', 'में इनवॉइस, इनवॉइस तारीख या ऑर्डर मात्रा नहीं'],
  ['Due = PO date +', 'नियत तारीख = PO तारीख +'], ['Delivered = last invoice date', 'डिलीवर = आखिरी इनवॉइस तारीख'],
  ['In full = supplied ≥', 'पूरी मात्रा = सप्लाई ≥'], ['of order qty', 'ऑर्डर मात्रा का'],
  ['judged on', 'जाँचे गए'], ['month to date', 'महीने में अब तक'], ['of same days last month', 'पिछले महीने के इन्हीं दिनों का'],
  ['test reports', 'टेस्ट रिपोर्ट'], ['No supplied lines', 'कोई सप्लाई लाइन नहीं'], ['No jobs match', 'कोई काम नहीं मिला'],
  ['No open lines for', 'कोई चालू लाइन नहीं:'], ['match these filters', 'इन फ़िल्टर से'],
  ['on machine', 'मशीन'], ['yet', 'अभी तक'], ['open', 'चालू'], ['days', 'दिन'],
  ['items', 'आइटम'], ['item', 'आइटम'], ['lines', 'लाइनें'], ['line', 'लाइन'], ['left', 'बाकी'],
  ['pcs', 'पीस'], ['supplied', 'सप्लाई'], ['on plan', 'प्लान पर'], ['of', '/'],
];
var I18N_ATTRS = ['title', 'placeholder', 'aria-label', 'data-l'];
var LANG = (function () {
  try { return localStorage.getItem('dispatch.lang') === 'hi' ? 'hi' : 'en'; } catch (e) { return 'en'; }
})();

function phraseRe(p) {
  var body = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp((/^\w/.test(p) ? '\\b' : '') + body + (/\w$/.test(p) ? '\\b' : ''), 'g');
}
I18N_HI_PHRASES = I18N_HI_PHRASES.map(function (p) { return [phraseRe(p[0]), p[1]]; });

/* Product names, colours and shapes from the sheet, word by word. Generic words are
   translated (BOTTLE, CAP, LTR, colours); brand names are written in Devanagari. Only
   upper-case tokens (and myTVS / ml) are touched, and a word running into digits is part of a
   code (PMCON0248, INV26404, M1), so it is skipped. PO numbers and codes stay as typed. */
var I18N_HI_PRODUCT_WORDS = {
  ANY: 'कोई भी', ARZO: 'अर्ज़ो', ARZOL: 'अर्ज़ोल', BLACK: 'काला', BLUE: 'नीला', BOLT: 'बोल्ट',
  BOTTEL: 'बोतल', BOTTLE: 'बोतल', BOTTLES: 'बोतलें', CAN: 'कैन', CAP: 'ढक्कन', CAPS: 'ढक्कन',
  COLOUR: 'रंग', COLOR: 'रंग', COUGAR: 'कूगर', DOTS: 'डॉट्स', EMBOSSMENT: 'एम्बॉसमेंट',
  ENDURANCE: 'एंड्यूरेंस', FLUOROL: 'फ्लूरोल', FOR: 'के लिए', FORK: 'फोर्क', GO: 'गो',
  GOLDEN: 'सुनहरा', GREEN: 'हरा', GREY: 'स्लेटी', GRAY: 'स्लेटी', LITRE: 'लीटर', LTR: 'लीटर',
  MAROON: 'मैरून', MASARCO: 'मसार्को', MECHANIC: 'मैकेनिक', MECHNAIC: 'मैकेनिक', ML: 'मि.ली.',
  MM: 'मि.मी.', MYTVS: 'माय टीवीएस', NECK: 'नेक', OIL: 'तेल', PEACOCK: 'मोरपंखी', POWER: 'पावर',
  RED: 'लाल', SHALIMAR: 'शालीमार', SILVER: 'सिल्वर', SKYBLUE: 'आसमानी', STRIP: 'स्ट्रिप',
  TOPLAND: 'टॉपलैंड', TYPE: 'टाइप', VARRO: 'वैरो', VARROC: 'वैरोक', VIEW: 'व्यू', WAD: 'वैड',
  WITH: 'के साथ', WITHOUT: 'के बिना', WHITE: 'सफ़ेद', YELLOW: 'पीला',
};
function productWordsToHindi(s) {
  return s.replace(/[A-Za-z]+/g, function (w, at, all) {
    if (/\d/.test(all.charAt(at + w.length))) return w;              // code: PMCON0248, M1
    var key = w.toUpperCase();
    if (w !== key && key !== 'MYTVS' && key !== 'ML') return w;     // ordinary English word
    var hi = I18N_HI_PRODUCT_WORDS[key];
    return hi === undefined ? w : hi;
  });
}

function toHindi(text, keepData) {
  var core = text.trim();
  if (!core || !/[A-Za-z]/.test(core)) return text;
  var out = toHindiUi(core);
  if (!keepData) out = productWordsToHindi(out);
  return out === core ? text : text.replace(core, out);
}

function toHindiUi(core) {
  var out = I18N_HI[core];
  var sym = core.match(/^([^A-Za-z0-9]+)(.+)$/);    // "◷ Late", "– no invoice": status symbol + word
  if (out === undefined && sym && I18N_HI[sym[2]] !== undefined) out = sym[1] + I18N_HI[sym[2]];
  if (out === undefined) {
    for (var i = 0; i < I18N_HI_PATTERNS.length && out === undefined; i++) {
      if (I18N_HI_PATTERNS[i][0].test(core)) out = core.replace(I18N_HI_PATTERNS[i][0], I18N_HI_PATTERNS[i][1]);
    }
  }
  if (out === undefined) {
    if (!/[a-z]/.test(core)) return core;   // upper-case: sheet data, handled by productWordsToHindi
    out = core;
    I18N_HI_PHRASES.forEach(function (p) { out = out.replace(p[0], p[1]); });
  }
  return out;
}

function i18nSkip(el) { return !el || el.closest('script,style,.lang-toggle'); }
function translatePage() {
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  var n;
  while ((n = walker.nextNode())) {
    if (n.__hi !== undefined && n.nodeValue === n.__hi) continue;   // already done
    if (i18nSkip(n.parentElement)) continue;
    // The search suggestions stay in English: they highlight the letters being typed.
    var hi = toHindi(n.nodeValue, !!n.parentElement.closest('#filterList'));
    if (hi === n.nodeValue) continue;
    n.__en = n.nodeValue; n.__hi = hi; n.nodeValue = hi;
  }
  document.querySelectorAll('[title],[placeholder],[aria-label],[data-l]').forEach(function (el) {
    if (i18nSkip(el)) return;
    var memo = el.__i18n || (el.__i18n = {});
    I18N_ATTRS.forEach(function (a) {
      var v = el.getAttribute(a);
      if (v == null || (memo[a] && memo[a].hi === v)) return;
      var hi = toHindi(v);
      if (hi === v) return;
      memo[a] = { en: v, hi: hi };
      el.setAttribute(a, hi);
    });
  });
}
function restoreEnglish() {
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  var n;
  while ((n = walker.nextNode())) {
    if (n.__hi !== undefined && n.nodeValue === n.__hi) n.nodeValue = n.__en;
  }
  document.querySelectorAll('[title],[placeholder],[aria-label],[data-l]').forEach(function (el) {
    var memo = el.__i18n;
    if (!memo) return;
    Object.keys(memo).forEach(function (a) {
      if (el.getAttribute(a) === memo[a].hi) el.setAttribute(a, memo[a].en);
    });
    el.__i18n = {};
  });
}

var i18nQueued = false;
var i18nObserver = new MutationObserver(function () {
  if (LANG !== 'hi' || i18nQueued) return;
  i18nQueued = true;
  // Microtask, not a frame: the English must never be painted before it is replaced.
  Promise.resolve().then(function () { i18nQueued = false; translatePage(); });
});
function applyLang() {
  document.documentElement.lang = LANG;
  i18nObserver.disconnect();
  if (LANG === 'hi') {
    translatePage();
    i18nObserver.observe(document.body, {
      childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: I18N_ATTRS,
    });
  } else {
    restoreEnglish();
  }
}
document.getElementById('langToggle').addEventListener('click', function () {
  LANG = LANG === 'hi' ? 'en' : 'hi';
  try { localStorage.setItem('dispatch.lang', LANG); } catch (e) { /* not remembered */ }
  applyLang();
});
applyLang();

load();
startPolling();
// Re-render the stamp between fetches so "3 min ago" keeps counting up honestly. This is a
// local DOM update, not a request, so it is cheap — but it also stops while hidden.
setInterval(function () {
  if (document.visibilityState === 'visible') paintFreshness();
}, 30000);
</script>
