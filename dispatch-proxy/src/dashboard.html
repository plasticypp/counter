  measureFrozenOffset();
  var jt = document.getElementById('jumpToday');
  if (jt) jt.addEventListener('click', scrollToToday);
  scrollToToday();
}

/* ---------------------------------------------------------------------------
   Completed view — lines taken off the plan, with OTD / OTIF.

   The sheet sends facts only (PO date, order qty, supplied, invoices with dates) plus the two
   Settings values; every rule lives here, once, so the three tabs and the KPI strip cannot
   disagree:
     due       = PO Date + lead time
     delivered = date of the LAST invoice on the line (a split delivery is late if its last
                 part is late)
     OTD       = delivered <= due
     in full   = supplied >= order qty x (1 - tolerance)
     OTIF      = OTD and in full
   A line with no invoice, an invoice whose date is not on the Invoices tab, or no Order Qty
   cannot be judged; it is counted separately rather than silently scored as a pass or a fail.
   Dates travel as 'yyyy-MM-dd' IST day strings and are compared as whole days.
   --------------------------------------------------------------------------- */
function dayNum(iso) {
  var p = String(iso).split('-');
  return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) / 86400000;
}
function isoFromDayNum(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function fmtIso(iso) {
  if (!iso) return '—';
  return new Date(dayNum(iso) * 86400000)
    .toLocaleDateString('en-IN', { day: '2-digit', month: 'short', timeZone: 'UTC' });
}
// Days against due: late in red with a plus, early or on the day in green.
function fmtLate(n) {
  if (n === null) return '<span class="is-na">—</span>';
  return n > 0
    ? '<span class="late-bad">+' + n + 'd</span>'
    : '<span class="late-good">' + (n < 0 ? '−' + (-n) : '0') + 'd</span>';
}
function pct(n, d) { return d ? Math.round((n / d) * 100) + '%' : '—'; }

// One badge per line instead of three Yes/No columns.
function statusBadge(l) {
  if (l.status !== 'ok') return '<span class="st st-na">– ' + esc(l.status) + '</span>';
  if (l.otd && l.inFull) return '<span class="st st-good">✓ OTIF</span>';
  if (!l.otd && !l.inFull) return '<span class="st st-bad">✗ Late + Short</span>';
  return l.otd
    ? '<span class="st st-warn">◐ Short</span>'
    : '<span class="st st-warn">◷ Late</span>';
}

// Percentage tone: green at 95%+, amber 80–94%, red below 80%.
function pctTone(n, d) {
  if (!d) return 'st-na';
  var p = (n / d) * 100;
  return p >= 95 ? 'st-good' : p >= 80 ? 'st-warn' : 'st-bad';
}
function pctChip(label, n, d) {
  return '<span class="st ' + pctTone(n, d) + '">' + esc(label) + ' ' + pct(n, d) + '</span>';
}

function judgeLine(line, leadDays, tolerancePct) {
  var due = line.poDate ? isoFromDayNum(dayNum(line.poDate) + leadDays) : null;
  var inFull = line.orderQty > 0 ? line.supplied >= line.orderQty * (1 - tolerancePct / 100) : null;
  var status = 'ok';
  if (!line.invoices.length) status = 'no invoice';
  else if (line.invoices.some(function (i) { return !i.date; })) status = 'invoice date missing';
  else if (!due) status = 'no PO date';
  else if (!(line.orderQty > 0)) status = 'no order qty';
  var delivered = null, late = null, otd = null, otif = null;
  if (status === 'ok') {
    delivered = line.invoices.reduce(function (a, i) { return i.date > a ? i.date : a; }, '');
    late = dayNum(delivered) - dayNum(due);
    otd = late <= 0;
    otif = otd && inFull === true;
  }
  return { due: due, delivered: delivered, late: late, otd: otd, inFull: inFull, otif: otif, status: status };
}

function judgedLines() {
  var lead = COMPLETED.leadDays, tol = COMPLETED.tolerancePct;
  return COMPLETED.lines.map(function (l) {
    var j = judgeLine(l, lead, tol);
    Object.keys(l).forEach(function (k) { j[k] = l[k]; });
    return j;
  });
}

function completedLines() {
  var lines = judgedLines();
  if (!FILTER) return lines;
  var q = FILTER.toLowerCase();
  return lines.filter(function (l) {
    return [l.code, l.name, l.po].some(function (v) { return String(v).toLowerCase().indexOf(q) !== -1; })
      || l.invoices.some(function (i) { return String(i.no).toLowerCase().indexOf(q) !== -1; });
  });
}

function scoreLines(lines) {
  var judged = lines.filter(function (l) { return l.status === 'ok'; });
  var count = function (k) { return judged.filter(function (l) { return l[k]; }).length; };
  return { lines: lines.length, judged: judged.length, otd: count('otd'), otif: count('otif'),
    inFull: count('inFull') };
}

/* Rows of the active tab, grouped. By Invoice lists one row per shipment, so a line split over
   three invoices appears under each with that invoice's quantity, judged on THAT invoice's
   date. By PO / By Product list one row per line, judged on its last invoice. */
function completedGroups(lines) {
  var groups = {}, order = [];
  function add(key, label, sortKey, row) {
    if (!groups[key]) { groups[key] = { label: label, sortKey: sortKey, rows: [] }; order.push(key); }
    groups[key].rows.push(row);
    if (sortKey > groups[key].sortKey) groups[key].sortKey = sortKey;
  }
  lines.forEach(function (l) {
    if (VIEW === 'dinvoice') {
      if (!l.invoices.length) { add('~none', 'No invoice recorded', '', { line: l, inv: null }); return; }
      l.invoices.forEach(function (i) {
        add(i.no, i.no + ' · ' + fmtIso(i.date), i.date || '', { line: l, inv: i });
      });
    } else if (VIEW === 'dpo') {
      add(l.po, l.po, l.delivered || l.poDate || '', { line: l });
    } else {
      add(l.code, l.code + ' — ' + l.name, l.code, { line: l });
    }
  });
  if (VIEW === 'dproduct') order.sort(function (a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); });
  else order.sort(function (a, b) { return groups[a].sortKey < groups[b].sortKey ? 1 : groups[a].sortKey > groups[b].sortKey ? -1 : 0; });
  order.forEach(function (k) {
    groups[k].rows.sort(function (a, b) { return String(b.line.poDate || '').localeCompare(String(a.line.poDate || '')); });
  });
  return { groups: groups, order: order };
}

function completedColumns() {
  var base = [
    { th: 'Code', td: function (r) { return codeChipHtml(r.line.code, r.line.color, 'code-chip'); }, cls: 'data-col' },
    { th: 'Item', td: function (r) { return esc(r.line.name); }, cls: 'data-col' },
    { th: 'PO Date', td: function (r) { return fmtIso(r.line.poDate); } },
    { th: 'Due', td: function (r) { return fmtIso(r.line.due); } },
  ];
  // By PO already names the PO in its group header.
  if (VIEW !== 'dpo') base.splice(2, 0, { th: 'PO', td: function (r) { return esc(r.line.po); }, cls: 'txt' });
  if (VIEW === 'dinvoice') {
    return base.concat([
      { th: 'Shipped', td: function (r) { return r.inv ? fmtNum(r.inv.qty) : '—'; } },
      { th: 'Days late', td: function (r) { return fmtLate(shipmentLate(r)); } },
      { th: 'Line status', td: function (r) { return statusBadge(r.line); }, cls: 'txt' },
    ]);
  }
  return base.concat([
    { th: 'Order Qty', td: function (r) { return fmtNum(r.line.orderQty); } },
    { th: 'Supplied', td: function (r) { return fmtNum(r.line.supplied); } },
    { th: 'Fill', td: function (r) { return r.line.orderQty ? pct(r.line.supplied, r.line.orderQty) : '—'; } },
    { th: 'Invoices', td: function (r) {
      return r.line.invoices.length ? esc(r.line.invoices.map(function (i) { return i.no; }).join(', ')) : '—';
    }, cls: 'invs' },
    { th: 'Delivered', td: function (r) { return fmtIso(r.line.delivered); } },
    { th: 'Days late', td: function (r) { return fmtLate(r.line.late); } },
    { th: 'Status', td: function (r) { return statusBadge(r.line); }, cls: 'txt' },
  ]);
}

function shipmentLate(r) {
  if (!r.inv || !r.inv.date || !r.line.due) return null;
  return dayNum(r.inv.date) - dayNum(r.line.due);
}

function groupSummary(rows) {
  if (VIEW === 'dinvoice') {
    var judged = rows.filter(function (r) { return shipmentLate(r) !== null; });
    var onTime = judged.filter(function (r) { return shipmentLate(r) <= 0; }).length;
    var qty = rows.reduce(function (a, r) { return a + (r.inv ? r.inv.qty : 0); }, 0);
    return pctChip('On time', onTime, judged.length) + '<span class="sub">' +
      rows.length + ' line' + (rows.length === 1 ? '' : 's') + ' · ' + fmtNum(qty) + ' pcs</span>';
  }
  var s = scoreLines(rows.map(function (r) { return r.line; }));
  return pctChip('OTIF', s.otif, s.judged) + '<span class="sub">OTD ' + pct(s.otd, s.judged) +
    ' · ' + s.lines + ' line' + (s.lines === 1 ? '' : 's') + '</span>';
}

function renderCompleted() {
  var mainEl = document.getElementById('main');
  mainEl.setAttribute('aria-busy', 'false');
  if (!COMPLETED) {
    mainEl.innerHTML = '<div class="empty">Completed lines are not available from the sheet yet.</div>';
    return;
  }
  if (VIEW === 'dsummary') { renderSummary(mainEl); return; }
  var lines = completedLines();
  if (!lines.length) {
    mainEl.innerHTML = FILTER
      ? '<div class="empty">No completed lines match “' + esc(FILTER) + '”.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear filter</button></div>'
      : '<div class="empty">No completed lines on the sheet.</div>';
    var ec = document.getElementById('emptyClear');
    if (ec) ec.addEventListener('click', clearFilter);
    return;
  }

  var s = scoreLines(lines);
  var unjudged = s.lines - s.judged;
  var html = '<div class="grand kpi">' +
    '<div><span>Completed lines</span><b>' + fmtNum(s.lines) + '</b></div>' +
    '<div><span>OTD</span><b class="' + pctTone(s.otd, s.judged) + '">' + pct(s.otd, s.judged) + '</b></div>' +
    '<div><span>OTIF</span><b class="' + pctTone(s.otif, s.judged) + '">' + pct(s.otif, s.judged) + '</b></div>' +
    '<div><span>In full</span><b class="' + pctTone(s.inFull, s.judged) + '">' + pct(s.inFull, s.judged) + '</b></div>' +
    '</div>';
  html += '<p class="kpi-note">Due = PO date + <b>' + esc(COMPLETED.leadDays) + ' days</b> · ' +
    'Delivered = last invoice date · In full = supplied ≥ <b>' + esc(100 - COMPLETED.tolerancePct) + '%</b> of order qty · ' +
    'OTD/OTIF judged on <b>' + s.judged + '</b> of ' + s.lines + ' lines' +
    (unjudged ? ' (' + unjudged + ' have no invoice, invoice date or order qty)' : '') +
    ' · change these on the sheet’s Settings tab.</p>';

  var cols = completedColumns();
  var g = completedGroups(lines);
  html += '<div class="done-scroll"><table><thead><tr>' +
    cols.map(function (c) { return '<th scope="col"' + (c.cls === 'txt' || c.cls === 'invs' ? ' class="' + c.cls + '"' : '') + '>' + esc(c.th) + '</th>'; }).join('') +
    '</tr></thead><tbody>';
  g.order.forEach(function (k) {
    var grp = g.groups[k];
    html += '<tr class="group-row"><td colspan="' + cols.length + '"><span>' + esc(grp.label) + '</span>' +
      groupSummary(grp.rows) + '</td></tr>';
    grp.rows.forEach(function (r) {
      html += '<tr>' + cols.map(function (c) {
        return '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.td(r) + '</td>';
      }).join('') + '</tr>';
    });
  });
  html += '</tbody></table></div>';

  mainEl.innerHTML = html;
  var firstTh = mainEl.querySelector('.done-scroll thead th:first-child');
  if (firstTh) document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
}

/* ---------------------------------------------------------------------------
   Summary tab — what was dispatched in a month or a year, per product.

   Quantities and value come from SHIPMENTS (every invoice on every line, open lines
   included), so a month's figure is what actually left the plant that month and agrees with
   the invoices. OTIF/OTD come from completed LINES whose last invoice fell in the period.
   Value = qty x PO rate, ex-GST. Every filter applies to the KPIs, the trend and the table
   alike, so the figures on screen always describe the same slice.
   --------------------------------------------------------------------------- */
var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SUM = { year: 0, month: -1, po: '', brand: '', type: '', color: '', status: '', sort: 'qty' };
var SUM_SORTS = { qty: 'Quantity', value: 'Value', invoices: 'Invoices', otif: 'OTIF %', code: 'Code' };
var SUM_STATUSES = ['OTIF', 'Late', 'Short', 'Late + Short', 'Open line'];

function productType(code) {
  if (/^PMCAP/i.test(code)) return 'Cap';
  if (/^PMCON/i.test(code)) return 'Bottle';
  return 'Other';
}
function statusWord(l) {
  if (l.status !== 'ok') return l.status;
  if (l.otd && l.inFull) return 'OTIF';
  if (!l.otd && !l.inFull) return 'Late + Short';
  return l.otd ? 'Short' : 'Late';
}
function fmtLakh(v) {
  return Math.abs(v) >= 100000 ? (v / 100000).toFixed(1) + ' L' : fmtNum(v);
}

// A shipment or a line passes the tab's filters. Both carry po/brand/code/color/name.
function passesSum(x, status, invNos) {
  if (SUM.po && x.po !== SUM.po) return false;
  if (SUM.brand && x.brand !== SUM.brand) return false;
  if (SUM.type && productType(x.code) !== SUM.type) return false;
  if (SUM.color && x.color !== SUM.color) return false;
  if (SUM.status && status !== SUM.status) return false;
  if (!FILTER) return true;
  var q = FILTER.toLowerCase();
  return [x.code, x.name, x.po].concat(invNos).some(function (v) { return String(v).toLowerCase().indexOf(q) !== -1; });
}

// Period test on a 'yyyy-MM-dd' day. month -1 = whole year.
// maxDay caps the day of month, so a month still in progress can be compared with the same
// days of the month before rather than with the whole of it.
function inPeriod(day, year, month, maxDay) {
  if (!day) return false;
  if (Number(day.slice(0, 4)) !== year) return false;
  if (maxDay && Number(day.slice(8, 10)) > maxDay) return false;
  return month === -1 || Number(day.slice(5, 7)) - 1 === month;
}
function prevPeriod(year, month) {
  if (month === -1) return { year: year - 1, month: -1 };
  return month === 0 ? { year: year - 1, month: 11 } : { year: year, month: month - 1 };
}

function summaryData() {
  var lines = judgedLines();
  var lineById = {};
  lines.forEach(function (l) { lineById[l.id] = l; });
  var ships = COMPLETED.shipments.filter(function (s) {
    var status = s.done ? (lineById[s.line] ? statusWord(lineById[s.line]) : '') : 'Open line';
    return passesSum(s, status, [s.inv]);
  });
  var doneLines = lines.filter(function (l) {
    return passesSum(l, statusWord(l), l.invoices.map(function (i) { return i.no; }));
  });
  return { ships: ships, lines: doneLines };
}

function periodTotals(d, year, month, maxDay) {
  var ships = d.ships.filter(function (s) { return inPeriod(s.date, year, month, maxDay); });
  var lines = d.lines.filter(function (l) { return l.status === 'ok' && inPeriod(l.delivered, year, month, maxDay); });
  var t = { qty: 0, value: 0, invoices: {}, products: {}, pos: {}, ships: ships, lines: lines };
  ships.forEach(function (s) {
    t.qty += s.qty; t.value += s.qty * s.rate;
    t.invoices[s.inv] = 1; t.products[s.code] = 1; t.pos[s.po] = 1;
  });
  t.otd = lines.filter(function (l) { return l.otd; }).length;
  t.otif = lines.filter(function (l) { return l.otif; }).length;
  t.avgLate = lines.length ? lines.reduce(function (a, l) { return a + l.late; }, 0) / lines.length : null;
  return t;
}

function deltaHtml(now, before, against) {
  if (!before) return '<small class="is-na">no earlier period</small>';
  var p = Math.round(((now - before) / before) * 100);
  if (p === 0) return '<small class="is-na">same as ' + against + '</small>';
  return '<small class="' + (p > 0 ? 'late-good' : 'late-bad') + '">' + (p > 0 ? '▲ ' : '▼ ') + Math.abs(p) + '% vs ' + against + '</small>';
}

function sumSelect(key, label, options, allLabel) {
  var html = '<label class="sum-field"><span>' + esc(label) + '</span><select data-sum="' + key + '">';
  if (allLabel) html += '<option value="">' + esc(allLabel) + '</option>';
  options.forEach(function (o) {
    var v = typeof o === 'object' ? o.value : o, t = typeof o === 'object' ? o.text : o;
    html += '<option value="' + esc(v) + '"' + (String(SUM[key]) === String(v) ? ' selected' : '') +
      (o.disabled ? ' disabled' : '') + '>' + esc(t) + '</option>';
  });
  return html + '</select></label>';
}

function uniqueSorted(list) {
  return Array.from(new Set(list.filter(function (v) { return v !== '' && v != null; })))
    .sort(function (a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); });
}

function summaryControls(all, monthsWithData) {
  var years = uniqueSorted(all.map(function (s) { return s.date ? Number(s.date.slice(0, 4)) : null; }));
  var months = [{ value: -1, text: 'Whole year' }].concat(MONTH_NAMES.map(function (m, i) {
    return { value: i, text: m, disabled: !monthsWithData[i] };
  }));
  return '<div class="sum-bar">' +
    sumSelect('year', 'Year', years) +
    sumSelect('month', 'Month', months) +
    sumSelect('po', 'PO', uniqueSorted(all.map(function (s) { return s.po; })), 'All POs') +
    sumSelect('brand', 'Brand', uniqueSorted(all.map(function (s) { return s.brand; })), 'All brands') +
    sumSelect('type', 'Type', uniqueSorted(all.map(function (s) { return productType(s.code); })), 'All types') +
    sumSelect('color', 'Colour', uniqueSorted(all.map(function (s) { return s.color; })), 'All colours') +
    sumSelect('status', 'Status', SUM_STATUSES, 'All statuses') +
    sumSelect('sort', 'Sort by', Object.keys(SUM_SORTS).map(function (k) { return { value: k, text: SUM_SORTS[k] }; })) +
    '<button type="button" class="linkish" id="sumReset">Reset</button>' +
    '</div>';
}

function summaryKpis(t, prev, against) {
  var avg = t.avgLate === null ? '—'
    : Math.abs(Math.round(t.avgLate)) + (Math.round(t.avgLate) > 0 ? ' d late' : ' d early');
  return '<div class="grand kpi">' +
    '<div><span>Dispatched</span><b>' + fmtNum(t.qty) + '</b>' + deltaHtml(t.qty, prev.qty, against) + '</div>' +
    '<div><span>Value (ex-GST)</span><b>₹' + fmtLakh(t.value) + '</b>' + deltaHtml(t.value, prev.value, against) + '</div>' +
    '<div><span>Invoices</span><b>' + Object.keys(t.invoices).length + '</b><small class="is-na">' +
      Object.keys(t.pos).length + ' POs</small></div>' +
    '<div><span>Products</span><b>' + Object.keys(t.products).length + '</b></div>' +
    '<div><span>OTIF</span><b class="' + pctTone(t.otif, t.lines.length) + '">' + pct(t.otif, t.lines.length) + '</b>' +
      '<small class="is-na">OTD ' + pct(t.otd, t.lines.length) + ' · ' + t.otif + ' of ' + t.lines.length + ' lines</small></div>' +
    '<div><span>Avg vs due</span><b class="' + (t.avgLate > 0 ? 'st-bad' : 'st-good') + '">' + avg + '</b></div>' +
    '</div>';
}

// One bar per month of the year; the tallest month fills the track. Click to open that month.
function summaryTrend(d, year) {
  var months = MONTH_NAMES.map(function (m, i) { return periodTotals(d, year, i); });
  var max = Math.max.apply(null, months.map(function (t) { return t.qty; }).concat([1]));
  var html = '<div class="trend" role="group" aria-label="Months of ' + year + '">';
  months.forEach(function (t, i) {
    var on = SUM.month === i;
    html += '<button type="button" class="trend-m' + (on ? ' is-on' : '') + '" data-month="' + i + '"' +
      (t.qty ? '' : ' disabled') + '>' +
      '<span class="trend-bar"><i style="height:' + Math.round((t.qty / max) * 100) + '%"></i></span>' +
      '<b>' + MONTH_NAMES[i] + '</b><span>' + (t.qty ? fmtLakh(t.qty) : '—') + '</span>' +
      (t.lines.length ? '<span class="st ' + pctTone(t.otif, t.lines.length) + '">' + pct(t.otif, t.lines.length) + '</span>' : '<span></span>') +
      '</button>';
  });
  return html + '</div>';
}

function summaryRows(t) {
  var byCode = {};
  t.ships.forEach(function (s) {
    var p = byCode[s.code] || (byCode[s.code] = { code: s.code, name: s.name, color: s.color, brand: s.brand,
      qty: 0, value: 0, invoices: {}, months: {}, lines: 0, otif: 0 });
    p.qty += s.qty; p.value += s.qty * s.rate; p.invoices[s.inv] = 1;
    var m = Number(s.date.slice(5, 7)) - 1;
    p.months[m] = (p.months[m] || 0) + s.qty;
  });
  t.lines.forEach(function (l) {
    var p = byCode[l.code];
    if (!p) return;
    p.lines++; if (l.otif) p.otif++;
  });
  var rows = Object.keys(byCode).map(function (k) { return byCode[k]; });
  var key = SUM.sort;
  rows.sort(function (a, b) {
    if (key === 'code') return String(a.code).localeCompare(String(b.code), 'en', { numeric: true });
    if (key === 'invoices') return Object.keys(b.invoices).length - Object.keys(a.invoices).length;
    if (key === 'otif') return (b.lines ? b.otif / b.lines : -1) - (a.lines ? a.otif / a.lines : -1);
    return b[key] - a[key];
  });
  return rows;
}

function summaryTable(t, isYear) {
  var rows = summaryRows(t);
  if (!rows.length) return '<div class="empty">Nothing dispatched in this period with these filters.</div>';
  var monthCols = isYear
    ? MONTH_NAMES.map(function (m, i) { return i; }).filter(function (i) { return rows.some(function (r) { return r.months[i]; }); })
    : [];
  var html = '<div class="done-scroll"><table><thead><tr>' +
    '<th scope="col">Code</th><th scope="col">Item</th><th scope="col" class="txt">Brand</th>' +
    monthCols.map(function (i) { return '<th scope="col">' + MONTH_NAMES[i] + '</th>'; }).join('') +
    '<th scope="col">Dispatched</th><th scope="col">Value</th><th scope="col" class="txt">Share</th>' +
    '<th scope="col">Invoices</th><th scope="col">OTIF</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var share = t.qty ? (r.qty / t.qty) * 100 : 0;
    html += '<tr><td class="data-col">' + codeChipHtml(r.code, r.color, 'code-chip') + '</td>' +
      '<td class="data-col">' + esc(r.name) + '</td><td class="txt">' + esc(r.brand || '—') + '</td>' +
      monthCols.map(function (i) { return '<td>' + (r.months[i] ? fmtNum(r.months[i]) : '<span class="is-na">—</span>') + '</td>'; }).join('') +
      '<td><b>' + fmtNum(r.qty) + '</b></td><td>₹' + fmtLakh(r.value) + '</td>' +
      '<td class="txt"><span class="share"><i style="width:' + Math.max(1, Math.round(share)) + '%"></i></span>' +
        Math.round(share) + '%</td>' +
      '<td>' + Object.keys(r.invoices).length + '</td>' +
      '<td>' + (r.lines ? '<span class="st ' + pctTone(r.otif, r.lines) + '">' + pct(r.otif, r.lines) + '</span>' : '<span class="is-na">—</span>') + '</td></tr>';
  });
  var monthTotals = monthCols.map(function (i) {
    return '<td>' + fmtNum(rows.reduce(function (a, r) { return a + (r.months[i] || 0); }, 0)) + '</td>';
  }).join('');
  html += '<tr class="subtotal-row"><td colspan="3">Total · ' + rows.length + ' products</td>' + monthTotals +
    '<td>' + fmtNum(t.qty) + '</td><td>₹' + fmtLakh(t.value) + '</td><td class="txt">100%</td>' +
    '<td>' + Object.keys(t.invoices).length + '</td><td>' + pct(t.otif, t.lines.length) + '</td></tr>';
  return html + '</tbody></table></div>';
}

// First visit: the current month if anything shipped in it, else the latest month that did.
function defaultPeriod(all) {
  var days = all.map(function (s) { return s.date; }).filter(Boolean).sort();
  if (!days.length) return;
  var nowIst = new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 7);
  var pick = days.some(function (d) { return d.slice(0, 7) === nowIst; }) ? nowIst : days[days.length - 1].slice(0, 7);
  SUM.year = Number(pick.slice(0, 4));
  SUM.month = Number(pick.slice(5, 7)) - 1;
}

function renderSummary(mainEl) {
  var all = COMPLETED.shipments || [];
  if (!all.length) {
    mainEl.innerHTML = '<div class="empty">No dispatches recorded yet.</div>';
    return;
  }
  if (!SUM.year) defaultPeriod(all);
  var d = summaryData();
  var isYear = SUM.month === -1;
  var monthsWithData = {};
  all.forEach(function (s) { if (s.date && Number(s.date.slice(0, 4)) === SUM.year) monthsWithData[Number(s.date.slice(5, 7)) - 1] = 1; });
  var t = periodTotals(d, SUM.year, SUM.month);
  var p = prevPeriod(SUM.year, SUM.month);
  // The current month is still running: compare it with the same days of last month.
  var nowIst = new Date(Date.now() + 5.5 * 3600 * 1000);
  var running = !isYear && SUM.year === nowIst.getUTCFullYear() && SUM.month === nowIst.getUTCMonth();
  var prev = periodTotals(d, p.year, p.month, running ? nowIst.getUTCDate() : 0);
  var against = running ? 'same days last month' : (isYear ? 'previous year' : 'previous month');
  var title = (isYear ? 'Year ' : MONTH_NAMES[SUM.month] + ' ') + SUM.year +
    (running ? ' · month to date (1–' + nowIst.getUTCDate() + ')' : '');

  mainEl.innerHTML = summaryControls(all, monthsWithData) +
    '<h2 class="sum-title">' + esc(title) + '</h2>' +
    summaryKpis(t, prev, against) +
    summaryTrend(d, SUM.year) +
    summaryTable(t, isYear);

  mainEl.querySelectorAll('[data-sum]').forEach(function (el) {
    el.addEventListener('change', function () {
      var k = el.dataset.sum;
      SUM[k] = (k === 'year' || k === 'month') ? Number(el.value) : el.value;
      if (k === 'year') SUM.month = -1;   // a new year opens on the whole year
      render();
    });
  });
  mainEl.querySelectorAll('.trend-m').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = Number(b.dataset.month);
      SUM.month = SUM.month === m ? -1 : m;   // clicking the open month goes back to the year
      render();
    });
  });
  document.getElementById('sumReset').addEventListener('click', function () {
    SUM = { year: 0, month: -1, po: '', brand: '', type: '', color: '', status: '', sort: 'qty' };
    render();
  });
  var firstTh = mainEl.querySelector('.done-scroll thead th:first-child');
  if (firstTh) document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
}

/* The second frozen column has to start exactly where the first one ends, and the Code
   column's width depends on its content. Measure rather than guess. */
function measureFrozenOffset() {
  var firstTh = document.querySelector('.table-scroll thead th:first-child');
  if (firstTh) {
    document.documentElement.style.setProperty('--froz-1', firstTh.getBoundingClientRect().width + 'px');
  }
}

/* Today can sit far off the right edge of a 120-column grid; without this the marker is
   only findable by hunting for it. */
function scrollToToday() {
  var box = document.querySelector('.table-scroll');
  var cell = document.querySelector('.date-th.is-today');
  if (!box || !cell) return;
  var frozen = (document.querySelector('.table-scroll thead th:first-child') || { offsetWidth: 0 }).offsetWidth
    + (document.querySelector('.table-scroll thead th:nth-child(2)') || { offsetWidth: 0 }).offsetWidth;
  box.scrollLeft = Math.max(0, cell.offsetLeft - frozen - 80);
}


document.querySelectorAll('.tab').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    VIEW = btn.dataset.view;
    VIEW_BY_MODE[MODE] = VIEW;
    render();
  });
});

document.querySelectorAll('.mode').forEach(function (btn) {
  btn.addEventListener('click', function () {
    MODE = btn.dataset.mode;
    VIEW = VIEW_BY_MODE[MODE];
    document.querySelectorAll('.mode').forEach(function (b) {
      var on = b === btn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.querySelectorAll('.tab').forEach(function (t) {
      var on = t.dataset.view === VIEW;
      t.hidden = t.dataset.mode !== MODE;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    render();
  });
});

var filterInput = document.getElementById('filterInput');
var filterWrap = document.querySelector('.filter-wrap');
var filterClear = document.getElementById('filterClear');

function clearFilter() {
  filterInput.value = '';
  FILTER = '';
  filterWrap.classList.remove('has-value');
  render();
  filterInput.focus();
}

// Debounced: render() rebuilds all three renderings, so an undebounced keystroke handler
// rebuilt the entire board on every character typed.
var filterTimer = null;
filterInput.addEventListener('input', function () {
  filterWrap.classList.toggle('has-value', !!filterInput.value.trim());
  clearTimeout(filterTimer);
  filterTimer = setTimeout(function () {
    FILTER = filterInput.value.trim();
    render();
  }, 140);
});
filterClear.addEventListener('click', clearFilter);

function showLoadError(err) {
  // The raw error is logged, never printed: it leaked internal strings such as
  // "GAS_URL secret not configured" onto a page with no authentication. If we already have
  // data on screen, keep it — a failed refresh should not blank a working board.
  console.error('dispatch load failed:', err);
  LAST_ERROR = err && err.message ? err.message : String(err);
  var box = document.getElementById('clock');
  var text = document.getElementById('freshText');
  box.classList.remove('is-fresh', 'is-aging');
  box.classList.add('is-stale');
  text.textContent = LAST_OK ? 'Update failed — showing older data' : 'Could not load';
  if (!ROWS.length) {
    // Name the actual failure. "Couldn't reach the schedule" was shown for every cause —
    // including a page left open long enough to be running stale code — which sent people
    // looking for a network problem that did not exist.
    var hint = /timed out/i.test(LAST_ERROR)
      ? 'The schedule server took too long to answer. It is usually slow rather than down.'
      : 'Could not load the schedule. If this persists, reload the page with Ctrl+Shift+R — '
        + 'the browser may be holding an old copy.';
    document.getElementById('main').innerHTML =
      '<div class="empty">' + hint
      + ' <button type="button" class="linkish" id="retryBtn">Try again</button></div>';
    var rb = document.getElementById('retryBtn');
    if (rb) rb.addEventListener('click', function () { load(true); });
  }
}

var loadInFlight = false;

/* `force` marks a person asking rather than a timer.
   Both paths now go through the edge cache. `cache: 'no-store'` used to be set here, which
   defeated it — every manual refresh, and every tab regaining focus, went straight to Apps
   Script. With several viewers that queued the script until it shed requests as 404s. The
   cache is only 45s old at worst, which is well inside what a schedule board needs. */
function load(force) {
  // A manual click landing on top of a scheduled tick would double the request cost for one
  // result; the second caller just rides along with the first.
  if (loadInFlight) return Promise.resolve();
  loadInFlight = true;

  // 60s, not 30. Apps Script has been measured at 23s for a single call, and the worker now
  // retries up to three times behind this request — so a bound tight enough to cut off a
  // slow-but-working response would manufacture the very failure it reports.
  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 60000);

  var opts = {};
  if (ctrl) opts.signal = ctrl.signal;

  return fetch('/api/data', opts)
    .then(function (r) {
      clearTimeout(timer);
      // Without an ok check, a 500 returning valid JSON fell through to an empty board that
      // read as "no jobs scheduled" rather than as a failure.
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      if (data && data.error) throw new Error(data.error);
      ROWS = (data && data.rows) || [];
      GRID_START = (data && data.gridStart) ? new Date(data.gridStart) : null;
      COMPLETED = (data && data.completed) || null;
      // A served-from-fallback payload is real data, but it is NOT current: the upstream is
      // throttling. Don't advance the freshness stamp, or the board would claim to be up to
      // date while showing an older schedule.
      SERVING_STALE = !!(data && data.stale);
      if (!SERVING_STALE) LAST_OK = new Date();
      render();
      paintFreshness();
    })
    .catch(function (err) {
      clearTimeout(timer);
      // An aborted fetch reports as "AbortError", which tells the user nothing.
      showLoadError(err && err.name === 'AbortError'
        ? new Error('Request timed out after 60 seconds')
        : err);
    })
    .then(function () { loadInFlight = false; });
}

window.addEventListener('resize', measureFrozenOffset);

/* ---------------------------------------------------------------------------
   Polling policy.

   A fixed 60s timer meant a wall tablet left open all shift made ~480 Apps
   Script calls a day for a schedule that changes a handful of times — and it
   kept polling while the tab sat in the background, where nobody could see the
   result. Requests are the expensive thing here (Apps Script is slow and rate
   limited), so the page now only fetches when someone is actually looking:

     - hidden tab            -> no polling at all
     - visible but untouched -> polls until IDLE_AFTER, then stops
     - returning to the tab  -> one immediate fetch, timer restarts
     - interacting again     -> idle clock resets

   The freshness stamp keeps the whole thing honest: when polling has stopped,
   the header says so rather than implying the numbers are current.
   --------------------------------------------------------------------------- */
var POLL_EVERY = 120000;   // 2 min between fetches while watched — the sheet is edited
                           // a few times a day, so this is already generous.
var IDLE_AFTER = 300000;   // 5 min without interaction and we stop entirely. A wall
                           // display is "idle" by nature, so the visibility check is what
                           // protects it; this covers a forgotten desktop tab.
var pollTimer = null;
var lastInteraction = Date.now();

function pollingWanted() {
  return document.visibilityState === 'visible'
    && (Date.now() - lastInteraction) < IDLE_AFTER;
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(function () {
    if (!pollingWanted()) { stopPolling(); paintFreshness(); return; }
    load();
  }, POLL_EVERY);
}

/* Any sign of a human resets the idle clock. If polling had stopped and the data has
   gone stale meanwhile, fetch immediately rather than making them wait for the tick. */
function noteInteraction() {
  var wasIdle = !pollingWanted();
  lastInteraction = Date.now();
  if (wasIdle) {
    if (!LAST_OK || (Date.now() - LAST_OK.getTime()) > POLL_EVERY) load();
    startPolling();
    paintFreshness();
  }
}
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (evt) {
  document.addEventListener(evt, noteInteraction, { passive: true });
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    // Coming back to the tab is itself an interaction: refresh now, resume polling.
    lastInteraction = Date.now();
    load();
    startPolling();
  } else {
    stopPolling();
  }
});

// Clicking the stamp is both a manual refresh and an interaction, so it resumes polling.
document.getElementById('clock').addEventListener('click', function () {
  lastInteraction = Date.now();
  load(true);
  startPolling();
});

load();
startPolling();
// Re-render the stamp between fetches so "3 min ago" keeps counting up honestly. This is a
// local DOM update, not a request, so it is cheap — but it also stops while hidden.
setInterval(function () {
  if (document.visibilityState === 'visible') paintFreshness();
}, 30000);
</script>
