  /* ================= REVIEW FIXES (2026-11-17, density + touch-target audits) =================
     Touch: the compact pass left phones at 34–36px targets (a later block overrode the 44px
     rules). On touch screens the main controls go back to a real 44px, and chips keep their
     compact look but get an invisible 44px tap area; their lines are spaced so the tap areas
     of neighbouring lines do not overlap. A mouse keeps the compact sizes. */
  @media (pointer: coarse) {
    .mode, .tab, .lang-toggle, header .counter-link, .counter-link { min-height: 44px; }
    header .counter-link { min-width: 44px; justify-content: center; }
    header .fold-btn { height: 44px; min-width: 44px; }
    .toolbar .chip, .fline .chip, .toolbar .jump-today, .tb-sort { position: relative; }
    .toolbar .chip::after, .fline .chip::after, .toolbar .jump-today::after, .tb-sort::after {
      content: ""; position: absolute; top: 50%; height: 44px; transform: translateY(-50%);
      left: min(0px, calc((100% - 44px) / 2)); right: min(0px, calc((100% - 44px) / 2));
    }
    /* The rows scroll sideways, and a scroll box clips vertically too — so the row itself must
       be tall enough to hold each chip's 44px tap area: padding, not margin. */
    .toolbar { margin-bottom: 0; }
    .fline { margin-bottom: 2px; }
    .tb-scroll, .fline { gap: 8px; padding-top: 7px; padding-bottom: 7px; }
    .tb-scroll .chip, .fline .chip, .tb-scroll .jump-today, .tb-scroll .tb-sort { min-height: 30px; }
    .group-row td, .card-group-head, .tcard-group { padding-top: 11px; padding-bottom: 11px; }
  }
  /* Selects inside the pill fill its height, so the whole pill opens the menu. */
  .tb-sort select { align-self: stretch; }

  /* Hierarchy: sub-tabs read as a lighter level than the four board modes — underline, not a
     second filled bar. */
  .tabs { background: transparent; border-color: transparent; padding: 0; gap: 4px; }
  .tab.active { background: transparent; color: var(--primary); box-shadow: inset 0 -3px 0 var(--primary); border-radius: 0; }
  /* Subtotal rows: a rule and bold figures, not a full blue band competing with the data. */
  .subtotal-row td, .subtotal-row td:first-child, .subtotal-row td:nth-child(2) { background: var(--panel-alt); }
  .tcard-sub, .card-sub, .card-sub-label { background: var(--panel-alt); }
  /* Zero figures recede so real quantities stand out. */
  td.num.is-zero { color: var(--faint); font-weight: 400; }
  /* Phone timeline: start/end dates as quiet text, not the loudest blocks on the card. */
  .cbar-lbl.is-filled, .cbar-lbl { background: none; border-color: transparent; color: var(--dim); padding: 0; }
  @media (max-width: 620px) { .grand.kpi small .delta-of { display: none; } }

  /* ================= NO-SCROLL FILTERS (2026-11-17) =================
     Filter lines wrap onto further rows instead of scrolling sideways; groups wrap inside too.
     Rows sit 42px apart on touch screens (30px chip + 12px gap) and each chip's tap area is
     the full pitch, so neighbouring rows never steal a tap. */
  .tb-scroll, .fline { flex-wrap: wrap; overflow: visible; row-gap: 6px; }
  .tb-scroll > *, .fline > * { flex: 0 1 auto; }
  .fgroup { flex-wrap: wrap; row-gap: 6px; max-width: 100%; }
  .fline .chip, .toolbar .chip, .toolbar .jump-today { min-height: 28px; padding: 2px 9px; font-size: var(--fs-xs); }
  .tb-sort { min-height: 28px; }
  /* Colour blocks: the colour itself, bright, with a ring and tick when picked. */
  .chip-color { padding: 2px !important; min-width: 0; border-radius: 7px; }
  .cblock {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 22px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.28);
    font-style: normal; font-size: 13px; font-weight: 900; line-height: 1;
  }
  /* Beat the machine key's 10px dot rule (.legend .chip i), which also matched these blocks. */
  .legend .chip-color .cblock, .chip-color .cblock { width: 26px; height: 22px; border-radius: 5px; }
  @media (max-width: 620px) { .legend .chip-color .cblock, .chip-color .cblock { width: 24px; } }
  .chip-color.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); background: var(--panel); }
  .chip-color.on .cblock::after { content: "✓"; }
  .cblock-cell { width: 34px; height: 16px; vertical-align: middle; }
  @media (pointer: coarse) {
    /* 30px chip + 14px gap = 44px pitch; the tap area (border box 30 = padding box 28 + 16)
       fills exactly that pitch, so rows neither leave dead gaps nor overlap. */
    .tb-scroll, .fline { row-gap: 14px; padding-top: 7px; padding-bottom: 7px; }
    .fgroup { row-gap: 14px; }
    .fline .chip, .toolbar .chip, .toolbar .jump-today, .tb-sort { min-height: 30px; }
    .toolbar .chip::after, .fline .chip::after, .toolbar .jump-today::after, .tb-sort::after {
      height: calc(100% + 16px);
    }
    .cblock { width: 30px; height: 24px; }
  }

  /* Months and Today only steer the desktop day grid; tablets and phones show bars instead. */
  @media (max-width: 1000px) { #monthFold, #jumpToday { display: none; } }
  @media (max-width: 620px) {
    .legend .mchip { min-width: 0; padding: 2px 7px; gap: 4px; }
    .chip-color { padding: 1px !important; }
    .cblock { width: 24px; height: 22px; }
    .fline .chip { padding: 2px 8px; }
    .tb-sort select { max-width: 132px; }
    .fg-label { font-size: 9px; letter-spacing: .03em; }
  }

  /* Figures strips (Open totals, Completed and Summary KPIs): one slim row everywhere. */
  .grand.kpi { display: flex; flex-wrap: nowrap; }
  .grand.kpi div { flex: 1 1 0; min-width: 0; padding: 3px 10px; }
  .grand.kpi span { font-size: 9px; letter-spacing: .04em; }
  .grand.kpi b { font-size: var(--fs-md); }
  @media (max-width: 620px) {
    .grand.kpi, .grand.kpi:has(> div:nth-child(5)), .grand.kpi.open-totals { display: flex; }
    .grand.kpi div { padding: 3px 5px; border-bottom: 0; }
    .grand.kpi span { font-size: 8.5px; line-height: 1.1; letter-spacing: 0; }
    .grand.kpi b { font-size: var(--fs-xs); letter-spacing: -.02em; }
    .grand.kpi small { display: none; }
    .kpi-note { display: none; }
  }

  /* 360px phones: five-digit quantities in adjacent card cells ran into each other. */
  @media (max-width: 380px) {
    .metric-row b, .card-sub b { font-size: var(--fs-sm); letter-spacing: -.02em; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="wordmark">YPP</span>
    <h1>Dispatch</h1>
  </div>
  <!-- Open = the live schedule; Completed = lines taken off the plan (no Machine/Priority),
       with OTD/OTIF. Each mode has its own tab set; only the active mode's tabs are shown. -->
  <div class="modes" role="group" aria-label="Board">
    <button type="button" class="mode active" data-mode="open" aria-pressed="true">Open</button>
    <button type="button" class="mode" data-mode="done" aria-pressed="false">Completed</button>
    <button type="button" class="mode" data-mode="reports" aria-pressed="false">Test Reports</button>
    <button type="button" class="mode" data-mode="products" aria-pressed="false">Products</button>
  </div>
  <!-- Whole-board language switch. Data from the sheet (names, PO numbers, codes) stays as typed. -->
  <button type="button" class="lang-toggle" id="langToggle" aria-label="Switch language: English / Hindi"
          title="English / हिंदी"><span data-lang="en">EN</span><span data-lang="hi">हिं</span></button>
  <div class="tabs" role="tablist" aria-label="Group schedule by">
    <button class="tab active" data-mode="open" data-view="po" role="tab" aria-selected="true">By PO</button>
    <button class="tab" data-mode="open" data-view="product" role="tab" aria-selected="false">By Product</button>
    <button class="tab" data-mode="open" data-view="machine" role="tab" aria-selected="false">By Machine</button>
    <button class="tab" data-mode="open" data-view="color" role="tab" aria-selected="false">By Color</button>
    <button class="tab" data-mode="done" data-view="dinvoice" role="tab" aria-selected="false" hidden>By Invoice</button>
    <button class="tab" data-mode="done" data-view="dpo" role="tab" aria-selected="false" hidden>By PO</button>
    <button class="tab" data-mode="done" data-view="dproduct" role="tab" aria-selected="false" hidden>By Product</button>
    <button class="tab" data-mode="done" data-view="dsummary" role="tab" aria-selected="false" hidden>Summary</button>
  </div>
  <div class="filter-wrap">
    <label class="sr-only" for="filterInput">Filter by code, product name or PO</label>
    <!-- Picked products show as tags ahead of the text; the box grows a line when they wrap. -->
    <div class="search-box" id="searchBox">
      <span class="pick-tags" id="pickTags"></span>
      <input type="text" id="filterInput" placeholder="filter code, name or PO…" autocomplete="off"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="filterList">
    </div>
    <button type="button" class="clear-x" id="filterClear" aria-label="Clear search and picked products">✕</button>
    <!-- Products matching what is typed; each pick toggles it as a tag. -->
    <ul id="filterList" class="filter-list" role="listbox" aria-label="Matching products" aria-multiselectable="true" hidden></ul>
  </div>
  <!-- One download control for the Completed tabs: exports exactly what the current tab shows,
       filters included, as Excel or PDF. -->
  <div class="export-wrap" id="exportWrap">
    <button type="button" class="counter-link" id="exportBtn" aria-haspopup="menu" aria-expanded="false"
            aria-label="Download this view" title="Download this view">
      <span aria-hidden="true">⤓</span>
    </button>
    <div class="export-menu" id="exportMenu" role="menu" hidden>
      <button type="button" role="menuitem" data-export="xlsx">Excel (.xlsx)</button>
      <button type="button" role="menuitem" data-export="pdf">PDF</button>
    </div>
  </div>
  <!-- Counter Entry lives on its own GitHub Pages wrapper; operators normally arrive by
       scanning a per-machine QR, so this is the way in when a sticker is missing or when
       you are already looking at the board. New tab: the dashboard auto-refreshes and is
       often left open on the wall tablet — navigating away from it would be a loss. -->
  <a class="counter-link" href="https://plasticypp.github.io/counter/" target="_blank"
     rel="noopener" aria-label="Open Counter Entry in a new tab">
    <span aria-hidden="true">⊞</span><span class="lbl">Counter Entry</span>
  </a>
  <!-- Freshness, not decoration: the dot reflects measured age and is always paired with
       the text stamp, never carrying the meaning on its own. -->
  <!-- Collapse / expand every group of the tab on screen. Hidden on tabs without groups. -->
  <button type="button" class="fold-btn" id="foldAll" hidden></button>
  <button type="button" class="clock" id="clock" title="Refresh now">
    <span class="dot" id="freshDot"></span><span id="freshText">loading…</span>
  </button>
</header>

<main id="main" aria-live="polite" aria-busy="true">
  <div class="empty">loading…</div>
</main>

<script>
var PALETTE = {1:'var(--m1)',2:'var(--m2)',3:'var(--m3)',4:'var(--m4)',5:'var(--m5)',6:'var(--m6)',7:'var(--m7)'};
var ROWS = [];
var UNPLANNED = [];     // not started, not planned: no Machine/Priority, nothing supplied
var GRID_START = null;
var VIEW = 'po';
var MODE = 'open';                                  // 'open' schedule | 'done' completed lines
var VIEW_BY_MODE = { open: 'po', done: 'dinvoice', reports: 'reports', products: 'products' }; // each mode remembers its own tab
var COMPLETED = null;                               // { leadDays, tolerancePct, lines } from the sheet
var TEST_REPORTS = [];  // TestReports register, newest first: { no, date, invoice, po, code, item, qty, url, failed }
var PRODUCTS = [];      // Masters without costing: { code, name, shape, size, weight, color, machine, mb, perHour, perDay }
var FILTER = '';
var TODAY = null;
var MACHINES_SEEN = [];
var MACHINE_SEL = {};   // Open board: machines ticked in the key, e.g. { '5': true }
function hasMachineSel() { return Object.keys(MACHINE_SEL).length > 0; }
function machineSelText() { return Object.keys(MACHINE_SEL).sort(function (a, b) { return a - b; }).join(', '); }

/* Open board chip filters (multi-select, see chipRow). Machine is not here: the machine key
   above the board already is a multi-select filter. Shape and pack size come from the Masters
   sheet by product code; a code missing from Masters has neither and so drops out of a
   shape/size filter. Session only, like the other tabs' filters. */
var OPEN_F_DEFAULT = { type: [], color: [], shape: [], size: [], _panel: '' };
var OPEN_F = Object.assign({}, OPEN_F_DEFAULT);
var OPEN_F_KEYS = ['type', 'color', 'shape', 'size'];
var MASTER_BY_CODE = null;
function masterOf(code) {
  if (!MASTER_BY_CODE) {
    MASTER_BY_CODE = {};
    (PRODUCTS || []).forEach(function (p) { MASTER_BY_CODE[p.code] = p; });
  }
  return MASTER_BY_CODE[code] || {};
}
function passesOpenFilter(r) {
  var m = masterOf(r.code);
  return inSel(OPEN_F.type, productType(r.code)) && inSel(OPEN_F.color, r.color) &&
    inSel(OPEN_F.shape, m.shape) && inSel(OPEN_F.size, m.size);
}
function openFilterChips() {
  var n = selCount(OPEN_F, OPEN_F_KEYS);
  return n ? chip('id="openReset"', '<span aria-hidden="true">✕</span> Clear', false, 'chip-clear') : '';
}
function openFilterPanel(rows) {
  var pick = function (f) { return uniqueSorted(rows.map(f)).map(String); };
  return filterLine(
    chipGroup(OPEN_F, 'type', 'Type', pick(function (r) { return productType(r.code); })) +
    chipGroup(OPEN_F, 'color', 'Colour', pick(function (r) { return r.color; }), colourSwatch) +
    chipGroup(OPEN_F, 'shape', 'Shape', pick(function (r) { return masterOf(r.code).shape; })) +
    chipGroup(OPEN_F, 'size', 'Pack size (L)', pick(function (r) { return masterOf(r.code).size; }), sizeChipText));
}
function zeroCls(v) { return Number(v) === 0 ? ' is-zero' : ''; }
// Board totals as one slim strip under the toolbar (was a tall block after the table).
function openTotalsHtml(grand, showRmMb) {
  var cell = function (label, v) { return '<div><span>' + label + '</span><b>' + fmtNum(v) + '</b></div>'; };
  return '<div class="grand kpi open-totals">' +
    cell('Order Qty', grand.orderQty) + cell('Supplied', grand.supplied) +
    cell('Ready Stock', grand.readyStock) + cell('Balance', grand.balance) +
    (showRmMb ? cell('RM Req', grand.rmReq) + cell('MB', grand.mb) : '') + '</div>';
}
function bindOpenFilters(mainEl) {
  var mf = document.getElementById('monthFold');
  if (mf) mf.addEventListener('click', function () {
    var fold = !allMonthsFolded();
    MONTH_FOLD = {};

    render();
  });
  mainEl.querySelectorAll('[data-mfold]').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var k = b.dataset.mfold;

/* ---------------------------------------------------------------------------
   Group sorting and folding, per tab. The first option of each list is the default.
   Both are remembered on this device only (localStorage), so a shared wall tablet and a
   phone can each keep their own layout. Storage can be missing or blocked: every access is
   guarded and the board works the same without it, just forgetting on reload.
   --------------------------------------------------------------------------- */
var GROUP_SORTS = {
  po: [['new', 'PO no. · newest first'], ['old', 'PO no. · oldest first'], ['bal', 'Most still to supply'], ['start', 'Earliest start']],
  product: [['code', 'Code'], ['bal', 'Most still to supply'], ['start', 'Earliest start']],
  dpo: [['new', 'PO no. · newest first'], ['old', 'PO no. · oldest first'], ['last', 'Last delivery · newest'], ['left', 'Most still to supply']],
  dinvoice: [['new', 'Invoice date · newest'], ['old', 'Invoice date · oldest']],
  dproduct: [['code', 'Code'], ['supplied', 'Most supplied'], ['left', 'Most still to supply']],
};
/* Groups start OPEN on every tab (user's choice, 2026-11-17). A group folded by hand stays
   folded only for this page load: FOLDED is not stored, so a reload — or the next person at a
   shared tablet — sees everything open again. Only the sort choice is remembered. */
var PREFS_KEY = 'dispatch.groups.v1';
var PREFS = (function () {
  try {
    var p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    return { sort: p.sort || {} };
  } catch (e) { return { sort: {} }; }
})();
var FOLDED = {};   // { view: { groupKey: 1 } } — in memory only
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) { /* not stored */ } }
function groupSort() {
  var opts = GROUP_SORTS[VIEW];
  if (!opts) return '';
  var s = PREFS.sort[VIEW];
  return opts.some(function (o) { return o[0] === s; }) ? s : opts[0][0];
}
function isFolded(key) { return !!(FOLDED[VIEW] && FOLDED[VIEW][key]); }
function setFolded(key, on) {
  var m = FOLDED[VIEW] || (FOLDED[VIEW] = {});
  if (on) m[key] = 1; else delete m[key];
}
function cmpNat(a, b) { return String(a).localeCompare(String(b), 'en', { numeric: true }); }

// Group keys of the tab on screen, by position: headers carry the index, not the key, so a PO
// or invoice number never has to be escaped into an attribute selector.
var GROUP_KEYS = [];
function foldCls(key) { return isFolded(key) ? ' is-folded' : ''; }
function groupToggle(i, label) {
  return '<button type="button" class="gtoggle" aria-expanded="' + !isFolded(GROUP_KEYS[i]) + '">' + esc(label) + '</button>';
}
/* The top row of every grouped tab is ONE toolbar: filter chips and the sort menu scroll
   sideways inside it, and the collapse/expand-all button is pinned to its right end. */
function sortSelectHtml() {
  var opts = GROUP_SORTS[VIEW];
  if (!opts) return '';
  var cur = groupSort();
  return '<label class="tb-sort"><span class="sr-only">Sort</span><span aria-hidden="true">⇅</span><select id="groupSort" aria-label="Sort groups">' +
    opts.map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select></label>';
}
/* Collapse / expand all lives in the HEADER beside the freshness time (one static button),
   so it is always in the same place. Shown only while the tab on screen has groups. Icons:
   arrows pointing in = collapse, pointing out = expand; the word is beside them on wider
   screens and in the tooltip / aria-label everywhere. */
var FOLD_ICON_IN = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2l4 4 4-4M4 14l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var FOLD_ICON_OUT = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 6l4-4 4 4M4 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function syncFoldBtn() {
  var b = document.getElementById('foldAll');
  if (!b) return;
  var grouped = !!document.querySelector('#main [data-gh]');
  b.hidden = !grouped;
  if (!grouped) return;
  var anyOpen = GROUP_KEYS.some(function (k) { return !isFolded(k); });
  var label = anyOpen ? 'Collapse all' : 'Expand all';
  if (b.dataset.state === label) return;
  b.dataset.state = label;
  b.title = label; b.setAttribute('aria-label', label);
  b.innerHTML = (anyOpen ? FOLD_ICON_IN : FOLD_ICON_OUT) + '<span class="fold-lbl">' + label + '</span>';
}
function toolbarHtml(inner) {
  return '<div class="toolbar"><div class="tb-scroll">' + inner + '</div></div>';
}
// Folding is done in place, not by re-rendering: a re-render resets the scroll position, and
// the reader is usually halfway down the list when they fold the group they just finished.
function bindGroupControls(mainEl) {
  mainEl.querySelectorAll('[data-gh]').forEach(function (h) {
    h.addEventListener('click', function () {
      var i = h.dataset.gh, key = GROUP_KEYS[i];
      var fold = !isFolded(key);
      setFolded(key, fold);
      mainEl.querySelectorAll('[data-gm="' + i + '"]').forEach(function (el) { el.classList.toggle('is-folded', fold); });
      mainEl.querySelectorAll('[data-gh="' + i + '"] .gtoggle').forEach(function (b) { b.setAttribute('aria-expanded', String(!fold)); });
      syncFoldBtn();
    });
  });
  var gs = mainEl.querySelector('#groupSort');
  if (gs) gs.addEventListener('change', function () { PREFS.sort[VIEW] = gs.value; savePrefs(); render(); });
}

var LAST_OK = null;      // Date of the last successful fetch — the freshness stamp's source.
var LAST_ERROR = '';     // Why the last attempt failed, so the message can name the cause.
var SERVING_STALE = false; // True when the worker fell back to its last-good copy.

function colorFor(machine) { return PALETTE[machine] || 'var(--mx)'; }

/* Product colour → hex. Keyed on the sheet's own strings, upper-cased and trimmed so a stray
   space or a lowercase entry still matches. Deliberately NOT a CSS named-colour lookup: the
   sheet says GOLDEN and SILVER, which CSS does not know, and letting the browser guess would
   silently render some products as black. Anything unmapped gets the neutral chip instead —
   an honest "no colour assigned" beats a confident wrong one. */
var PRODUCT_COLORS = {
  BLACK: '#1c1c1e', GREY: '#9195a1', SILVER: '#c7ccd6',
  GREEN: '#2f8f4e', MAROON: '#7d2233', GOLDEN: '#c8952a',
  // Added 2026-11-17 so every colour on the sheet has a block (these four were plain text).
  BLUE: '#2563eb', RED: '#dc2626', WHITE: '#ffffff', YELLOW: '#facc15'
};
function productHex(name) {
  return PRODUCT_COLORS[String(name == null ? '' : name).trim().toUpperCase()] || '';
}
/* Silver and gold are metals, and a flat grey/ochre read as GREY and a muddy yellow. They get
   a brushed-metal gradient (light → dark → bright highlight → dark) wherever a colour fills a
   surface: code chips and colour blocks. Ink and the card's edge bar still use the flat hex. */
var METALLIC = {
  SILVER: 'linear-gradient(135deg,#f4f6f9 0%,#b9c0ca 28%,#ffffff 48%,#9aa2ae 70%,#dfe3e8 100%)',
  GOLDEN: 'linear-gradient(135deg,#fff3c2 0%,#d9a82e 28%,#fff0a8 48%,#a87912 72%,#e8c25a 100%)'
};
function productFill(name) {
  return METALLIC[String(name == null ? '' : name).trim().toUpperCase()] || productHex(name);
}
/* Ink chosen by measured WCAG contrast, never fixed. White text is legible on BLACK (17.0:1)
   and MAROON (9.8:1) but not on SILVER (1.6:1) or GOLDEN (2.7:1); GREEN is the case that
   proves the point — 4.07:1 on white FAILS AA, 4.64:1 on near-black passes. Every current
   product colour clears AA once the ink is picked this way. */
function relLum(hex) {
  var v = [1, 3, 5].map(function (i) {
    var c = parseInt(hex.slice(i, i + 2), 16) / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });

}
function inkOn(hex) {
  var l = relLum(hex);
  var onWhite = 1.05 / (l + 0.05);

}
/* The swatch is decoration; the colour NAME stays in the DOM as the fact. Unmapped values get
   .is-unknown, which is a dashed grey ring rather than a filled block, so "we don't know this
   colour" never looks like "this product is grey". */
/* The product CODE chip is itself the swatch — the colour fills the chip the reader is
   already looking at, instead of adding a second object beside it. The colour NAME still
   travels in the title and, on mobile, as its own metric cell: a filled chip alone is
   unreadable to a colour-deficient reader and unsearchable by text. */
function codeChipHtml(code, colorName, cls, gotoCode) {
  var hex = productHex(colorName);
  var label = String(colorName == null ? '' : colorName).trim();
  var style = hex ? ' style="background:' + productFill(colorName) + ';color:' + inkOn(hex) + ';border-color:' + hex + '"' : '';
  var attrs = gotoCode ? gotoAttrs(gotoCode, label) : (label ? ' title="' + esc(label) + '"' : '');
  return '<span class="' + cls + (hex ? ' is-tinted' : '') + '"' + style + attrs + '>' + esc(code) + '</span>';
}
/* Open board, every tab but By Product: a product's code and name open By Product at that
   product, so all its POs are seen together. Delegated from #main (see gotoProduct). */
function gotoAttrs(code, note) {
  return ' data-goto="' + esc(code) + '" role="link" tabindex="0" title="'
    + esc((note ? note + ' · ' : '') + 'Show all POs of ' + code) + '"';
}
function canGoto() {
  return (MODE === 'open' && VIEW !== 'product') || MODE === 'reports' || MODE === 'products';
}
function fmtNum(n) { var v = Number(n); return isFinite(v) ? Math.round(v).toLocaleString('en-IN') : '—'; }
/* Locale is pinned to en-IN rather than the device default: a manager whose phone is set to
   US locale was reading dates in a different order from the planner's sheet, on a surface
   whose whole job is agreeing with that sheet. */
function fmtDate(d) { return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }); }
function fmtDay(d) { return d.getDate(); }
function fmtMon(d) { return d.toLocaleDateString('en-IN', { month: 'short' }); }

/* Every value below comes from a hand-edited Google Sheet and is written into innerHTML.
   Unescaped, an apostrophe in a product name breaks the render, and anyone with edit access
   to the sheet can run script in every viewer's browser — including on the owner's phone,
   on a URL with no authentication. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function groupKeyFns() {
  return {
    po: { key: function (r) { return r.po; }, label: function (r) { return r.po; } },
    product: { key: function (r) { return r.code; }, label: function (r) { return r.code + ' — ' + r.name; } },
    machine: { key: function (r) { return r.machine; }, label: function (r) { return 'Machine ' + r.machine; } },
    color: { key: function (r) { return r.color; }, label: function (r) { return r.color; } },
  };
}

function sumRows(rows) {
  return rows.reduce(function (a, r) {
    a.orderQty += r.orderQty; a.supplied += r.supplied; a.readyStock += r.readyStock; a.balance += r.balance;
    a.rmReq += r.rmReq; a.mb += r.mb;
    return a;
  }, { orderQty: 0, supplied: 0, readyStock: 0, balance: 0, rmReq: 0, mb: 0 });
}

/* Reports how old the data is, in three bands. A shared tablet left open all shift used to
   show morning's plan under a pulsing "live" dot with no way to tell — this is the fix for
   that, and it is why the dot is now driven by measured age instead of a CSS animation. */
function paintFreshness() {
  var box = document.getElementById('clock');
  var text = document.getElementById('freshText');
  if (!LAST_OK) return;
  var mins = Math.floor((Date.now() - LAST_OK.getTime()) / 60000);
  var stamp = LAST_OK.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  // Paused is a different fact from stale, and the user can act on it: say so plainly and
  // name the gesture that resumes. Silently freezing would be the same lie as the old
  // pulsing "live" dot over data that never refreshed.
  var paused = (typeof pollingWanted === 'function') && !pollingWanted() && !document.hidden;
  var label;
  if (SERVING_STALE) label = 'Server busy — showing ' + stamp + ' data';
  else if (paused) label = 'Paused at ' + stamp + ' — click to refresh';
  else if (mins < 1) label = 'Updated just now';
  else if (mins < 60) label = 'Updated ' + mins + ' min ago';
  else label = 'Updated ' + stamp + ' — may be out of date';
  // Normal case: just the time beside the dot (the words are in the tooltip), so the stamp
  // fits in the header row instead of taking a row of its own. Anything the reader must act
  // on — stale, paused, server busy — still spells itself out.
  text.innerHTML = (SERVING_STALE || paused || mins >= 60)
    ? esc(label)
    : '<span class="fresh-lbl">' + esc(label) + ' </span><b>' + esc(stamp) + '</b>';
  box.title = label + ' — tap to refresh';
  box.classList.toggle('is-fresh', !SERVING_STALE && !paused && mins < 5);
  box.classList.toggle('is-aging', !SERVING_STALE && !paused && mins >= 5 && mins < 30);
  box.classList.toggle('is-stale', SERVING_STALE || paused || mins >= 30);
}

function applyFilter(rows, skipMachine) {
  // Nothing left to dispatch is nothing to show. A row whose Balance has reached zero is
  // complete, and a negative one is over-supplied — neither is work the board exists to
  // schedule, and together they were 16 of 70 rows, pushing live jobs off the screen.
  //
  // This reverses an earlier decision to keep negative balances visible on the grounds that
  // over-supply is a real state. It still is — but the sheet is where it should be reviewed,
  // not the shop-floor board. Note the consequence: the group subtotals and the grand total
  // now count only outstanding work, so they will NOT agree with the sheet's own column
  // totals. That is the intended reading of this board, but it is a real difference.
  //
  // A blank or non-numeric Balance is KEPT: it means "not yet computed", not "nothing due",
  // and hiding it would repeat the fault where a mid-recalculation NaN silently dropped rows.
  rows = rows.filter(function (r) {
    var b = Number(r.balance);
    return !isFinite(b) || b > 0;
  });
  if (PICKED.length) rows = rows.filter(function (r) { return isPicked(r.code); });
  if (MODE === 'open') rows = rows.filter(passesOpenFilter);
  if (FILTER) {
    var q = FILTER.toLowerCase();
    // PO is searchable too — By PO is the default view, yet filtering by a PO number used to
    // return nothing.
    rows = rows.filter(function (r) {
      return String(r.code).toLowerCase().indexOf(q) !== -1
        || String(r.name).toLowerCase().indexOf(q) !== -1
        || String(r.po).toLowerCase().indexOf(q) !== -1;
    });
  }
  // The machine key is built from the rows BEFORE this step (skipMachine), or ticking one
  // machine would make every other pill vanish.
  if (!skipMachine && hasMachineSel()) {
    rows = rows.filter(function (r) { return MACHINE_SEL[String(r.machine)]; });
  }
  return rows;
}

var DATE_COLS = [];

function computeDateCols(rows) {
  var withDates = rows.filter(function (r) { return r.start && r.end; });
  // Timeline start = the sheet's own grid start (first date column after Month), sent as
  // GRID_START. This mirrors the sheet EXACTLY — same day, no timezone drift. Fall back to
  // IST-today only if the sheet didn't send it.
  var msDay = 86400000;

  // TODAY must sit on the SAME instant-of-day as the grid's columns, or the equality test
  // that highlights it can never be true. gridStart arrives as IST midnight (18:30 UTC the
  // previous day), while a UTC-midnight TODAY is 5.5 hours adrift — so every column missed
  // and the today marker simply never appeared.
  //
  // Anchor on gridStart and step whole days from it: whatever offset the sheet's day
  // boundary uses, today lands exactly on a column.
  var nowIst = new Date(Date.now() + 5.5 * 3600 * 1000);
  var istMidnightUtc = Date.UTC(nowIst.getUTCFullYear(), nowIst.getUTCMonth(), nowIst.getUTCDate())
    - 5.5 * 3600 * 1000;

  if (GRID_START) {
    // Round to the nearest whole day from gridStart so DST-free IST arithmetic stays exact.
    var daysFromStart = Math.round((istMidnightUtc - GRID_START.getTime()) / msDay);
    TODAY = new Date(GRID_START.getTime() + daysFromStart * msDay);
  } else {
    TODAY = new Date(istMidnightUtc);
  }

  var gridStart = GRID_START || TODAY;
  var minD = gridStart, maxD = new Date(gridStart.getTime() + 14 * msDay);
  if (withDates.length) {
    var ends = withDates.map(function (r) { return new Date(r.end); });
    minD = gridStart;
    maxD = new Date(Math.max.apply(null, ends.concat([gridStart])));
  }
  // Hard ceiling. maxD comes from sheet data, so a single end date mistyped as 2027 would
  // otherwise generate ~500 day columns on every row and hang the browser — a typo in one
  // cell must not be able to take the board down.
  var MAX_DAYS = 120;
  var days = Math.max(1, Math.round((maxD - minD) / msDay)) + 1;
  if (days > MAX_DAYS) days = MAX_DAYS;
  var cols = [];
  for (var i = 0; i < days; i++) cols.push(new Date(minD.getTime() + i * msDay));
  DATE_COLS = cols;
}

/* Day number on its own line, month printed only when it changes — the same pattern the
   mobile grid already used. Replaces rotated 10px text that could not be read at the
   distance a wall-mounted tablet is actually viewed from. */
/* Months can be folded: a folded month is ONE column instead of ~30, holding a bar with the
   first–last scheduled day of that month. The month label in the header is the toggle, and
   the "Months" chip folds or opens them all. Session only (not stored). */
var MONTH_FOLD = {};
function monKey(d) { return d.getFullYear() + '-' + d.getMonth(); }
// Day columns grouped for rendering: an open month gives one segment per day, a folded month
// one segment holding all its days.
function dateSegs() {
  var segs = [], cur = null;
  DATE_COLS.forEach(function (d) {
    var k = monKey(d);
    if (!MONTH_FOLD[k]) { segs.push({ days: [d], key: k, folded: false }); cur = null; return; }
    if (!cur || cur.key !== k) { cur = { days: [], key: k, folded: true }; segs.push(cur); }
    cur.days.push(d);
  });
  return segs;
}
function monthKeys() { return uniqueSorted(DATE_COLS.map(monKey)); }
function allMonthsFolded() {
  var ks = monthKeys();
  return ks.length > 0 && ks.every(function (k) { return MONTH_FOLD[k]; });
}
function isTodayIn(days) { return days.some(function (d) { return d.getTime() === TODAY.getTime(); }); }

function dateHeaderHtml() {
  var lastMon = null;
  return dateSegs().map(function (sg) {
    var d = sg.days[0];
    var mon = fmtMon(d);
    var today = isTodayIn(sg.days) ? ' is-today' : '';
    if (sg.folded) {
      lastMon = mon;
      return '<th class="date-th is-month' + today + '" scope="col"><button type="button" class="dmon-btn" data-mfold="' +
        sg.key + '" aria-expanded="false" title="Show the days of ' + esc(mon) + '">' + esc(mon) + ' ▸</button></th>';
    }
    var showMon = (mon !== lastMon);
    lastMon = mon;
    return '<th class="date-th' + today + '" scope="col">'
      + (showMon ? '<button type="button" class="dmon dmon-btn" data-mfold="' + sg.key + '" aria-expanded="true" title="Fold ' +
        esc(mon) + ' into one column">' + esc(mon) + '</button>' : '<span class="dmon"></span>')
      + fmtDay(d) + '</th>';
  }).join('');
}

function dateCellsHtml(r) {
  var segs = dateSegs();
  if (!r.start || !r.end) {
    return segs.map(function (sg) { return '<td class="date-td' + (sg.folded ? ' is-month' : '') + '"></td>'; }).join('');
  }
  var s = new Date(r.start), e = new Date(r.end);
  var color = colorFor(r.machine);
  var firstActive = true;
  return segs.map(function (sg) {
    var cls = 'date-td' + (isTodayIn(sg.days) ? ' is-today-col' : '') + (sg.folded ? ' is-month' : '');
    var act = sg.days.filter(function (d) { return d >= s && d < e; });
    if (!act.length) return '<td class="' + cls + '"></td>';
    if (sg.folded) {
      var first = firstActive ? '<span class="mnum">' + esc(r.machine) + '</span>' : '';
      firstActive = false;
      return '<td class="' + cls + '"><span class="date-fill month-fill" style="background:' + color + '" title="' +
        esc('M' + r.machine + ' · ' + r.code + ': ' + fmtDate(act[0]) + '–' + fmtDate(act[act.length - 1])) + '">' + first +
        '<small>' + fmtDay(act[0]) + (act.length > 1 ? '–' + fmtDay(act[act.length - 1]) : '') + '</small></span></td>';
    }
    // Machine number printed in the bar's first cell: colour alone cannot be read by the
    // ~8% of the floor with red-green deficiency, and the legend is off-screen once the
    // planner has scrolled. The hue stays for fast pattern-scanning; the digit is the fact.
    var label = firstActive ? '<span class="mnum">' + esc(r.machine) + '</span>' : '';
    firstActive = false;
    return '<td class="' + cls + '"><span class="date-fill" style="background:' + color + '" title="'
      + esc('M' + r.machine + ' · ' + r.code + ': ' + fmtDate(s) + '–' + fmtDate(e))
      + '">' + label + '</span></td>';
  }).join('');
}

function proportionalBar(r) {
  if (!r.start || !r.end || !DATE_COLS.length) return '<span class="cbar-empty">not scheduled</span>';
  var rangeStart = DATE_COLS[0].getTime();
  var totalMs = DATE_COLS[DATE_COLS.length - 1].getTime() - rangeStart + 86400000;
  function pct(d) { return Math.max(0, Math.min(100, ((d - rangeStart) / totalMs) * 100)); }
  var s = new Date(r.start), e = new Date(r.end);
  var left = pct(s.getTime()), width = Math.max(1.5, pct(e.getTime()) - left);
  var todayPct = pct(TODAY.getTime());
  var todayMark = (todayPct >= 0 && todayPct <= 100) ? '<div class="today-mark" style="left:' + todayPct + '%"></div>' : '';
  return '<div class="prop-bar">' + todayMark +
    '<div class="fill" style="left:' + left + '%;width:' + width + '%;background:' + colorFor(r.machine) + '"></div></div>';
}

// Extra-compact mobile timeline: a slim bar positioned across the whole date range, with a start
// dot + end dot and their dates labelled inline. One line, no horizontal scroll.
function compactBar(r) {
  if (!r.start || !r.end || !DATE_COLS.length) {
    return '<div class="cbar-empty">not scheduled</div>';
  }
  var rangeStart = DATE_COLS[0].getTime();
  var totalMs = DATE_COLS[DATE_COLS.length - 1].getTime() - rangeStart + 86400000;
  function pct(t) { return Math.max(0, Math.min(100, ((t - rangeStart) / totalMs) * 100)); }
  var s = new Date(r.start), e = new Date(r.end);
  var left = pct(s.getTime()), right = pct(e.getTime());
  var width = Math.max(2, right - left);
  var color = colorFor(r.machine);
  var todayPct = pct(TODAY.getTime());
  var todayMark = (todayPct >= 0 && todayPct <= 100)
    ? '<i class="cbar-today" style="left:' + todayPct + '%"></i>' : '';
  return '<div class="cbar">' +
    '<span class="cbar-lbl start is-filled">' + fmtDate(s) + '</span>' +
    '<div class="cbar-track">' + todayMark +
      '<div class="cbar-fill" style="left:' + left + '%;width:' + width + '%;background:' + color + '"></div>' +
      '<i class="cbar-dot" style="left:' + left + '%;background:' + color + '"></i>' +
      '<i class="cbar-dot" style="left:' + right + '%;background:' + color + '"></i>' +
    '</div>' +
    '<span class="cbar-lbl end is-filled">' + fmtDate(e) + '</span>' +
  '</div>';
}

// The Open board's groups, in display order. Shared with the download so the file is grouped
// and ordered exactly like the screen.
// `unplanned` (not started, not planned) is always one group at the very bottom, whatever the
// tab or sort: it has no machine, no priority and no dates to sort or group it by.
var UNPLANNED_KEY = '~unplanned';
// The unplanned group mixes POs, and By PO otherwise names the PO only in the group header,
// so each of its lines shows its own PO. Short form on screen, full number on hover.
function poTag(r) {
  var full = String(r.po || '');
  if (!full) return '';
  return ' <span class="po-tag" title="' + esc(full) + '">PO ' + esc(full.split('/').pop()) + '</span>';
}
function openGroups(rows, unplanned) {
  var g = groupKeyFns()[VIEW];
  var groups = {};
  var order = [];
  rows.forEach(function (r) {
    var k = g.key(r);
    if (!groups[k]) { groups[k] = { label: g.label(r), rows: [] }; order.push(k); }
    groups[k].rows.push(r);
  });
  sortOpenOrder(order, groups);
  order.forEach(function (k) { groups[k].rows.sort(openRowCmp); });
  if (unplanned && unplanned.length) {
    groups[UNPLANNED_KEY] = { label: 'Not started · not planned', rows: unplanned.slice().sort(function (a, b) {
      return cmpNat(b.po, a.po) || cmpNat(a.code, b.code);
    }) };
    order.push(UNPLANNED_KEY);
  }
  return { groups: groups, order: order };
}

// Rows inside a group. By PO lists its products by code; By Product lists its POs newest
// first. Machine and Colour keep the planner's Priority order, which is the run sequence.
function openRowCmp(a, b) {
  if (VIEW === 'po') return cmpNat(a.code, b.code);
  if (VIEW === 'product') return cmpNat(b.po, a.po);
  return (a.priority || 999) - (b.priority || 999);
}

function earliestStart(rows) {
  return rows.reduce(function (m, r) { return r.start && (!m || r.start < m) ? r.start : m; }, '');
}

// numeric:true (cmpNat) so PO-10 sorts after PO-9 rather than before it.
function sortOpenOrder(order, groups) {
  if (VIEW === 'machine') { order.sort(function (a, b) { return Number(a) - Number(b); }); return; }
  if (VIEW === 'color') { order.sort(cmpNat); return; }
  var s = groupSort();
  var bal = function (k) { return sumRows(groups[k].rows).balance; };
  var start = function (k) { return earliestStart(groups[k].rows) || '9999'; };
  order.sort(function (a, b) {
    if (s === 'bal') return bal(b) - bal(a) || cmpNat(a, b);
    if (s === 'start') return start(a) < start(b) ? -1 : start(a) > start(b) ? 1 : cmpNat(a, b);
    if (s === 'old' || s === 'code') return cmpNat(a, b);
    return cmpNat(b, a);   // 'new'
  });
}

function render() {
  renderView();
  syncFoldBtn();
}
document.getElementById('foldAll').addEventListener('click', function () {
  var fold = GROUP_KEYS.some(function (k) { return !isFolded(k); });
  FOLDED[VIEW] = {};
  if (fold) GROUP_KEYS.forEach(function (k) { setFolded(k, true); });
  render();
});
function renderView() {
  if (MODE === 'done') { renderCompleted(); return; }
  if (MODE === 'reports') { renderTestReports(); return; }
  if (MODE === 'products') { renderProductMaster(); return; }
  var g = groupKeyFns()[VIEW];
  var filteredRows = applyFilter(ROWS);
  var unplannedRows = applyFilter(UNPLANNED);
  var showRmMb = VIEW === 'color';

  computeDateCols(filteredRows);
  MACHINES_SEEN = Array.from(new Set(applyFilter(ROWS, true).map(function (r) { return r.machine; }))).sort(function (a, b) { return a - b; });

  var grouped = openGroups(filteredRows, unplannedRows);
  var groups = grouped.groups;
  var link = canGoto();
  // By Product names the product in the group header, so its rows name the PO instead.
  var showPo = function (k) { return k === UNPLANNED_KEY || VIEW === 'product'; };
  var nameAttrs = function (r) { return link ? gotoAttrs(r.code) : ''; };
  var order = grouped.order;
  GROUP_KEYS = order.slice();
  // Header line for a group: count, and what is still to make, so a folded group still says
  // whether it matters.
  var groupSub = function (grp) {
    var n = grp.rows.length;
    return n + ' item' + (n === 1 ? '' : 's') + ' · ' + fmtNum(sumRows(grp.rows).balance) + ' left';
  };

  var grand = sumRows(filteredRows.concat(unplannedRows));

  if (!order.length) {
    // An empty schedule and a filter that matched nothing are different facts. Saying
    // "no rows match" when the sheet is simply empty sends the reader hunting for a filter
    // that isn't set.
    // Three different facts, three different messages. "No jobs scheduled" when the sheet is
    // actually full of completed rows would send the reader looking for missing data.
    var emptyMsg;
    if (selCount(OPEN_F, OPEN_F_KEYS)) {
      emptyMsg = '<div class="empty">No open jobs match the filters.' +
        ' <button type="button" class="linkish" id="openReset">Clear filters</button></div>';
    } else if (PICKED.length) {
      emptyMsg = '<div class="empty">No open lines for ' + esc(PICKED.join(', ')) + (hasMachineSel() ? ' on machine ' + esc(machineSelText()) : '') + '.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear products</button></div>';
    } else if (FILTER) {
      emptyMsg = '<div class="empty">No jobs match “' + esc(FILTER) + '”.'
        + ' <button type="button" class="linkish" id="emptyClear">Clear filter</button></div>';
    } else if (hasMachineSel()) {
      emptyMsg = '<div class="empty">No open jobs on machine ' + esc(machineSelText()) + '.'
        + ' <button type="button" class="linkish" id="emptyMachines">Show all machines</button></div>';
    } else if (ROWS.length) {
      emptyMsg = '<div class="empty">Nothing outstanding — every job on the sheet is fully supplied.</div>';
    } else {
      emptyMsg = '<div class="empty">No jobs scheduled.</div>';
    }
    var mainEl = document.getElementById('main');
    mainEl.innerHTML = emptyMsg;
    mainEl.setAttribute('aria-busy', 'false');
    var ec = document.getElementById('emptyClear');
    if (ec) ec.addEventListener('click', clearFilter);
    var em = document.getElementById('emptyMachines');
    if (em) em.addEventListener('click', function () { MACHINE_SEL = {}; render(); });
    bindOpenFilters(mainEl);
    return;
  }

  // Chip values come from every outstanding line, not the filtered ones, so picking BLACK
  // does not make the other colours vanish.
  var pool = ROWS.concat(UNPLANNED).filter(function (r) { var b = Number(r.balance); return !isFinite(b) || b > 0; });
  // ---- one toolbar: filters · sort · months · machine key · today, collapse pinned right.
  // The machine key IS the machine filter (multi-select) and also maps bar colour to machine.
  var tb = openFilterChips() + sortSelectHtml() +
    chip('id="monthFold" title="Fold the timeline into one column per month"', '<span aria-hidden="true">▦</span> Months', allMonthsFolded()) +
    '<span class="chip-sep" aria-hidden="true"></span>';
  MACHINES_SEEN.forEach(function (m) {
    var on = !!MACHINE_SEL[String(m)];
    tb += '<button type="button" class="chip mchip' + (on ? ' on' : '') + '" data-machine="' + esc(m) +
      '" aria-pressed="' + on + '" aria-label="Machine ' + esc(m) + '"><i style="background:' + colorFor(m) + '"></i>M' + esc(m) + '</button>';
  });
  if (hasMachineSel()) {
    tb += '<button type="button" class="chip chip-clear" id="machineClear"><span aria-hidden="true">✕</span> All machines</button>';
  }
  tb += '<button type="button" class="jump-today" id="jumpToday"><i class="today-dot" aria-hidden="true"></i>Today</button>';
  var html = '<div class="legend">' + toolbarHtml(tb) + openFilterPanel(pool) + '</div>' + openTotalsHtml(grand, showRmMb);

  // Full words, not "Sup"/"D" — the abbreviations were unglossable and inconsistent with the
  // other two renderings, which spelled the same metrics differently again.
  var extraTh = showRmMb ? '<th scope="col">RM Req</th><th scope="col">MB</th>' : '';
  var dateHeader = dateHeaderHtml();
  var segCount = dateSegs().length;
  var totalCols = 7 + (showRmMb ? 2 : 0) + segCount;

  // ---- desktop: single unified table ----
  html += '<div class="table-scroll"><table><thead><tr>' +
    '<th scope="col">Code</th><th scope="col">Item</th><th scope="col">Qty</th>'
    + '<th scope="col">Supplied</th><th scope="col">Ready</th><th scope="col">Balance</th>'
    + extraTh + '<th scope="col">Days</th>' + dateHeader +
    '</tr></thead><tbody>';
  order.forEach(function (k, gi) {
    var grp = groups[k];
    var sub = sumRows(grp.rows);
    var gm = ' data-gm="' + gi + '"', fc = foldCls(k);
    // .gh-pin holds the header to the left edge: the board opens scrolled sideways to today,
    // which otherwise leaves the PO name and its fold button off-screen.
    html += '<tr class="group-row" data-gh="' + gi + '"><td colspan="' + totalCols + '"><div class="gh-pin"><span>' + groupToggle(gi, grp.label) + '</span>' +
      '<span class="sub">' + groupSub(grp) + '</span></div></td></tr>';
    grp.rows.forEach(function (r) {
      var extraTd = showRmMb ? '<td class="num">' + fmtNum(r.rmReq) + '</td><td class="num">' + fmtNum(r.mb) + '</td>' : '';
      html += '<tr' + gm + (fc ? ' class="' + fc.trim() + '"' : '') + '><td class="data-col">' + codeChipHtml(r.code, r.color, 'code-chip', link && r.code) + '</td>' +
        '<td class="data-col"><span' + nameAttrs(r) + '>' + esc(r.name) + '</span>' + (showPo(k) ? poTag(r) : '') + '</td>' +
        '<td class="num">' + fmtNum(r.orderQty) + '</td><td class="num' + zeroCls(r.supplied) + '">' + fmtNum(r.supplied) + '</td>' +
        '<td class="num' + zeroCls(r.readyStock) + '">' + fmtNum(r.readyStock) + '</td>' +
        '<td class="num' + (Number(r.balance) < 0 ? ' is-neg' : '') + '">' + fmtNum(r.balance) + '</td>' + extraTd +
        '<td class="num">' + esc(r.days || '—') + '</td>' + dateCellsHtml(r) + '</tr>';
    });
    var extraTf = showRmMb ? '<td class="num">' + fmtNum(sub.rmReq) + '</td><td class="num">' + fmtNum(sub.mb) + '</td>' : '';
    var dateFootCells = new Array(segCount + 1).join('<td class="date-td"></td>');
    html += '<tr class="subtotal-row"><td colspan="2">Subtotal</td>' +
      '<td class="num">' + fmtNum(sub.orderQty) + '</td><td class="num">' + fmtNum(sub.supplied) + '</td>' +
      '<td class="num">' + fmtNum(sub.readyStock) + '</td>' +
      '<td class="num">' + fmtNum(sub.balance) + '</td>' + extraTf + '<td></td>' + dateFootCells + '</tr>';
  });
  html += '</tbody></table></div>';

  // ---- tablet: proportional single-bar rows, still dense/tabular ----
  html += '<div class="tablet-cards">';
  // One label row for the whole list — a sibling of the groups, for the same reason as the
  // mobile row above: sticky cannot escape its parent, so a per-group row would pin only
  // within its own group and stack with every other group's copy.
  html += '<div class="tcard-head">' +
    '<div>Item</div><div>Qty</div><div>Supplied</div><div>Ready</div>' +
    '<div>Balance</div><div>Days</div><div>Timeline</div></div>';
  order.forEach(function (k, gi) {
    var grp = groups[k];
    var sub = sumRows(grp.rows);
    html += '<div class="tcard-group" data-gh="' + gi + '"><span>' + groupToggle(gi, grp.label) + '</span><span class="sub">' + groupSub(grp) + '</span></div>';
    grp.rows.forEach(function (r) {
      var tHex = productHex(r.color);
      html += '<div class="tcard' + foldCls(k) + '" data-gm="' + gi + '"' + (tHex ? ' style="--pc:' + tHex + '"' : '') + '>' +
        '<span class="code">' + codeChipHtml(r.code, r.color, 'code-chip', link && r.code) +
        '<small><span' + nameAttrs(r) + '>' + esc(r.name) + '</span>' + (showPo(k) ? poTag(r) : '') + '</small></span>' +
        '<span class="val"><span class="lbl">Qty</span>' + fmtNum(r.orderQty) + '</span>' +
        '<span class="val"><span class="lbl">Supplied</span>' + fmtNum(r.supplied) + '</span>' +
        '<span class="val"><span class="lbl">Ready</span>' + fmtNum(r.readyStock) + '</span>' +
        '<span class="val' + (Number(r.balance) < 0 ? ' is-neg' : '') + '"><span class="lbl">Balance</span>' + fmtNum(r.balance) + '</span>' +
        '<span class="val"><span class="lbl">Days</span>' + esc(r.days || '—') + '</span>' +
        proportionalBar(r) +
        '</div>';
    });
    // Eight cells to match .tcard's eight tracks: label, the five metrics, then the bar
    // column left empty. Days has no meaningful total.
    html += '<div class="tcard-sub">' +
      '<span class="lead">Subtotal</span>' +
      '<span class="val">' + fmtNum(sub.orderQty) + '</span>' +
      '<span class="val">' + fmtNum(sub.supplied) + '</span>' +
      '<span class="val">' + fmtNum(sub.readyStock) + '</span>' +
      '<span class="val">' + fmtNum(sub.balance) + '</span>' +

      '<span></span>' +
      '</div>';

  //
  // ONE definition of the columns, used by the sticky header, every card, and the subtotal.
  // Previously each of the three emitted its own cells and they had to be kept in step by
  // hand — which they were not: Color view carried seven cells per card against a five-cell
  // subtotal, so every total sat under the wrong figure.
  //
  // Repeating "Qty / Supplied / Ready / …" inside all ~40 cards is what forced the grid to
  // 58px minimum tracks and made 7 columns wrap to 5+2 on a 360px phone. The labels move to
  // ONE sticky row per group, so the cells only have to fit a number and the whole row lands
  // on one line — which is also what makes the card and its subtotal line up.
  var cols = [
    { label: 'Qty', cell: function (r) { return '<b>' + fmtNum(r.orderQty) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.orderQty) + '</b>'; } },
    { label: 'Supplied', cell: function (r) { return '<b>' + fmtNum(r.supplied) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.supplied) + '</b>'; } },
    { label: 'Ready', cell: function (r) { return '<b>' + fmtNum(r.readyStock) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.readyStock) + '</b>'; } },
    { label: 'Balance',
      cell: function (r) { return '<b' + (Number(r.balance) < 0 ? ' class="is-neg"' : '') + '>' + fmtNum(r.balance) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.balance) + '</b>'; } },
    { label: 'Days', cell: function (r) { return '<b>' + esc(r.days || '—') + '</b>'; } },
  ];
  if (showRmMb) {
    cols.push({ label: 'RM Req', cell: function (r) { return '<b>' + fmtNum(r.rmReq) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.rmReq) + '</b>'; } });
    cols.push({ label: 'MB', cell: function (r) { return '<b>' + fmtNum(r.mb) + '</b>'; },
      total: function (s) { return '<b>' + fmtNum(s.mb) + '</b>'; } });
  } else {
    // Colour as text, since the card's left edge bar is unlabelled hue on its own. Dropped in
    // Color view, where the group header already names it and the two extra metrics need room.
    cols.push({ label: 'Color',
      cell: function (r) { return '<b>' + (String(r.color || '').trim() ? colourBlockHtml(r.color) : '—') + '</b>'; } });
  }
  // Fixed track count, not auto-fit: auto-fit re-flows to whatever fits, so the card and the
  // subtotal could resolve to different columns-per-row and stop lining up.
  // --cols also drives the column separators, which are painted as one repeating gradient at
  // the track pitch rather than as a border on every cell — same value, so the rules cannot
  // land anywhere but on the track edges.
  var colStyle = ' style="grid-template-columns:repeat(' + cols.length + ',1fr);--cols:' + cols.length + '"';
  var headCells = cols.map(function (c) { return '<div>' + esc(c.label) + '</div>'; }).join('');

  // The column labels pin for the WHOLE list (a sibling of the groups, emitted once), and each
  // group's name pins BELOW them for the length of that group, handing off to the next group as
  // it scrolls up. So the reader always has both: what the columns mean, and which group the
  // rows on screen belong to.
  // The two must occupy different offsets — when both sat at top:0 the group name covered the
  // labels, and a per-group copy of the labels stacked one pinned row per group.
  html += '<div class="cards">';
  html += '<div class="metric-head"' + colStyle + '>' + headCells + '</div>';
  order.forEach(function (k, gi) {
    var grp = groups[k];
    var sub = sumRows(grp.rows);
    html += '<div class="card-group-head" data-gh="' + gi + '"><span>' + groupToggle(gi, grp.label) + '</span><span class="sub">' + groupSub(grp) + '</span></div>';
    grp.rows.forEach(function (r) {
      // Machine chip: the mobile card's bar is a thin colour strip, far too small to identify
      // a machine by hue on a phone. The number states it. An unplanned line has no machine.
      var mch = String(r.machine || '').trim()
        ? '<span class="mch" style="background:' + colorFor(r.machine) + '">M' + esc(r.machine) + '</span>' : '';

      // PO number instead of repeating the product name.

      // in this view the group is one product, so every card under the header IS that colour —
      // the tint describes the row, not the PO number itself.
      var topLine = (VIEW === 'product')
        ? codeChipHtml(r.po, r.color, 'code') + mch
        // PO ahead of the name: the name is cut with an ellipsis on a narrow phone, and the PO
        // must survive the cut.
        : codeChipHtml(r.code, r.color, 'code', link && r.code) + mch + (k === UNPLANNED_KEY ? poTag(r) : '')
          + '<span class="name"' + nameAttrs(r) + '>' + esc(r.name) + '</span>';
      var mHex = productHex(r.color);
      html += '<div class="card' + foldCls(k) + '" data-gm="' + gi + '"' + (mHex ? ' style="--pc:' + mHex + '"' : '') + '>' +
        '<div class="card-top">' + topLine + '</div>' +
        '<div class="metric-row"' + colStyle + '>' +
        cols.map(function (c) { return '<div>' + c.cell(r) + '</div>'; }).join('') +
        '</div>' + compactBar(r) + '</div>';
    });
    // Mobile was the only rendering without a group subtotal — `sub` was computed and then
    // discarded — leaving the manager in transit, the person least able to add figures in
    // their head, as the only one asked to.
    // Driven by the SAME column list as the cards and the sticky header, so the three grids
    // cannot disagree about how many cells they hold. Columns with no meaningful total
    // (Days, Color) render empty rather than an invented number.
    html += '<div class="card-sub-label">Subtotal</div>' +
      '<div class="card-sub"' + colStyle + '>' +
      cols.map(function (c) { return '<div>' + (c.total ? c.total(sub) : '') + '</div>'; }).join('') +
      '</div>';
  });
  html += '</div>';

  var mainEl = document.getElementById('main');
  mainEl.innerHTML = html;
  mainEl.setAttribute('aria-busy', 'false');

  measureFrozenOffset();
  bindGroupControls(mainEl);
  bindOpenFilters(mainEl);
  var jt = document.getElementById('jumpToday');
  if (jt) jt.addEventListener('click', scrollToToday);
  mainEl.querySelectorAll('[data-machine]').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.dataset.machine;
      if (MACHINE_SEL[m]) delete MACHINE_SEL[m]; else MACHINE_SEL[m] = true;
      render();
    });
  });
  var mc = document.getElementById('machineClear');
  if (mc) mc.addEventListener('click', function () { MACHINE_SEL = {}; render(); });
  scrollToToday();
}

/* ---------------------------------------------------------------------------
   Completed view — lines taken off the plan, with OTD / OTIF.

   The sheet sends facts only (PO date, order qty, supplied, invoices with dates) plus the two
   Settings values; every rule lives here, once, so the three tabs and the KPI strip cannot
   disagree:
     due       = PO Date + lead time
     delivered = date of the LAST invoice on the line (a split delivery is late if its last
                 part is late)
     OTD       = delivered <= due
     in full   = supplied >= order qty x (1 - tolerance)
     OTIF      = OTD and in full
   A line with no invoice, an invoice whose date is not on the Invoices tab, or no Order Qty
   cannot be judged; it is counted separately rather than silently scored as a pass or a fail.
   Dates travel as 'yyyy-MM-dd' IST day strings and are compared as whole days.
   --------------------------------------------------------------------------- */
function dayNum(iso) {
  var p = String(iso).split('-');
  return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) / 86400000;
}
function isoFromDayNum(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function fmtIso(iso) {
  if (!iso) return '—';
  return new Date(dayNum(iso) * 86400000)
    .toLocaleDateString('en-IN', { day: '2-digit', month: 'short', timeZone: 'UTC' });
}
// Days against due, in words rather than signed numbers: "15d early", "31d late".
function fmtLate(n) {
  if (n === null) return '<span class="is-na">—</span>';
  if (n === 0) return '<span class="late-good">on due date</span>';
  return n > 0
    ? '<span class="late-bad">' + n + 'd late</span>'
    : '<span class="late-good">' + (-n) + 'd early</span>';
}
function pct(n, d) { return d ? Math.round((n / d) * 100) + '%' : '—'; }

// One badge per line instead of three Yes/No columns.
function statusBadge(l) {
  if (l.onPlan) return '<span class="st st-na">○ On plan</span>';
  if (l.status !== 'ok') return '<span class="st st-na">– ' + esc(l.status) + '</span>';
  if (l.otd && l.inFull) return '<span class="st st-good">✓ OTIF</span>';
  if (!l.otd && !l.inFull) return '<span class="st st-bad">✗ Late + Short</span>';
  return l.otd
    ? '<span class="st st-warn">◐ Short</span>'
    : '<span class="st st-warn">◷ Late</span>';
}

// Percentage tone: green at 95%+, amber 80–94%, red below 80%.
function pctTone(n, d) {
  if (!d) return 'st-na';
  var p = (n / d) * 100;
  return p >= 95 ? 'st-good' : p >= 80 ? 'st-warn' : 'st-bad';
}
function pctChip(label, n, d) {
  return '<span class="st ' + pctTone(n, d) + '">' + esc(label) + ' ' + pct(n, d) + '</span>';
}

function judgeLine(line, leadDays, tolerancePct) {
  var due = line.poDate ? isoFromDayNum(dayNum(line.poDate) + leadDays) : null;
  var inFull = line.orderQty > 0 ? line.supplied >= line.orderQty * (1 - tolerancePct / 100) : null;
  var status = 'ok';
  if (!line.invoices.length) status = 'no invoice';
  else if (line.invoices.some(function (i) { return !i.date; })) status = 'invoice date missing';
  else if (!due) status = 'no PO date';
  else if (!(line.orderQty > 0)) status = 'no order qty';
  var delivered = null, late = null, otd = null, otif = null;
  if (status === 'ok') {
    delivered = line.invoices.reduce(function (a, i) { return i.date > a ? i.date : a; }, '');
    late = dayNum(delivered) - dayNum(due);
    otd = late <= 0;
    otif = otd && inFull === true;
  }
  return { due: due, delivered: delivered, late: late, otd: otd, inFull: inFull, otif: otif, status: status };
}

function judgedLines() {
  var lead = COMPLETED.leadDays, tol = COMPLETED.tolerancePct;
  return COMPLETED.lines.map(function (l) {
    var j = judgeLine(l, lead, tol);
    Object.keys(l).forEach(function (k) { j[k] = l[k]; });
    // Still on the plan: not finished, so not judged. Any status but 'ok' keeps it out of every
    // OTD/OTIF count. Delivered still shows its latest invoice, for sorting and date filters.
    if (j.onPlan) {
      j.status = 'On plan';
      j.late = j.otd = j.otif = null;
      j.delivered = l.invoices.reduce(function (a, i) { return i.date && i.date > a ? i.date : a; }, '') || null;
    }
    return j;
  });
}

/* Filters for By Invoice / By PO / By Product. The date range applies to the delivered date
   (in By Invoice, each invoice's own date) or to the PO date. Dates are 'yyyy-MM-dd', so
   plain string comparison orders them correctly. */
var LIST_DEFAULT = { status: [], brand: [], type: [], color: [], machine: [], dateBy: 'delivered', from: '', to: '', preset: '', _panel: '' };
var LIST_MORE = ['brand', 'type', 'color', 'machine'];
var LIST = Object.assign({}, LIST_DEFAULT);

function inRange(day) {
  if (!LIST.from && !LIST.to) return true;
  if (!day) return false;
  return (!LIST.from || day >= LIST.from) && (!LIST.to || day <= LIST.to);
}

function passesList(l) {
  if (!inSel(LIST.status, statusWord(l))) return false;
  if (!inSel(LIST.brand, l.brand)) return false;
  if (!inSel(LIST.type, productType(l.code))) return false;
  if (!inSel(LIST.color, l.color)) return false;
  if (!inSel(LIST.machine, l.usualMachine)) return false;
  if (LIST.dateBy === 'po') return inRange(l.poDate);
  // By Invoice judges the range per invoice (see completedGroups); a line stays if any of
  // its invoices falls in it.
  if (VIEW === 'dinvoice') return !(LIST.from || LIST.to) || l.invoices.some(function (i) { return inRange(i.date); });
  return inRange(l.delivered);
}

/* ---------------------------------------------------------------------------
   Chip filters: one row of tap targets instead of a wall of dropdowns. Status and date
   presets are chips; the rarer filters (brand, type, colour, PO, sort, a custom date range)
   sit in a panel opened by a chip, with a count badge so nothing is filtered invisibly.
   --------------------------------------------------------------------------- */
var STATUS_ICONS = { 'OTIF': '✓', 'Late': '◷', 'Short': '◐', 'Late + Short': '✗', 'On plan': '○', 'Open line': '○' };

function chip(attrs, label, on, extraCls) {
  return '<button type="button" class="chip' + (on ? ' on' : '') + (extraCls ? ' ' + extraCls : '') + '" ' + attrs +
    ' aria-pressed="' + !!on + '">' + label + '</button>';
}

/* Multi-select chip filters, shared by every tab. A chip filter's value is an ARRAY of picked
   values; empty = no filter. Within one row the picks widen the list (BLACK or GOLDEN); across
   rows they narrow it (BLACK or GOLDEN, and machine 5). Arrays are replaced, never mutated, so
   a *_DEFAULT object can be shallow-copied safely. */
function inSel(sel, v) { return !sel || !sel.length || sel.indexOf(String(v)) !== -1; }
function isOnChip(state, key, v) { return (state[key] || []).indexOf(String(v)) !== -1; }
function selCount(state, keys) { return keys.filter(function (k) { return state[k] && state[k].length; }).length; }
function toggleSel(sel, v) {
  sel = sel || [];
  return sel.indexOf(v) === -1 ? sel.concat([v]) : sel.filter(function (x) { return x !== v; });
}
/* Always-open filters: line 1 is the toolbar, then a filter line of labelled chip groups
   ("TYPE Cap Bottle │ COLOUR ■■■■ …"). Lines WRAP onto another row rather than scrolling
   sideways (user's choice, 2026-11-17), so every option is visible at once; chips are small
   and colours are blocks, which keeps the extra rows few. */
function chipGroup(state, key, label, values, text) {
  if (!values.length) return '';
  return '<span class="fgroup" role="group" aria-label="' + esc(label) + '"><span class="fg-label">' + esc(label) + '</span>' +
    values.map(function (v) {
      if (text === colourSwatch && productHex(v)) return colourChip(state, key, v);
      return chip('data-chip-key="' + key + '" data-chip-val="' + esc(v) + '"', text ? text(v) : esc(v), isOnChip(state, key, v));
    }).join('') + '</span>';
}
// A colour filter is the colour itself: a bright block, its name in the tooltip and for screen
// readers. Picked = blue ring and a tick.
function colourChip(state, key, v) {
  var hex = productHex(v);
  return chip('data-chip-key="' + key + '" data-chip-val="' + esc(v) + '" title="' + esc(v) + '" aria-label="' + esc(v) + '"',
    '<i class="cblock" style="background:' + productFill(v) + ';color:' + inkOn(hex) + '" aria-hidden="true"></i>',
    isOnChip(state, key, v), 'chip-color');
}
// "1.2 LTR" → "1.2" (the group label says litres); anything else, e.g. CAPS, as typed.
function sizeChipText(v) {
  var m = /^\s*([\d.]+)\s*LTR?S?\s*$/i.exec(v);
  return m ? esc(m[1]) : esc(v);
}
// Colour as a block in a table/card cell (name kept for tooltips and screen readers).
function colourBlockHtml(c) {
  var hex = productHex(c);
  if (!hex) return esc(c || '—');
  return '<i class="cblock cblock-cell" style="background:' + productFill(c) + '" title="' + esc(c) + '" aria-hidden="true"></i><span class="sr-only">' + esc(c) + '</span>';
}
function filterLine(inner) { return inner ? '<div class="fline">' + inner + '</div>' : ''; }
// A small inline dropdown in the same pill style as the sort menu.
function miniSelect(key, label, options, allLabel, state, attr) {
  var html = '<label class="tb-sort"><span class="fg-label">' + esc(label) + '</span><select ' + attr + '="' + key + '">';
  if (allLabel) html += '<option value="">' + esc(allLabel) + '</option>';
  options.forEach(function (o) {
    var v = typeof o === 'object' ? o.value : o, t = typeof o === 'object' ? o.text : o;
    html += '<option value="' + esc(v) + '"' + (String(state[key]) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
  });
  return html + '</select></label>';
}
function colourSwatch(c) {
  var hex = productHex(c);
  return (hex ? '<i class="pm-sw" style="background:' + productFill(c) + '" aria-hidden="true"></i>' : '') + esc(c);
}

var STATUS_ORDER = ['OTIF', 'Late', 'Short', 'Late + Short', 'On plan', 'Open line'];
function statusChips(state, statuses) {
  var rank = function (st) { var i = STATUS_ORDER.indexOf(st); return i === -1 ? 99 : i; };
  return statuses.slice().sort(function (a, b) { return rank(a) - rank(b); }).map(function (st) {
    return chip('data-chip-key="status" data-chip-val="' + esc(st) + '"',
      '<span aria-hidden="true">' + (STATUS_ICONS[st] || '–') + '</span> ' + esc(st), isOnChip(state, 'status', st));
  }).join('');
}

function machineOptions(items) {
  return uniqueSorted(items.map(function (x) { return x.usualMachine; })).map(function (m) {
    return { value: String(m), text: 'Machine ' + m };
  });
}
// Brand / Type / Colour / Usual machine chip groups — the second filter line of the Completed
// tabs and Summary. `items` carry brand, code, color and usualMachine. `extra` is appended
// (Summary's PO and sort menus).
function attrFilterLine(state, items, extra) {
  var pick = function (f) { return uniqueSorted(items.map(f)).map(String); };
  return filterLine(
    chipGroup(state, 'type', 'Type', pick(function (x) { return productType(x.code); })) +
    chipGroup(state, 'machine', 'Machine', pick(function (x) { return x.usualMachine; })) +
    chipGroup(state, 'brand', 'Brand', pick(function (x) { return x.brand; })) +
    chipGroup(state, 'color', 'Colour', pick(function (x) { return x.color; }), colourSwatch) +
    (extra || ''));
}

function istToday() { return new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 10); }
function monthRange(y, m) {   // m 0-11, may be -1 (December of the year before)
  var start = new Date(Date.UTC(y, m, 1)), end = new Date(Date.UTC(y, m + 1, 0));
  return { from: start.toISOString().slice(0, 10), to: end.toISOString().slice(0, 10) };
}
function presetRange(p) {
  var t = istToday(), y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)) - 1;
  if (p === 'tm') return monthRange(y, m);
  if (p === 'lm') return monthRange(y, m - 1);
  if (p === 'ty') return { from: y + '-01-01', to: y + '-12-31' };
  return { from: '', to: '' };
}

// withGroups: the tab has groups on screen, so the sort menu and collapse button join the row.
function listControls(withGroups) {
  var all = judgedLines();
  var more = selCount(LIST, LIST_MORE);
  var custom = LIST.preset === 'custom' && (LIST.from || LIST.to);
  var any = LIST.status.length || more || LIST.from || LIST.to;
  // Clear leads the row: on a phone the row scrolls sideways, and the way out of a filter
  // must be visible without scrolling.
  var html = toolbarHtml((any ? chip('id="listReset"', '<span aria-hidden="true">✕</span> Clear', false, 'chip-clear') : '') +
    (withGroups ? sortSelectHtml() : '') +
    statusChips(LIST, uniqueSorted(all.map(statusWord))) +
    '<span class="chip-sep" aria-hidden="true"></span>' +
    chip('data-preset="tm"', 'This month', LIST.preset === 'tm') +
    chip('data-preset="lm"', 'Last month', LIST.preset === 'lm') +
    chip('data-preset="ty"', 'This year', LIST.preset === 'ty') +
    chip('data-panel="dates"', '<span aria-hidden="true">📅</span> ' + (custom ? esc((LIST.from || '…') + ' → ' + (LIST.to || '…')) : 'Dates'),
      LIST._panel === 'dates' || custom)) + attrFilterLine(LIST, all);
  if (LIST._panel === 'dates') {
    html += '<div class="chip-panel">' +
      sumSelect('dateBy', 'Date by', [{ value: 'delivered', text: VIEW === 'dinvoice' ? 'Invoice date' : 'Delivered date' },
        { value: 'po', text: 'PO date' }], '', LIST, 'data-list') +
      '<label class="sum-field"><span>From</span><input type="date" data-list="from" value="' + esc(LIST.from) + '"></label>' +
      '<label class="sum-field"><span>To</span><input type="date" data-list="to" value="' + esc(LIST.to) + '"></label>' +
      '</div>';
  }
  return html;
}

// Wires a chip bar to its state object. Shared by the line tabs (LIST) and Summary (SUM).
function bindChips(mainEl, state, attr) {
  mainEl.querySelectorAll('[data-chip-key]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.dataset.chipKey, v = b.dataset.chipVal;
      state[k] = Array.isArray(state[k]) ? toggleSel(state[k], v) : (state[k] === v ? '' : v);
      render();
    });
  });
  mainEl.querySelectorAll('[data-panel]').forEach(function (b) {
    b.addEventListener('click', function () {
      state._panel = state._panel === b.dataset.panel ? '' : b.dataset.panel;
      render();
    });
  });
  mainEl.querySelectorAll('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.dataset.preset === state.preset ? '' : b.dataset.preset;
      var r = presetRange(p);
      state.preset = p; state.from = r.from; state.to = r.to;
      render();
    });
  });
  mainEl.querySelectorAll('[' + attr + ']').forEach(function (el) {
    el.addEventListener('change', function () {
      var k = el.getAttribute(attr);
      state[k] = el.value;
      if (k === 'from' || k === 'to') state.preset = 'custom';
      render();
    });
  });
}


function bindListControls(mainEl) {
  bindChips(mainEl, LIST, 'data-list');
  var rs = document.getElementById('listReset');
  if (rs) rs.addEventListener('click', function () { LIST = Object.assign({}, LIST_DEFAULT); render(); });
}

function completedLines() {
  var lines = judgedLines().filter(function (l) { return passesPicked(l.code) && passesList(l); });
  if (!FILTER) return lines;
  var q = FILTER.toLowerCase();
  return lines.filter(function (l) {
    return [l.code, l.name, l.po].some(function (v) { return String(v).toLowerCase().indexOf(q) !== -1; })
      || l.invoices.some(function (i) { return String(i.no).toLowerCase().indexOf(q) !== -1; });
  });
}

function scoreLines(lines) {
  var judged = lines.filter(function (l) { return l.status === 'ok'; });
  var count = function (k) { return judged.filter(function (l) { return l[k]; }).length; };
  return { lines: lines.length, judged: judged.length, otd: count('otd'), otif: count('otif'),
    inFull: count('inFull') };
}

/* Rows of the active tab, grouped. By Invoice lists one row per shipment, so a line split over
   three invoices appears under each with that invoice's quantity, judged on THAT invoice's
   date. By PO / By Product list one row per line, judged on its last invoice. */
function completedGroups(lines) {
  var groups = {}, order = [];
  function add(key, label, sortKey, row) {
    if (!groups[key]) { groups[key] = { label: label, sortKey: sortKey, rows: [] }; order.push(key); }
    groups[key].rows.push(row);
    if (sortKey > groups[key].sortKey) groups[key].sortKey = sortKey;
  }
  lines.forEach(function (l) {
    if (VIEW === 'dinvoice') {
      if (!l.invoices.length) { add('~none', 'No invoice recorded', '', { line: l, inv: null }); return; }
      l.invoices.forEach(function (i) {
        if (LIST.dateBy !== 'po' && !inRange(i.date)) return;
        add(i.no, i.no + ' · ' + fmtIso(i.date), i.date || '', { line: l, inv: i });
      });
    } else if (VIEW === 'dpo') {
      add(l.po, l.po, l.delivered || l.poDate || '', { line: l });
    } else {
      add(l.code, l.code + ' — ' + l.name, l.code, { line: l });
    }
  });
  sortCompletedOrder(order, groups);
  order.forEach(function (k) { groups[k].rows.sort(completedRowCmp); });
  return { groups: groups, order: order };
}

function leftToSupply(rows) {
  return rows.reduce(function (a, r) { return a + Math.max(0, r.line.orderQty - r.line.supplied); }, 0);
}
function suppliedOf(rows) { return rows.reduce(function (a, r) { return a + r.line.supplied; }, 0); }

// sortKey is the group's latest date (invoice date, or last delivery for By PO).
function sortCompletedOrder(order, groups) {
  var s = groupSort();
  var byDateDesc = function (a, b) { return groups[a].sortKey < groups[b].sortKey ? 1 : groups[a].sortKey > groups[b].sortKey ? -1 : 0; };
  order.sort(function (a, b) {
    if (a === '~none' || b === '~none') return a === '~none' ? 1 : -1;   // "No invoice" stays last
    // Several invoices share a day; the invoice number breaks the tie so they run in sequence.
    if (VIEW === 'dinvoice') return s === 'old' ? (byDateDesc(b, a) || cmpNat(a, b)) : (byDateDesc(a, b) || cmpNat(b, a));
    if (s === 'last') return byDateDesc(a, b) || cmpNat(b, a);
    if (s === 'left') return leftToSupply(groups[b].rows) - leftToSupply(groups[a].rows) || cmpNat(a, b);
    if (s === 'supplied') return suppliedOf(groups[b].rows) - suppliedOf(groups[a].rows) || cmpNat(a, b);
    if (s === 'old' || s === 'code') return cmpNat(a, b);
    return cmpNat(b, a);   // 'new'
  });
}

// By PO lists its products by code; By Invoice its lines by PO (newest) then code; By Product
// its POs newest first.
function completedRowCmp(a, b) {
  if (VIEW === 'dpo') return cmpNat(a.line.code, b.line.code);
  if (VIEW === 'dinvoice') return cmpNat(b.line.po, a.line.po) || cmpNat(a.line.code, b.line.code);
  return String(b.line.poDate || '').localeCompare(String(a.line.poDate || '')) || cmpNat(b.line.po, a.line.po);
}

function completedColumns() {
  var base = [
    { th: 'Code', td: function (r) { return codeChipHtml(r.line.code, r.line.color, 'code-chip'); }, cls: 'data-col' },
    { th: 'Item', td: function (r) { return esc(r.line.name); }, cls: 'data-col' },
    { th: 'PO Date', td: function (r) { return fmtIso(r.line.poDate); } },
    { th: 'Due', td: function (r) { return fmtIso(r.line.due); } },
  ];
  // By PO already names the PO in its group header.
  if (VIEW !== 'dpo') base.splice(2, 0, { th: 'PO', td: function (r) { return esc(r.line.po); }, cls: 'txt' });
  if (VIEW === 'dinvoice') {
    return base.concat([
      { th: 'Shipped', td: function (r) { return r.inv ? fmtNum(r.inv.qty) : '—'; } },
      { th: 'vs Due', td: function (r) { return fmtLate(shipmentLate(r)); } },
      { th: 'Line status', td: function (r) { return statusBadge(r.line); }, cls: 'txt' },
    ]);
  }
  return base.concat([
    { th: 'Order Qty', td: function (r) { return fmtNum(r.line.orderQty); } },
    { th: 'Supplied', td: function (r) { return fmtNum(r.line.supplied); } },
    { th: 'Fill', td: function (r) { return r.line.orderQty ? pct(r.line.supplied, r.line.orderQty) : '—'; } },
    { th: 'Invoices', td: function (r) {
      return r.line.invoices.length ? esc(r.line.invoices.map(function (i) { return i.no; }).join(', ')) : '—';
    }, cls: 'invs' },
    { th: 'Delivered', td: function (r) { return fmtIso(r.line.delivered); } },
    { th: 'vs Due', td: function (r) { return fmtLate(r.line.late); } },
    { th: 'Status', td: function (r) { return statusBadge(r.line); }, cls: 'txt' },
  ]);
}

function shipmentLate(r) {
  if (!r.inv || !r.inv.date || !r.line.due) return null;
  return dayNum(r.inv.date) - dayNum(r.line.due);
}

function groupSummary(rows) {
  if (VIEW === 'dinvoice') {
    var judged = rows.filter(function (r) { return shipmentLate(r) !== null; });
    var onTime = judged.filter(function (r) { return shipmentLate(r) <= 0; }).length;
    var qty = rows.reduce(function (a, r) { return a + (r.inv ? r.inv.qty : 0); }, 0);
    return pctChip('On time', onTime, judged.length) + '<span class="sub">' +
      rows.length + ' line' + (rows.length === 1 ? '' : 's') + ' · ' + fmtNum(qty) + ' pcs</span>';
  }
  var ls = rows.map(function (r) { return r.line; });
  var s = scoreLines(ls);
  var onPlan = ls.filter(function (l) { return l.onPlan; }).length;
  var ordered = ls.reduce(function (a, l) { return a + l.orderQty; }, 0);
  var chipHtml = (!s.judged && onPlan) ? '<span class="st st-na">○ On plan</span>' : pctChip('OTIF', s.otif, s.judged);
  return chipHtml + '<span class="sub">' +
    s.lines + ' line' + (s.lines === 1 ? '' : 's') + (onPlan ? ' · ' + onPlan + ' on plan' : '') +
    ' · ' + fmtNum(suppliedOf(rows)) + ' / ' + fmtNum(ordered) + ' supplied · OTD ' + pct(s.otd, s.judged) + '</span>';
}

function renderCompleted() {
  var mainEl = document.getElementById('main');
  mainEl.setAttribute('aria-busy', 'false');
  if (!COMPLETED) {
    mainEl.innerHTML = '<div class="empty">Completed lines are not available from the sheet yet.</div>';
    return;
  }
