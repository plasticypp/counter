var filterInput = document.getElementById('filterInput');
var filterWrap = document.querySelector('.filter-wrap');
var filterClear = document.getElementById('filterClear');
var filterList = document.getElementById('filterList');
var pickTags = document.getElementById('pickTags');

/* ---------------------------------------------------------------------------
   Search box: free text, or picked products.

   With no product picked, typing filters the view directly (code, name, PO, invoice).
   Picking products from the dropdown adds them as tags, and the view then shows lines for
   ANY of them; while tags are present the typed text only searches the dropdown, so typing
   a second product's name cannot narrow the view to nothing by accident. PICKED is shared by
   Open and Completed (it is one search box), and the other filters still apply on top.
   --------------------------------------------------------------------------- */
var PICKED = [];                       // product codes, in the order picked
var SUGGEST = { items: [], active: -1 };
var SUGGEST_MAX = 8;
var filterTimer = null;

function isPicked(code) { return PICKED.indexOf(code) !== -1; }
function passesPicked(code) { return !PICKED.length || isPicked(code); }

// The view filter follows the typed text only while nothing is picked.
function syncFilter() {
  FILTER = PICKED.length ? '' : filterInput.value.trim();
  filterWrap.classList.toggle('has-value', !!(PICKED.length || filterInput.value.trim()));
  filterWrap.classList.toggle('has-tags', PICKED.length > 0);
  filterInput.placeholder = PICKED.length ? 'add another product…' : 'filter code, name or PO…';
}

function clearFilter() {
  filterInput.value = '';
  PICKED = [];
  renderTags();
  syncFilter();
  hideSuggest();
  render();
  filterInput.focus();
}

// Debounced: render() rebuilds all three renderings, so an undebounced keystroke handler
// rebuilt the entire board on every character typed.
filterInput.addEventListener('input', function () {
  renderSuggest();
  filterWrap.classList.toggle('has-value', !!(PICKED.length || filterInput.value.trim()));
  if (PICKED.length) return;   // text is only searching the dropdown
  clearTimeout(filterTimer);
  filterTimer = setTimeout(function () { syncFilter(); render(); }, 140);
});
filterClear.addEventListener('click', clearFilter);

// Products the dropdown can offer: the ones the current mode has lines for, so every
// suggestion leads to rows. Names come with the lines (Masters, via the sheet).
function productsForMode() {
  var byCode = {};
  var add = function (code, name, color, qty) {
    var p = byCode[code] || (byCode[code] = { code: code, name: name || code, color: color, lines: 0, qty: 0 });
    p.lines++; p.qty += qty;
  };
  if (MODE === 'done') {
    if (COMPLETED) COMPLETED.lines.forEach(function (l) { add(l.code, l.name, l.color, l.supplied); });
  } else {
    ROWS.concat(UNPLANNED).forEach(function (r) {
      if (!(Number(r.balance) > 0)) return;     // the Open board only shows lines with a balance
      add(r.code, r.name, r.color, Number(r.balance) || 0);
    });
  }
  return Object.keys(byCode).map(function (k) { return byCode[k]; });
}

// Every typed word must appear in the code or the name, so "grey arzol 3" finds
// "ARZOL 3 LTR GREY BOTTEL". Matches at the start of the code or name rank first.
function matchProducts(q) {
  var words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  var starts = function (p) {
    return (p.code.toLowerCase().indexOf(words[0]) === 0 || String(p.name).toLowerCase().indexOf(words[0]) === 0) ? 0 : 1;
  };
  return productsForMode().filter(function (p) {
    var hay = (p.code + ' ' + p.name).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  }).sort(function (a, b) { return starts(a) - starts(b) || b.qty - a.qty || cmpNat(a.code, b.code); });
}

// Bold the typed words inside a plain string, escaping every piece.
function markWords(text, q) {
  text = String(text);
  var words = q.toLowerCase().split(/\s+/).filter(Boolean);
  var lower = text.toLowerCase(), hit = new Array(lower.length).fill(false);
  words.forEach(function (w) {
    for (var i = lower.indexOf(w); i !== -1; i = lower.indexOf(w, i + 1)) {
      for (var j = i; j < i + w.length; j++) hit[j] = true;
    }
  });
  var out = '', run = '', on = false;
  for (var c = 0; c <= lower.length; c++) {
    if (c === lower.length || hit[c] !== on) {
      out += on ? '<mark>' + esc(run) + '</mark>' : esc(run);
      run = ''; on = hit[c];
    }
    if (c < lower.length) run += text.charAt(c);
  }
  return out;
}

function hideSuggest() {
  filterList.hidden = true;
  filterList.innerHTML = '';
  SUGGEST = { items: [], active: -1 };
  filterInput.setAttribute('aria-expanded', 'false');
  filterInput.removeAttribute('aria-activedescendant');
}

function renderSuggest() {
  var q = filterInput.value.trim();
  if (!q) { hideSuggest(); return; }
  var keepActive = SUGGEST.active;
  var all = matchProducts(q);
  SUGGEST = { items: all.slice(0, SUGGEST_MAX), active: -1 };
  if (!all.length) {
    filterList.innerHTML = '<li class="fl-empty" role="option" aria-disabled="true">No product matches “' + esc(q) + '”</li>';
  } else {
    var unit = MODE === 'done' ? 'line' : 'open line';
    var hint = PICKED.length
      ? PICKED.length + ' picked · tap to add or remove · Esc to close'
      : 'Select one or more products';
    filterList.innerHTML = '<li class="fl-hint" role="presentation">' + esc(hint) + '</li>' + SUGGEST.items.map(function (p, i) {
      var on = isPicked(p.code);
      return '<li role="option" id="fl-' + i + '" data-i="' + i + '" aria-selected="' + on + '"' + (on ? ' class="is-picked"' : '') + '>' +
        '<span class="fl-tick" aria-hidden="true">✓</span>' +
        codeChipHtml(p.code, p.color, 'code-chip') +
        '<span class="fl-name">' + markWords(p.name, q) + '</span>' +
        '<span class="fl-n">' + p.lines + ' ' + unit + (p.lines === 1 ? '' : 's') + '</span></li>';
    }).join('') + (all.length > SUGGEST_MAX
      ? '<li class="fl-empty" role="option" aria-disabled="true">+' + (all.length - SUGGEST_MAX) + ' more — keep typing</li>' : '');
  }
  filterList.hidden = false;
  filterInput.setAttribute('aria-expanded', 'true');
  if (keepActive >= 0 && keepActive < SUGGEST.items.length) setActive(keepActive);
}

function setActive(i) {
  var n = SUGGEST.items.length;
  if (!n) return;
  SUGGEST.active = (i + n) % n;
  filterList.querySelectorAll('li[data-i]').forEach(function (li) {
    var on = Number(li.dataset.i) === SUGGEST.active;
    li.classList.toggle('is-active', on);
    if (on) li.scrollIntoView({ block: 'nearest' });
  });
  filterInput.setAttribute('aria-activedescendant', 'fl-' + SUGGEST.active);
}

// Tags carry the product's own name as a tooltip; the code alone is what fits on a phone.
// A tag picked on one mode may have no lines on the other, so the name is looked up in both.
function productName(code) {
  var all = ROWS.concat(UNPLANNED).concat(COMPLETED ? COMPLETED.lines : []);
  for (var i = 0; i < all.length; i++) if (all[i].code === code) return all[i].name;
  return code;
}
function renderTags() {
  pickTags.innerHTML = PICKED.map(function (code) {
    return '<span class="ptag" title="' + esc(productName(code)) + '">' + esc(code) +
      '<button type="button" class="ptag-x" data-code="' + esc(code) + '" aria-label="Remove ' + esc(code) + '">✕</button></span>';
  }).join('');
}

// Toggle a product in or out of the picked set. The list stays open with its ticks
// updated, so several products can be picked from one search.
// The typed text and the open list are kept after EVERY pick, including the first: closing
// the list on the first pick made it read as a single-select box.
function togglePick(code) {
  if (isPicked(code)) PICKED = PICKED.filter(function (c) { return c !== code; });
  else PICKED = PICKED.concat([code]);
  clearTimeout(filterTimer);
  renderTags();
  syncFilter();
  render();
  renderSuggest();
  filterInput.focus();
}

filterInput.addEventListener('keydown', function (e) {
  if (e.key === 'Backspace' && !filterInput.value && PICKED.length) {
    togglePick(PICKED[PICKED.length - 1]);
    e.preventDefault();
    return;
  }
  if (filterList.hidden) {
    if (e.key === 'ArrowDown' && filterInput.value.trim()) { renderSuggest(); setActive(0); e.preventDefault(); }
    return;
  }
  if (e.key === 'ArrowDown') { setActive(SUGGEST.active + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { setActive(SUGGEST.active - 1); e.preventDefault(); }
  else if (e.key === 'Enter') {
    if (SUGGEST.active >= 0) { togglePick(SUGGEST.items[SUGGEST.active].code); e.preventDefault(); }
    else hideSuggest();
  } else if (e.key === 'Escape') { hideSuggest(); e.preventDefault(); }
});
// mousedown, not click: a click fires after the input's blur, which has already closed the list.
filterList.addEventListener('mousedown', function (e) {
  var li = e.target.closest('li[data-i]');
  e.preventDefault();
  if (!li) return;
  SUGGEST.active = Number(li.dataset.i);
  togglePick(SUGGEST.items[SUGGEST.active].code);
});
pickTags.addEventListener('click', function (e) {
  var x = e.target.closest('.ptag-x');
  if (x) togglePick(x.dataset.code);
});
// Clicking the empty part of the box puts the cursor in the input.
document.getElementById('searchBox').addEventListener('mousedown', function (e) {
  if (e.target === this) { e.preventDefault(); filterInput.focus(); }
});
filterInput.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== filterInput) hideSuggest(); }, 150); });
filterInput.addEventListener('focus', function () { if (filterInput.value.trim()) renderSuggest(); });

function showLoadError(err) {
  // The raw error is logged, never printed: it leaked internal strings such as
  // "GAS_URL secret not configured" onto a page with no authentication. If we already have
  // data on screen, keep it — a failed refresh should not blank a working board.
  console.error('dispatch load failed:', err);
  LAST_ERROR = err && err.message ? err.message : String(err);
  var box = document.getElementById('clock');
  var text = document.getElementById('freshText');
  box.classList.remove('is-fresh', 'is-aging');
  box.classList.add('is-stale');
  text.textContent = LAST_OK ? 'Update failed — showing older data' : 'Could not load';
  if (!ROWS.length) {
    // Name the actual failure. "Couldn't reach the schedule" was shown for every cause —
    // including a page left open long enough to be running stale code — which sent people
    // looking for a network problem that did not exist.
    var hint = /timed out/i.test(LAST_ERROR)
      ? 'The schedule server took too long to answer. It is usually slow rather than down.'
      : 'Could not load the schedule. If this persists, reload the page with Ctrl+Shift+R — '
        + 'the browser may be holding an old copy.';
    document.getElementById('main').innerHTML =
      '<div class="empty">' + hint
      + ' <button type="button" class="linkish" id="retryBtn">Try again</button></div>';
    var rb = document.getElementById('retryBtn');
    if (rb) rb.addEventListener('click', function () { load(true); });
  }
}

var loadInFlight = false;

/* `force` marks a person asking rather than a timer.
   Both paths now go through the edge cache. `cache: 'no-store'` used to be set here, which
   defeated it — every manual refresh, and every tab regaining focus, went straight to Apps
   Script. With several viewers that queued the script until it shed requests as 404s. The
   cache is only 45s old at worst, which is well inside what a schedule board needs. */
function load(force) {
  // A manual click landing on top of a scheduled tick would double the request cost for one
  // result; the second caller just rides along with the first.
  if (loadInFlight) return Promise.resolve();
  loadInFlight = true;

  // 60s, not 30. Apps Script has been measured at 23s for a single call, and the worker now
  // retries up to three times behind this request — so a bound tight enough to cut off a
  // slow-but-working response would manufacture the very failure it reports.
  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 60000);

  var opts = {};
  if (ctrl) opts.signal = ctrl.signal;

  return fetch('/api/data', opts)
    .then(function (r) {
      clearTimeout(timer);
      // Without an ok check, a 500 returning valid JSON fell through to an empty board that
      // read as "no jobs scheduled" rather than as a failure.
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      if (data && data.error) throw new Error(data.error);
      ROWS = (data && data.rows) || [];
      UNPLANNED = (data && data.unplanned) || [];
      GRID_START = (data && data.gridStart) ? new Date(data.gridStart) : null;
      COMPLETED = (data && data.completed) || null;
      // A served-from-fallback payload is real data, but it is NOT current: the upstream is
      // throttling. Don't advance the freshness stamp, or the board would claim to be up to
      // date while showing an older schedule.
      SERVING_STALE = !!(data && data.stale);
      if (!SERVING_STALE) LAST_OK = new Date();
      render();
      paintFreshness();
    })
    .catch(function (err) {
      clearTimeout(timer);
      // An aborted fetch reports as "AbortError", which tells the user nothing.
      showLoadError(err && err.name === 'AbortError'
        ? new Error('Request timed out after 60 seconds')
        : err);
    })
    .then(function () { loadInFlight = false; });
}

window.addEventListener('resize', measureFrozenOffset);

/* ---------------------------------------------------------------------------
   Polling policy.

   A fixed 60s timer meant a wall tablet left open all shift made ~480 Apps
   Script calls a day for a schedule that changes a handful of times — and it
   kept polling while the tab sat in the background, where nobody could see the
   result. Requests are the expensive thing here (Apps Script is slow and rate
   limited), so the page now only fetches when someone is actually looking:

     - hidden tab            -> no polling at all
     - visible but untouched -> polls until IDLE_AFTER, then stops
     - returning to the tab  -> one immediate fetch, timer restarts
     - interacting again     -> idle clock resets

   The freshness stamp keeps the whole thing honest: when polling has stopped,
   the header says so rather than implying the numbers are current.
   --------------------------------------------------------------------------- */
var POLL_EVERY = 120000;   // 2 min between fetches while watched — the sheet is edited
                           // a few times a day, so this is already generous.
var IDLE_AFTER = 300000;   // 5 min without interaction and we stop entirely. A wall
                           // display is "idle" by nature, so the visibility check is what
                           // protects it; this covers a forgotten desktop tab.
var pollTimer = null;
var lastInteraction = Date.now();

function pollingWanted() {
  return document.visibilityState === 'visible'
    && (Date.now() - lastInteraction) < IDLE_AFTER;
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(function () {
    if (!pollingWanted()) { stopPolling(); paintFreshness(); return; }
    load();
  }, POLL_EVERY);
}

/* Any sign of a human resets the idle clock. If polling had stopped and the data has
   gone stale meanwhile, fetch immediately rather than making them wait for the tick. */
function noteInteraction() {
  var wasIdle = !pollingWanted();
  lastInteraction = Date.now();
  if (wasIdle) {
    if (!LAST_OK || (Date.now() - LAST_OK.getTime()) > POLL_EVERY) load();
    startPolling();
    paintFreshness();
  }
}
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (evt) {
  document.addEventListener(evt, noteInteraction, { passive: true });
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    // Coming back to the tab is itself an interaction: refresh now, resume polling.
    lastInteraction = Date.now();
    load();
    startPolling();
  } else {
    stopPolling();
  }
});

// Clicking the stamp is both a manual refresh and an interaction, so it resumes polling.
document.getElementById('clock').addEventListener('click', function () {
  lastInteraction = Date.now();
  load(true);
  startPolling();
});

load();
startPolling();
// Re-render the stamp between fetches so "3 min ago" keeps counting up honestly. This is a
// local DOM update, not a request, so it is cheap — but it also stops while hidden.
setInterval(function () {
  if (document.visibilityState === 'visible') paintFreshness();
}, 30000);
</script>
