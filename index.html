<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e40af">
  <title>YPP Counter Entry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #1e40af; }
    #loader {
      position: fixed; inset: 0; background: #eef0f4;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; z-index: 10;
      transition: opacity .3s;
    }
    .sp-card  { display: flex; align-items: center; gap: 10px; }
    .sp-badge {
      width: 40px; height: 40px; border-radius: 10px; background: #1e40af; color: #fff;
      display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: .5px;
    }
    .sp-titles { display: flex; flex-direction: column; line-height: 1.15; }
    .sp-title { color: #1e40af; font-size: 17px; font-weight: 800; }
    .sp-sub   { color: #666e7d; font-size: 12px; font-weight: 500; }
    .sp-spin  {
      width: 30px; height: 30px;
      border: 3px solid rgba(30,64,175,.15);
      border-top-color: #1e40af;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .sp-spin { animation-duration: 2s; } }
    #app {
      position: fixed; inset: 0;
      width: 100%; height: 100%; border: none;
      opacity: 0; transition: opacity .3s;
    }
    #app.ready { opacity: 1; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0e1014; }
      #loader { background: #0e1014; }
      .sp-title { color: #8aa5ff; }
      .sp-sub { color: #98a0ad; }
      .sp-badge { background: #8aa5ff; color: #0e1014; }
      .sp-spin { border-color: rgba(138,165,255,.18); border-top-color: #8aa5ff; }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="sp-card">
      <div class="sp-badge">YPP</div>
      <div class="sp-titles">
        <div class="sp-title">Counter Entry</div>
        <div class="sp-sub">Loading&hellip; / लोड हो रहा है</div>
      </div>
    </div>
    <div class="sp-spin"></div>
  </div>
  <iframe
    id="app"
    src=""
    allow="accelerometer; camera; encrypted-media; geolocation; gyroscope; microphone"
    allowfullscreen
    title="YPP Counter Entry"
  ></iframe>
  <script>
    var base = "https://script.google.com/macros/s/AKfycbzCNGMGvSk9xpGkeSJGO5Rvbu76oQS7jfCmkqrvnxGnv8CF6XsgiexDeoJXoi8aUM7V/exec";

    // Carry the query string through so ?machine=5 deep-links from a per-machine QR,
    // and default to the counter page when no action is given.
    var qs = window.location.search || '';
    if (qs.indexOf('action=') === -1) {
      qs = qs ? qs + '&action=counter' : '?action=counter';
    }
    var app = document.getElementById('app');
    var loader = document.getElementById('loader');
    app.src = base + qs;

    app.addEventListener('load', function () {
      app.classList.add('ready');
      loader.style.opacity = '0';
      setTimeout(function () { loader.style.display = 'none'; }, 300);
    });
    // Fallback: Apps Script's load event is not always reliable inside an iframe, so
    // reveal the frame regardless after 12s rather than leaving a spinner forever.
    setTimeout(function () {
      app.classList.add('ready');
      loader.style.display = 'none';
    }, 12000);
  </script>
</body>
</html>
